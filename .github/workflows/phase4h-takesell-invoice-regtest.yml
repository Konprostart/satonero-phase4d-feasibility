          r='pass' if violations==0 else 'fail'
          with open(OUT,'a') as f: f.write(f'check=hex_run_allowlist result={r} count={violations}\n')
          PY
          if grep -q '^shape=preinvoice_handshake_ok$' "$RUNNER_TEMP/shape.txt" && grep -q '^shape=invoice_handshake_ok$' "$RUNNER_TEMP/invoice_shape.txt"; then r=pass; n=0; else r=fail; n=1; fi
