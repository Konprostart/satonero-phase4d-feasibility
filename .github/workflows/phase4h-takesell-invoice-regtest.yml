          plain_names=('maker_neworder.plain','maker_ack.plain','taker_take_sell.plain','taker_add_invoice14.plain','maker_waiting_buyer_invoice14.plain','taker_add_invoice_request.plain','maker_pay_invoice14.plain','taker_waiting_seller_to_pay14.plain')
