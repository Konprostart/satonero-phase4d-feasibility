          elif any(v in ('AMBIGUOUS_ACK','AMBIGUOUS_REPLY') for v in (maker,taker,addinv)):
              result='INCONCLUSIVE'
          elif maker=='SELECTED' and taker=='SELECTED' and addinv=='SELECTED':
              if not complete: result='INCONCLUSIVE'
              elif verify_failure: result='FAIL'
              elif validation=='success' and c1=='success' and invoice=='success' and verify_success: result='PASS'
