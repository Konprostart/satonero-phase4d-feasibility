          assert any(t==['k','sell'] for t in ev['tags'])
          assert ev['content']==''
          out.write_text('shape=invoice_handshake_ok\n')
          print('invoice handshake ok; payout and hold invoices withheld')
          PY
      - name: Assert no payment, channel, bond or settlement activity
        id: no_payment_gate
        if: always()
        continue-on-error: true
        working-directory: mostro-regtest
        run: |
          set +x
          set -euo pipefail
          check_node() {
            svc=$1
            ln() { docker compose exec -T --user lnd "$svc" lncli --network=regtest --rpcserver=localhost:10001 "$@"; }
            # Any lncli or jq failure aborts the gate; malformed shapes are rejected
            # explicitly so a missing or mistyped field can never read as zero.
            inv=$(ln listinvoices)
            printf '%s' "$inv" | jq -e 'type=="object" and (.invoices|type=="array") and all(.invoices[]; (.state|type)=="string")' > /dev/null
            settled=$(printf '%s' "$inv" | jq '[.invoices[] | select(.state=="SETTLED")] | length')
            accepted=$(printf '%s' "$inv" | jq '[.invoices[] | select(.state=="ACCEPTED")] | length')
            pay=$(ln listpayments --include_incomplete)
            printf '%s' "$pay" | jq -e 'type=="object" and (.payments|type=="array") and all(.payments[]; type=="object")' > /dev/null
            payments=$(printf '%s' "$pay" | jq '.payments | length')
            chans=$(ln listchannels)
            printf '%s' "$chans" | jq -e 'type=="object" and (.channels|type=="array")' > /dev/null
            channels=$(printf '%s' "$chans" | jq '.channels | length')
            pend=$(ln pendingchannels)
            printf '%s' "$pend" | jq -e 'type=="object" and (.pending_open_channels|type=="array") and (.pending_closing_channels|type=="array") and (.pending_force_closing_channels|type=="array") and (.waiting_close_channels|type=="array")' > /dev/null
            pending=$(printf '%s' "$pend" | jq '((.pending_open_channels|length) + (.pending_closing_channels|length) + (.pending_force_closing_channels|length) + (.waiting_close_channels|length))')
            test "$settled" = 0
            test "$accepted" = 0
            test "$payments" = 0
            test "$channels" = 0
            test "$pending" = 0
            echo "no-payment gate $svc: settled=$settled accepted=$accepted payments=$payments channels=$channels pending=$pending"
          }
          check_node mostro_lnd
          check_node bob_lnd
