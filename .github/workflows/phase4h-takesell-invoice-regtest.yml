          import json, pathlib, re, sys
          e=pathlib.Path(sys.argv[1]); order_id=pathlib.Path(sys.argv[2]).read_text().strip(); daemon=pathlib.Path(sys.argv[3]).read_text().strip().lower(); out=pathlib.Path(sys.argv[4])
