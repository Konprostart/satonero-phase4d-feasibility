          import json, os, re, sys
          E,OUT=sys.argv[1:3]; pubs={open(p).read().strip().lower() for p in sys.argv[3:] if os.path.isfile(p) and os.path.getsize(p)}; hexrun=re.compile(r'[0-9a-fA-F]+')
          eventfiles=('maker_neworder14.json','maker_ack14.json','taker_take_sell14.json','taker_add_invoice14.json','maker_waiting_buyer_invoice14.json','order38383.initial.json','order38383.updated.json')
          ids=set(pubs); sigs=set(); texts=[]
          for name in eventfiles:
              path=os.path.join(E,name)
              if not os.path.isfile(path): continue
              ev=json.loads(open(path).read()); ids.update([ev['id'].lower(),ev['pubkey'].lower()]); sigs.add(ev['sig'].lower()); ev=dict(ev); ev.pop('content',None); texts.append(json.dumps(ev,sort_keys=True))
          for name in ('maker_neworder.plain','maker_ack.plain','taker_take_sell.plain','taker_add_invoice14.plain','maker_waiting_buyer_invoice14.plain'):
              path=os.path.join(E,name)
              if not os.path.isfile(path): continue
              texts.append(json.dumps(json.loads(open(path).read())[0],sort_keys=True))
