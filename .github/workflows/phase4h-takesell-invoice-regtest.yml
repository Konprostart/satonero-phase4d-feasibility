          assert not add['payload']['order'].get('buyer_invoice') and not add['payload']['order'].get('cashu_mint_url')
          assert 'payment_request' not in add['payload']
          assert 'lnbc' not in json.dumps(add).lower() and 'lnurl' not in json.dumps(add).lower()
          add_ev=load('taker_add_invoice14.json')
