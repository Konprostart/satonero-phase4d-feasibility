          bad=$(ls "$E" | { grep -v -E '^(manifest\.txt|maker_neworder14\.(json|verify\.(stdout|stderr|rc))|maker_neworder\.plain|maker_ack14\.(id|json|req\.rc|req\.stderr|verify\.(stdout|stderr|rc))|maker_ack\.plain|maker\.decrypt\.(stderr|rc)|taker_take_sell14\.(json|verify\.(stdout|stderr|rc))|taker_take_sell\.plain|taker\.decrypt\.(stderr|rc)|order38383\.(initial|updated|waitingpayment)\.(json|meta\.json|req\.(rc|stderr)|verify\.(stdout|stderr|rc))|daemon_orderbook\.log|order_id\.txt|taker_add_invoice_request14\.(json|verify\.(stdout|stderr|rc))|taker_add_invoice_request\.plain|maker_pay_invoice14\.(id|json|plain|verify\.(stdout|stderr|rc))|taker_waiting_seller_to_pay14\.(id|json|plain|verify\.(stdout|stderr|rc))|taker_add_invoice14\.(json|plain|req\.rc|req\.stderr|verify\.(stdout|stderr|rc))|maker_waiting_buyer_invoice14\.(json|plain|req\.rc|req\.stderr|verify\.(stdout|stderr|rc)))$' || true; } | wc -l)
          [ "$bad" = 0 ] && r=pass || r=fail
