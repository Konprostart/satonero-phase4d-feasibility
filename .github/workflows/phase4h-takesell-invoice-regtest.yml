          GATE_RESULT: ${{ steps.gate.outputs.gate }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/safe-artifact"
          python3 - "$RUNNER_TEMP" "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/safe-artifact" "${GITHUB_RUN_ID:-}" "${HANDSHAKE_RESULT:-}" "${GATE_RESULT:-}" <<'PY'
          import hashlib, json, os, pathlib, re, shutil, sys
          rt,e,out=map(pathlib.Path,sys.argv[1:4]); run_id,handshake,gate=sys.argv[4:]
          output=pathlib.Path(os.environ['GITHUB_OUTPUT'])
          if handshake!='PASS' or gate!='pass':
              with output.open('a',encoding='utf-8') as f: f.write('ready=no\n')
