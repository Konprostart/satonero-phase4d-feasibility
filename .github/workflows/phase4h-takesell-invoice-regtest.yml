              else:
                  for key in ('d','s')+ (('k',) if filename.endswith(('.updated.json','.waitingpayment.json')) else ()):
                      selected=[tag for tag in tags if tag[0]==key]
                      expected={'d':oid,'s':status,'k':'sell'}[key]
                      if selected!=[[key,expected]]: raise ValueError('unexpected kind-38383 '+key+' tag: '+filename)
                  if filename.endswith('.initial.json'):
                      selected_k=[tag for tag in tags if tag[0]=='k']
                      if selected_k not in ([],[['k','sell']]): raise ValueError('unexpected initial order-kind tag')
                      if selected_k: receipt['order_kind']='sell'
                  if ev['content']!='': raise ValueError('kind-38383 content must be empty')
                  for tag in tags:
                      if any(word in tag[0].lower() for word in ('invoice','payment','cashu','bond','preimage','secret')): raise ValueError('unsafe order-event tag')
              rcname=filename.replace('.json','.verify.rc')
              rcpath=e/rcname
              if rcpath.is_symlink() or not rcpath.is_file() or rcpath.read_text(encoding='ascii').strip()!='0': raise ValueError('event verification missing/failing: '+filename)
              receipts.append(receipt)
          manifest={'schema':'phase4h-safe-evidence-v1','run_id':run_id,'source':{'satonero':'2534f8b0f05ade36007445511e02747f4468109a','regtest':'c6adbdaaaf0a2152a0728dbce6adf11945f547bd','nak':'v0.22.2'},'handshake':'PASS','secret_gate':'pass','order_id':order_id,'maker_pubkey':maker,'taker_pubkey':taker,'actions':['new-order','take-sell','add-invoice'],'limits':{'new_order':1,'take_sell':1,'add_invoice':1,'retries':0,'payments':0,'channels':0,'invoices':1,'bonds':0,'cashu':0},'invoice_sha256':{'payout':invoice_hashes.get('payout'),'hold':invoice_hashes.get('hold')}}
          shutil.rmtree(out,ignore_errors=True); out.mkdir(mode=0o700,parents=True)
          (out/'manifest.json').write_text(json.dumps(manifest,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          (out/'events.json').write_text(json.dumps(receipts,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          if {p.name for p in out.iterdir()}!={'manifest.json','events.json'} or any(p.is_symlink() or not p.is_file() for p in out.iterdir()): raise ValueError('unexpected artifact output')
          check_manifest=load_json(out/'manifest.json'); check_events=load_json(out/'events.json')
          if check_manifest!=manifest or set(check_manifest)!={'schema','run_id','source','handshake','secret_gate','order_id','maker_pubkey','taker_pubkey','actions','limits','invoice_sha256'} or check_events!=receipts or not isinstance(check_events,list) or len(check_events)!=11: raise ValueError('sanitized artifact validation failed')
          if not manifest['invoice_sha256']['payout'] or not manifest['invoice_sha256']['hold'] or manifest['invoice_sha256']['payout']==manifest['invoice_sha256']['hold']: raise ValueError('invoice receipts missing or identical')
          if any('lnbcrt1' in p.read_text(encoding='utf-8') for p in out.iterdir()): raise ValueError('invoice string leaked into artifact')
          if any(set(item)!={'name','id','pubkey','created_at','kind','sig','recipient','order_id','status','order_kind','content_sha256'} for item in check_events): raise ValueError('unexpected sanitized event fields')
          with output.open('a',encoding='utf-8') as f: f.write('ready=yes\n')
          print('strict artifact validation passed; only manifest.json and content-hash event receipts are publishable')
          PY
      - name: Upload policy
        id: policy
        if: always()
        env:
          HANDSHAKE_RESULT: ${{ steps.handshake_result.outputs.result }}
          GATE_RESULT: ${{ steps.gate.outputs.gate }}
          ARTIFACT_OUTCOME: ${{ steps.artifact_validation.outcome }}
          ARTIFACT_READY: ${{ steps.artifact_validation.outputs.ready }}
          INVOICE_OUTCOME: ${{ steps.invoice_validation.outcome }}
          NOPAY_OUTCOME: ${{ steps.no_payment_gate.outcome }}
        run: |
          set -euo pipefail
          upload=no
          if [ "$HANDSHAKE_RESULT" = PASS ] && [ "$GATE_RESULT" = pass ] && [ "$ARTIFACT_OUTCOME" = success ] && [ "$ARTIFACT_READY" = yes ] && [ "$INVOICE_OUTCOME" = success ] && [ "$NOPAY_OUTCOME" = success ]; then upload=yes; fi
          echo "upload=$upload" >> "$GITHUB_OUTPUT"
      - name: Upload evidence artifact
        id: upload_evidence
        if: steps.policy.outputs.upload == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: phase4h-takesell-evidence
          path: ${{ runner.temp }}/safe-artifact
          retention-days: 1
          if-no-files-found: error
      - name: Verdict
        if: always()
        env:
          HANDSHAKE_RESULT: ${{ steps.handshake_result.outputs.result }}
          GATE_RESULT: ${{ steps.gate.outputs.gate }}
          ARTIFACT_OUTCOME: ${{ steps.artifact_validation.outcome }}
          ARTIFACT_READY: ${{ steps.artifact_validation.outputs.ready }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_evidence.outcome }}
          INVOICE_OUTCOME: ${{ steps.invoice_validation.outcome }}
          NOPAY_OUTCOME: ${{ steps.no_payment_gate.outcome }}
        run: |
          set +x
          gate=${GATE_RESULT:-missing}
          handshake=${HANDSHAKE_RESULT:-INCONCLUSIVE}
          printf 'HANDSHAKE_RESULT=%s SECRET_GATE=%s\n' "$handshake" "$gate"
          if [ "$gate" != pass ]; then echo 'FAIL: secret gate'; exit 1; fi
          if [ "$handshake" != PASS ]; then echo "${handshake}: handshake did not complete successfully"; exit 1; fi
          if [ "${ARTIFACT_OUTCOME:-}" != success ] || [ "${ARTIFACT_READY:-}" != yes ]; then echo 'FAIL: strict artifact validation did not pass'; exit 1; fi
          if [ "${POLICY_OUTCOME:-}" != success ] || [ "${UPLOAD_OUTCOME:-}" != success ]; then echo 'FAIL: artifact policy/upload did not complete'; exit 1; fi
          if [ "${INVOICE_OUTCOME:-}" != success ] || [ "${NOPAY_OUTCOME:-}" != success ]; then echo 'FAIL: invoice validation or no-payment gate did not pass'; exit 1; fi
          echo 'SUCCESS: one NewOrder, one TakeSell, one AddInvoice, hold-invoice PayInvoice, WaitingSellerToPay and waiting-payment order event correlated; no funds moved; artifact validated'
      - name: Cleanup (always)
        if: always()
        working-directory: mostro-regtest
        run: |
          set +x
          cid=$(docker compose ps -q nostr_relay 2>/dev/null || true)
          if [ -n "$cid" ]; then docker exec "$cid" sh -c 'rm -f /tmp/maker.hex /tmp/taker.hex /tmp/maker.sh /tmp/taker.sh /tmp/addinvoice.sh /tmp/taker_invoice.txt /tmp/order.initial.json /tmp/order.updated.json /tmp/mk.ev /tmp/tk.ev /tmp/mk.plain /tmp/tk.plain; rm -rf /tmp/evidence /tmp/*.cand /tmp/*.seen /tmp/*.err /tmp/*.out' || true; fi
          rm -rf "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/safe-artifact" "$RUNNER_TEMP/handshake_result.txt" "$RUNNER_TEMP/invoice_shape.txt" "$RUNNER_TEMP/taker_invoice.txt" "$RUNNER_TEMP/addinvoice.sh" "$RUNNER_TEMP/addinvoice.out" "$RUNNER_TEMP/addinvoice.err" "$RUNNER_TEMP/maker.hex" "$RUNNER_TEMP/taker.hex" "$RUNNER_TEMP/maker.pub" "$RUNNER_TEMP/taker.pub" "$RUNNER_TEMP/daemon.nsec" "$RUNNER_TEMP/daemon.pub" "$RUNNER_TEMP/settings.toml" "$RUNNER_TEMP/maker.sh" "$RUNNER_TEMP/taker.sh" "$RUNNER_TEMP/maker.out" "$RUNNER_TEMP/maker.err" "$RUNNER_TEMP/taker.out" "$RUNNER_TEMP/taker.err" "$RUNNER_TEMP/order_id.txt" "$RUNNER_TEMP/shape.txt" "$RUNNER_TEMP/secret_gate.txt" || true
          docker rm -f satonero-daemon >/dev/null 2>&1 || true
          docker volume rm satonero-config >/dev/null 2>&1 || true
          docker compose down -v || true
          docker system prune -af --volumes || true
          cleanup_failed=0
          verify_absent() {
            label=$1; shift
            if output=$("$@" 2>/dev/null); then
              if [ -z "$output" ]; then echo "absence confirmed: $label"; else echo "resource remains: $label"; cleanup_failed=1; fi
            else
              rc=$?; echo "inspection failed: $label rc=$rc"; cleanup_failed=1
            fi
          }
          verify_absent 'satonero daemon containers' docker ps -a -q --filter name=satonero-daemon
          verify_absent 'satonero config volumes' docker volume ls -q --filter name=satonero-config
          verify_absent 'regtest containers' docker ps -a -q --filter name=mostro-regtest-
          verify_absent 'regtest volumes' docker volume ls -q --filter name=mostro-regtest_
          if python3 - "$RUNNER_TEMP" <<'PY'
          import os, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          names=('maker.hex','taker.hex','daemon.nsec','maker.pub','taker.pub','daemon.pub','settings.toml','maker.sh','taker.sh','addinvoice.sh','maker.out','maker.err','taker.out','taker.err','addinvoice.out','addinvoice.err','taker_invoice.txt','order_id.txt','shape.txt','invoice_shape.txt','handshake_result.txt','secret_gate.txt','evidence','safe-artifact')
          try:
              root.lstat()
              left=[]
              for name in names:
                  try: (root/name).lstat()
                  except FileNotFoundError: continue
                  left.append(name)
          except OSError as exc:
              print('runner-temp inspection failed: '+str(exc)); raise SystemExit(2)
          if left:
              print('runner-temp resources remain: '+','.join(left)); raise SystemExit(1)
          print('runner-temp absence confirmed')
          PY
          then echo 'runner-temp absence confirmed'; else rc=$?; echo "runner-temp inspection/absence failed rc=$rc"; cleanup_failed=1; fi
          if [ "$cleanup_failed" = 0 ]; then echo 'CLEANUP VERIFIED'; else echo 'CLEANUP NOT VERIFIED'; exit 1; fi
