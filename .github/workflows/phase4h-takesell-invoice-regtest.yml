name: phase4h-takesell-invoice-regtest
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: phase4h-takesell-invoice-regtest
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Pre-flight and disk gate
        run: |
          set -euo pipefail
          df -h /
          docker --version
          docker compose version
          jq --version
          git --version
      - name: Free preinstalled space
        run: |
          set -euo pipefail
          for p in /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift; do
            if [ -e "$p" ]; then sudo rm -rf "$p"; fi
          done
          free_kb=$(df --output=avail -k / | tail -1)
          test "$free_kb" -ge 8388608 || { echo "INFEASIBLE-DISK: < 8 GB free"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: Konprostart/Satonero
          ref: 2534f8b0f05ade36007445511e02747f4468109a
          path: satonero
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: MostroP2P/mostro-regtest
          ref: c6adbdaaaf0a2152a0728dbce6adf11945f547bd
          path: mostro-regtest
          persist-credentials: false
          fetch-depth: 1
      - name: Verify pinned SHAs and clean Satonero tree
        run: |
          set -euo pipefail
          test "$(git -C satonero rev-parse HEAD)" = "2534f8b0f05ade36007445511e02747f4468109a"
          test "$(git -C mostro-regtest rev-parse HEAD)" = "c6adbdaaaf0a2152a0728dbce6adf11945f547bd"
          test -z "$(git -C satonero status --porcelain --untracked-files=all)"
      - name: Pin nak and apply runner-only relay healthcheck fix
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          f=docker/nostr_relay/Dockerfile
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "16c3d80abc0ec58a72b782dc78f5eab2021c3fdab386514672777d941d34f553"
          python3 - <<'PY'
          p = "docker/nostr_relay/Dockerfile"
          lines = open(p, encoding="utf-8").read().split("\n")
          i = [n for n, line in enumerate(lines) if line.startswith("RUN BIN_URL=$(curl -s https://api.github.com/repos/fiatjaf/nak/releases/latest")]
          assert len(i) == 1, i
          i = i[0]
          slash = chr(92)
          assert lines[i].endswith("grep linux-amd64) " + slash), lines[i]
          lines[i] = "RUN BIN_URL=https://github.com/fiatjaf/nak/releases/download/v0.22.2/nak-v0.22.2-linux-amd64 " + slash
          j = [n for n, line in enumerate(lines) if line == "  && curl -SLO $BIN_URL " + slash]
          assert len(j) == 1, j
          lines[j[0]:j[0] + 1] = [
              "  && curl -fSLO $BIN_URL " + slash,
              '  && echo "1b81a772619d913f345ecc3d663edcd37e7548ea6b4e21c582bb3826e2604556  nak-v0.22.2-linux-amd64" | sha256sum -c - ' + slash,
          ]
          open(p, "w", encoding="utf-8").write("\n".join(lines))
          PY
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "b5b35e3d596f26552c42a63ac13134722a8924c7fca451e43ab221e3368ed00e"
          f=docker-compose.yml
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "ac08e210765c0c95cd255be2045127f595b3da8d66a27288a4b254ff8b71ea4d"
          python3 - <<'PY'
          p = "docker-compose.yml"
          text = open(p, encoding="utf-8").read()
          old, new = "nak relay nostr_relay:8080", "nak relay http://nostr_relay:8080"
          assert text.count(old) == 1
          open(p, "w", encoding="utf-8").write(text.replace(old, new))
          PY
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "65a3d14cc76245ec6dca5b1b939e934cbd509fe8788c1935d940def9be606b0c"
      - name: Build Satonero daemon image
        working-directory: satonero
        timeout-minutes: 40
        run: |
          set -euo pipefail
          docker compose -f docker/compose.yml build mostro
          free_kb=$(df --output=avail -k / | tail -1)
          test "$free_kb" -ge 3145728 || { echo "INFEASIBLE-DISK: < 3 GB free"; exit 1; }
      - name: Start disposable regtest services and wait for health
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          docker compose up -d bitcoin mostro_lnd alice_lnd bob_lnd nostr_relay
          for i in $(seq 1 60); do
            out=$(docker compose ps --format '{{.Service}} {{.Health}}' bitcoin mostro_lnd alice_lnd bob_lnd nostr_relay)
            echo "$out"
            [ "$(printf '%s\n' "$out" | grep -c ' healthy$')" -eq 5 ] && exit 0
            sleep 10
          done
          echo "FAIL: regtest healthchecks not all healthy"; exit 1
      - name: Generate disposable daemon key and assert pre-invoice settings
        working-directory: satonero
        run: |
          set +x
          set -euo pipefail
          umask 077
          hex=$(docker run --rm --entrypoint nak mostro-regtest-nostr_relay key generate)
          nsec=$(printf '%s\n' "$hex" | docker run --rm -i --entrypoint nak mostro-regtest-nostr_relay encode nsec)
          pub=$(printf '%s\n' "$hex" | docker run --rm -i --entrypoint nak mostro-regtest-nostr_relay key public)
          printf '%s' "$nsec" > "$RUNNER_TEMP/daemon.nsec"
          printf '%s' "$pub" > "$RUNNER_TEMP/daemon.pub"
          unset hex nsec
          python3 - <<'PY'
          import os, tomllib
          rt = os.environ["RUNNER_TEMP"]
          src = open("settings.tpl.toml", encoding="utf-8").read()
          daemon_nsec = open(os.path.join(rt, "daemon.nsec"), encoding="utf-8").read().strip()
          replacements = [
              ("lnd_cert_file = '/home/user/.polar/networks/1/volumes/lnd/alice/tls.cert'", "lnd_cert_file = '/config/lnd/tls.cert'"),
              ("lnd_macaroon_file = '/home/user/.polar/networks/1/volumes/lnd/alice/data/chain/bitcoin/regtest/admin.macaroon'", "lnd_macaroon_file = '/config/lnd/admin.macaroon'"),
              ("lnd_grpc_host = 'https://127.0.0.1:10001'", "lnd_grpc_host = 'https://mostro_lnd:10001'"),
              ("nsec_privkey = 'nsec1...'", "nsec_privkey = '" + daemon_nsec + "'"),
              ("relays = ['ws://localhost:7000']", "relays = ['ws://nostr_relay:8080']"),
              ('bitcoin_price_api_url = "https://api.yadio.io"', 'bitcoin_price_api_url = "http://127.0.0.1:9"'),
          ]
          for old, new in replacements:
              assert src.count(old) == 1, old
              src = src.replace(old, new)
          cfg = tomllib.loads(src)
          assert cfg["mostro"]["dev_fee_enabled"] is False
          assert cfg["mostro"]["pow"] == 0
          assert cfg.get("anti_abuse_bond") is None or cfg["anti_abuse_bond"].get("enabled") is not True
          assert cfg.get("cashu") is None or cfg["cashu"].get("enabled") is not True
          assert cfg["nostr"]["relays"] == ["ws://nostr_relay:8080"]
          open(os.path.join(rt, "settings.toml"), "w", encoding="utf-8").write(src)
          print("settings parsed; bonds/Cashu/dev-fee payments disabled")
          PY
          echo "daemon pubkey: $pub"
      - name: Install settings and start daemon
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id docker-mostro -u)
          docker volume create satonero-config >/dev/null
          docker run --rm --user root --entrypoint sh -v satonero-config:/config -v mostro-regtest_mostro_lnd:/lnd:ro -v "$RUNNER_TEMP":/src:ro docker-mostro -c "set -e; mkdir -p /config/lnd; cp /src/settings.toml /config/settings.toml; cp /lnd/tls.cert /config/lnd/tls.cert; cp /lnd/data/chain/bitcoin/regtest/admin.macaroon /config/lnd/admin.macaroon; chmod 600 /config/settings.toml /config/lnd/admin.macaroon; chown -R $uid:$uid /config"
          docker network inspect mostro-regtest_default >/dev/null
          docker run -d --name satonero-daemon --network mostro-regtest_default -v satonero-config:/config docker-mostro:latest >/dev/null
          sleep 60
          test "$(docker inspect -f '{{.State.Running}}' satonero-daemon)" = true
      - name: Verify LND, mine regtest blocks, sync and maintenance off
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          lnd_id=$(docker compose exec -T --user lnd mostro_lnd lncli --network=regtest --rpcserver=localhost:10001 getinfo | jq -r .identity_pubkey)
          daemon_id=""
          for i in $(seq 1 30); do
            daemon_id=$(docker logs satonero-daemon 2>&1 | grep -a "Recorded Lightning node identity" | grep -oE '[0-9a-f]{66}' | tail -1 || true)
            [ -n "$daemon_id" ] && break
            sleep 10
          done
          test -n "$daemon_id" && test "$daemon_id" = "$lnd_id"
          if docker logs satonero-daemon 2>&1 | grep -a -E "No connection to LND|panic|REFUSING TO START"; then echo "FAIL: daemon startup/LND error"; exit 1; fi
          bc() { docker compose exec -T --user bitcoin bitcoin bitcoin-cli -regtest -rpcport=18443 -rpcuser=bitcoin -rpcpassword=bitcoin "$@"; }
          bc createwallet dev >/dev/null 2>&1 || bc loadwallet dev >/dev/null 2>&1 || true
          addr=$(bc -rpcwallet=dev getnewaddress)
          bc -rpcwallet=dev generatetoaddress 150 "$addr" >/dev/null
          synced=no
          for i in $(seq 1 60); do
            [ "$(docker compose exec -T --user lnd mostro_lnd lncli --network=regtest --rpcserver=localhost:10001 getinfo | jq -r .synced_to_chain)" = true ] && { synced=yes; break; }
            sleep 10
          done
          test "$synced" = yes
          channel_count=$(docker compose exec -T --user lnd mostro_lnd lncli --network=regtest --rpcserver=localhost:10001 listchannels | jq '.channels | length')
          test "$channel_count" = 0 || { echo "FAIL: unexpected regtest channel count=$channel_count"; exit 1; }
          sleep 330
          test "$(docker logs satonero-daemon 2>&1 | grep -a -c 'maintenance mode ON' || true)" = 0
          last_info=$(docker logs satonero-daemon 2>&1 | grep -a "Sending info about mostro" | tail -1 || true)
          if printf '%s' "$last_info" | grep -q maintenance; then echo "FAIL: maintenance advertised"; exit 1; fi
          echo "LND identity/sync and maintenance-off gates passed"
      - name: Generate separate disposable maker and taker keys
        working-directory: mostro-regtest
        run: |
          set +x
          set -euo pipefail
          umask 077
          for role in maker taker; do
            hex=$(docker run --rm --entrypoint nak mostro-regtest-nostr_relay key generate)
            pub=$(printf '%s\n' "$hex" | docker run --rm -i --entrypoint nak mostro-regtest-nostr_relay key public)
            printf '%s' "$hex" > "$RUNNER_TEMP/$role.hex"
            printf '%s' "$pub" > "$RUNNER_TEMP/$role.pub"
            chmod 600 "$RUNNER_TEMP/$role.hex"
            echo "$role trade pubkey: $pub"
            unset hex
          done
          test "$(cat "$RUNNER_TEMP/maker.pub")" != "$(cat "$RUNNER_TEMP/taker.pub")"
      - name: Create one taker regtest payout invoice
        working-directory: mostro-regtest
        run: |
          set +x
          set -euo pipefail
          umask 077
          req=$(docker compose exec -T --user lnd bob_lnd lncli --network=regtest --rpcserver=localhost:10001 addinvoice --amt 1000 --expiry 86400 | jq -r .payment_request)
          case "$req" in lnbcrt1*) ;; *) echo "FAIL: payout invoice is not regtest"; exit 1;; esac
          printf '%s\n' "$req" | grep -Eq '^lnbcrt([1-9][0-9]*[munp])?1[02-9ac-hj-np-z]{50,2000}$' || { echo "FAIL: malformed payout invoice"; exit 1; }
          printf '%s' "$req" > "$RUNNER_TEMP/taker_invoice.txt"
          chmod 600 "$RUNNER_TEMP/taker_invoice.txt"
          unset req
          echo "taker payout invoice created (bolt11 withheld from logs)"
      - name: Write Phase 4H scripts (no keys in script files)
        run: |
          set +x
          umask 077
          cat > "$RUNNER_TEMP/maker.sh" <<'SH'
          #!/bin/sh
          set -u
          umask 077
          DAEMON="$1"; MAKER="$2"; E=/tmp/evidence
          mkdir -p "$E"; chmod 700 "$E"
          TSEND=$(date +%s); TSTART=$((TSEND - 10))
          MSG='[{"order":{"version":2,"request_id":101,"action":"new-order","payload":{"order":{"kind":"sell","fiat_code":"USD","fiat_amount":10,"amount":1000,"payment_method":"BANK_TRANSFER","premium":0}}}},null,null]'
          printf '%s\n' "$MSG" > "$E/maker_neworder.plain"
          export NOSTR_SECRET_KEY="$(cat /tmp/maker.hex)"
          CT=$(nak encrypt --recipient-pubkey "$DAEMON" "$MSG" < /dev/null)
          echo "encrypt_rc=$? ciphertext_chars=${#CT}"
          nak event -k 14 -c "$CT" --tag p="$DAEMON" ws://localhost:8080 < /dev/null > /tmp/maker.pub.out 2> /tmp/maker.pub.err
          echo "new_order_publish_rc=$?"
          echo "new_order_publish_stderr=$(tr '\n' ' ' < /tmp/maker.pub.err | cut -c1-200)"
          cp /tmp/maker.pub.out "$E/maker_neworder14.json"
          nak verify < "$E/maker_neworder14.json" > "$E/maker_neworder14.verify.stdout" 2> "$E/maker_neworder14.verify.stderr"
          echo $? > "$E/maker_neworder14.verify.rc"
          EXPR="select(.kind==14 and .pubkey==\"$DAEMON\" and ([.tags[]|select(.[0]==\"p\")]==[[\"p\",\"$MAKER\"]]) and .created_at>=$TSTART) | .id"
          : > /tmp/maker.seen
          i=0; FINAL=WINDOW
          while [ $i -lt 15 ]; do
            i=$((i+1))
            timeout 40 nak req -k 14 -a "$DAEMON" -t p="$MAKER" --limit 50 --jq "$EXPR" --jq-raw ws://localhost:8080 < /dev/null > /tmp/maker.cand 2> /tmp/maker.cand.err
            rc=$?; echo "maker_ack_poll=$i rc=$rc"
            if [ "$rc" != 0 ] || grep -Evq '^[0-9a-f]{64}$' /tmp/maker.cand; then FINAL=QUERY_FAILED; break; fi
            cat /tmp/maker.cand >> /tmp/maker.seen
            n=$(sort -u /tmp/maker.seen | grep -c . || true)
            if [ "$n" -gt 1 ]; then FINAL=AMBIGUOUS_ACK; break; fi
            sleep 20
          done
          n=$(sort -u /tmp/maker.seen | grep -c . || true)
          [ "$FINAL" != WINDOW ] || { [ "$n" = 1 ] && FINAL=SELECTED || FINAL=MISSING_ACK; }
          echo "maker_ack_candidates=$n maker_ack_final=$FINAL"
          if [ "$FINAL" = SELECTED ]; then
            ACKID=$(sort -u /tmp/maker.seen | grep . | head -1)
            printf '%s\n' "$ACKID" > "$E/maker_ack14.id"
            timeout 40 nak req --id "$ACKID" --limit 1 ws://localhost:8080 < /dev/null > "$E/maker_ack14.json" 2> "$E/maker_ack14.req.stderr"
            echo $? > "$E/maker_ack14.req.rc"
            nak verify < "$E/maker_ack14.json" > "$E/maker_ack14.verify.stdout" 2> "$E/maker_ack14.verify.stderr"
            echo $? > "$E/maker_ack14.verify.rc"
            CT2=$(timeout 40 nak req --id "$ACKID" --limit 1 --jq '.content' --jq-raw ws://localhost:8080 < /dev/null 2> /tmp/maker.content.err)
            nak decrypt --sender-pubkey "$DAEMON" "$CT2" < /dev/null > "$E/maker_ack.plain" 2> "$E/maker.decrypt.stderr"
            echo $? > "$E/maker.decrypt.rc"
            ORDER=$(grep -oE '"id":"[0-9a-f-]{36}"' "$E/maker_ack.plain" | head -1 | cut -d'"' -f4)
            printf '%s\n' "$ORDER" > "$E/order_id.txt"
            echo "ORDER_ID=$ORDER"
            ORDER_EXPR="select(.kind==38383 and .pubkey==\"$DAEMON\" and ([.tags[]|select(.[0]==\"d\")]==[[\"d\",\"$ORDER\"]]) and ([.tags[]|select(.[0]==\"s\")]==[[\"s\",\"pending\"]]))"
            : > /tmp/order.initial.json
            for j in $(seq 1 15); do
              timeout 40 nak -v req -k 38383 -a "$DAEMON" -t d="$ORDER" --limit 5 --jq "$ORDER_EXPR" ws://localhost:8080 < /dev/null > /tmp/order.initial.json 2> "$E/order38383.initial.req.stderr"
              ORC=$?; echo "$ORC" > "$E/order38383.initial.req.rc"
              if [ "$ORC" != 0 ]; then FINAL=QUERY_FAILED; break; fi
              [ -s /tmp/order.initial.json ] && break
              sleep 20
            done
            cp /tmp/order.initial.json "$E/order38383.initial.json"
            if [ -s "$E/order38383.initial.json" ]; then
              nak verify < "$E/order38383.initial.json" > "$E/order38383.initial.verify.stdout" 2> "$E/order38383.initial.verify.stderr"
              echo $? > "$E/order38383.initial.verify.rc"
            elif [ "$FINAL" = SELECTED ]; then
              FINAL=INCONCLUSIVE_INITIAL_ORDER_EVENT
            fi
          fi
          unset NOSTR_SECRET_KEY CT CT2 MSG
          echo "FINAL=$FINAL"
          SH
          cat > "$RUNNER_TEMP/taker.sh" <<'SH'
          #!/bin/sh
          # Stop after the AddInvoice prompt; never submit an invoice.
          set -u
          umask 077
          DAEMON="$1"; MAKER="$2"; TAKER="$3"; ORDER="$4"; E=/tmp/evidence
          case "$ORDER" in ????????-????-????-????-????????????) ;; *) echo "FINAL=BAD_ORDER_ID"; exit 1;; esac
          TSEND=$(date +%s); TSTART=$((TSEND - 10))
          MSG=$(printf '[{"order":{"version":2,"request_id":202,"id":"%s","action":"take-sell","payload":null}},null,null]' "$ORDER")
          printf '%s\n' "$MSG" > "$E/taker_take_sell.plain"
          export NOSTR_SECRET_KEY="$(cat /tmp/taker.hex)"
          CT=$(nak encrypt --recipient-pubkey "$DAEMON" "$MSG" < /dev/null)
          nak event -k 14 -c "$CT" --tag p="$DAEMON" ws://localhost:8080 < /dev/null > /tmp/taker.pub.out 2> /tmp/taker.pub.err
          echo "take_sell_publish_rc=$?"
          echo "take_sell_publish_stderr=$(tr '\n' ' ' < /tmp/taker.pub.err | cut -c1-200)"
          cp /tmp/taker.pub.out "$E/taker_take_sell14.json"
          nak verify < "$E/taker_take_sell14.json" > "$E/taker_take_sell14.verify.stdout" 2> "$E/taker_take_sell14.verify.stderr"
          echo $? > "$E/taker_take_sell14.verify.rc"
          unset NOSTR_SECRET_KEY CT MSG
          : > /tmp/taker.seen; : > /tmp/maker.seen
          i=0; TAKER_ID=""; MAKER_ID=""; FINAL=WINDOW
          EXPR_T="select(.kind==14 and .pubkey==\"$DAEMON\" and ([.tags[]|select(.[0]==\"p\")]==[[\"p\",\"$TAKER\"]]) and .created_at>=$TSTART) | .id"
          EXPR_M="select(.kind==14 and .pubkey==\"$DAEMON\" and ([.tags[]|select(.[0]==\"p\")]==[[\"p\",\"$MAKER\"]]) and .created_at>=$TSTART and .id!=\"$(cat "$E/maker_ack14.id" 2>/dev/null || true)\") | .id"
          while [ $i -lt 15 ]; do
            i=$((i+1))
            timeout 40 nak req -k 14 -a "$DAEMON" -t p="$TAKER" --limit 50 --jq "$EXPR_T" --jq-raw ws://localhost:8080 < /dev/null > /tmp/taker.cand 2> /tmp/taker.cand.err; trc=$?
            timeout 40 nak req -k 14 -a "$DAEMON" -t p="$MAKER" --limit 50 --jq "$EXPR_M" --jq-raw ws://localhost:8080 < /dev/null > /tmp/maker.cand 2> /tmp/maker.cand.err; mrc=$?
            echo "reply_poll=$i taker_rc=$trc maker_rc=$mrc"
            [ "$trc" = 0 ] && ! grep -Evq '^[0-9a-f]{64}$' /tmp/taker.cand || { FINAL=QUERY_FAILED; break; }
            [ "$mrc" = 0 ] && ! grep -Evq '^[0-9a-f]{64}$' /tmp/maker.cand || { FINAL=QUERY_FAILED; break; }
            cat /tmp/taker.cand >> /tmp/taker.seen; cat /tmp/maker.cand >> /tmp/maker.seen
            nt=$(sort -u /tmp/taker.seen | grep -c . || true); nm=$(sort -u /tmp/maker.seen | grep -c . || true)
            [ "$nt" -le 1 ] && [ "$nm" -le 1 ] || { FINAL=AMBIGUOUS_REPLY; break; }
            [ "$nt" = 1 ] && TAKER_ID=$(sort -u /tmp/taker.seen | grep . | head -1)
            [ "$nm" = 1 ] && MAKER_ID=$(sort -u /tmp/maker.seen | grep . | head -1)
            sleep 20
          done
          if [ "$FINAL" = WINDOW ]; then
            if [ -n "$TAKER_ID" ] && [ -n "$MAKER_ID" ]; then FINAL=SELECTED; else FINAL=MISSING_REPLY; fi
          fi
          if [ "$FINAL" = SELECTED ]; then
            timeout 40 nak req --id "$TAKER_ID" --limit 1 ws://localhost:8080 < /dev/null > "$E/taker_add_invoice14.json" 2> "$E/taker_add_invoice14.req.stderr"
            echo $? > "$E/taker_add_invoice14.req.rc"
            nak verify < "$E/taker_add_invoice14.json" > "$E/taker_add_invoice14.verify.stdout" 2> "$E/taker_add_invoice14.verify.stderr"
            echo $? > "$E/taker_add_invoice14.verify.rc"
            CT=$(timeout 40 nak req --id "$TAKER_ID" --limit 1 --jq '.content' --jq-raw ws://localhost:8080 < /dev/null 2> /tmp/taker.content.err)
            export NOSTR_SECRET_KEY="$(cat /tmp/taker.hex)"
            nak decrypt --sender-pubkey "$DAEMON" "$CT" < /dev/null > "$E/taker_add_invoice14.plain" 2> "$E/taker.decrypt.stderr"
            echo $? > "$E/taker.decrypt.rc"
            unset NOSTR_SECRET_KEY
            timeout 40 nak req --id "$MAKER_ID" --limit 1 ws://localhost:8080 < /dev/null > "$E/maker_waiting_buyer_invoice14.json" 2> "$E/maker_waiting_buyer_invoice14.req.stderr"
            echo $? > "$E/maker_waiting_buyer_invoice14.req.rc"
            nak verify < "$E/maker_waiting_buyer_invoice14.json" > "$E/maker_waiting_buyer_invoice14.verify.stdout" 2> "$E/maker_waiting_buyer_invoice14.verify.stderr"
            echo $? > "$E/maker_waiting_buyer_invoice14.verify.rc"
            CT=$(timeout 40 nak req --id "$MAKER_ID" --limit 1 --jq '.content' --jq-raw ws://localhost:8080 < /dev/null 2> /tmp/maker.content.err)
            export NOSTR_SECRET_KEY="$(cat /tmp/maker.hex)"
            nak decrypt --sender-pubkey "$DAEMON" "$CT" < /dev/null > "$E/maker_waiting_buyer_invoice14.plain" 2> "$E/maker.decrypt.stderr"
            echo $? > "$E/maker.decrypt.rc"
            unset NOSTR_SECRET_KEY
            event_found=no
            for p in $(seq 1 15); do
              timeout 40 nak -v req -k 38383 -a "$DAEMON" -t d="$ORDER" --limit 5 --jq 'select(any(.tags[]; .[0]=="s" and .[1]=="in-progress"))' ws://localhost:8080 < /dev/null > "$E/order38383.updated.json" 2> "$E/order38383.updated.req.stderr"
              orc=$?; echo "$orc" > "$E/order38383.updated.req.rc"
              if [ "$orc" = 0 ] && grep -q '"kind":38383' "$E/order38383.updated.json"; then event_found=yes; break; fi
              sleep 20
            done
            if [ "$event_found" = yes ]; then
              nak verify < "$E/order38383.updated.json" > "$E/order38383.updated.verify.stdout" 2> "$E/order38383.updated.verify.stderr"
              echo $? > "$E/order38383.updated.verify.rc"
            else
              FINAL=INCONCLUSIVE_ORDER_EVENT
            fi
          fi
          echo "maker_reply_id=$MAKER_ID taker_reply_id=$TAKER_ID final=$FINAL"
          echo "FINAL=$FINAL"
          SH
          chmod 700 "$RUNNER_TEMP/maker.sh" "$RUNNER_TEMP/taker.sh"
          cat > "$RUNNER_TEMP/addinvoice.sh" <<'SH'
          #!/bin/sh
          # Submit exactly one AddInvoice for the taker and capture the daemon replies.
          set -u
          umask 077
          DAEMON="$1"; MAKER="$2"; TAKER="$3"; ORDER="$4"; E=/tmp/evidence
          INVOICE=$(cat /tmp/taker_invoice.txt 2>/dev/null || true)
          case "$ORDER" in ????????-????-????-????-????????????) ;; *) echo "FINAL=BAD_ORDER_ID"; exit 1;; esac
          case "$INVOICE" in lnbcrt1*) ;; *) echo "FINAL=BAD_INVOICE"; exit 1;; esac
          TSEND=$(date +%s); TSTART=$((TSEND - 10))
          MSG=$(printf '[{"order":{"version":2,"request_id":203,"id":"%s","action":"add-invoice","payload":{"payment_request":[null,"%s",null]}}},null,null]' "$ORDER" "$INVOICE")
          printf '%s\n' "$MSG" > "$E/taker_add_invoice_request.plain"
          chmod 600 "$E/taker_add_invoice_request.plain"
          export NOSTR_SECRET_KEY="$(cat /tmp/taker.hex)"
          CT=$(nak encrypt --recipient-pubkey "$DAEMON" "$MSG" < /dev/null)
          nak event -k 14 -c "$CT" --tag p="$DAEMON" ws://localhost:8080 < /dev/null > /tmp/addinv.pub.out 2> /tmp/addinv.pub.err
          echo "add_invoice_publish_rc=$?"
          echo "add_invoice_publish_stderr=$(tr '\n' ' ' < /tmp/addinv.pub.err | cut -c1-200)"
          cp /tmp/addinv.pub.out "$E/taker_add_invoice_request14.json"
          nak verify < "$E/taker_add_invoice_request14.json" > "$E/taker_add_invoice_request14.verify.stdout" 2> "$E/taker_add_invoice_request14.verify.stderr"
          echo $? > "$E/taker_add_invoice_request14.verify.rc"
          unset NOSTR_SECRET_KEY CT MSG
          EXPR_M="select(.kind==14 and .pubkey==\"$DAEMON\" and ([.tags[]|select(.[0]==\"p\")]==[[\"p\",\"$MAKER\"]]) and .created_at>=$TSTART) | .id"
          EXPR_T="select(.kind==14 and .pubkey==\"$DAEMON\" and ([.tags[]|select(.[0]==\"p\")]==[[\"p\",\"$TAKER\"]]) and .created_at>=$TSTART) | .id"
          : > /tmp/hold.seen; : > /tmp/wait.seen
          HOLD_ID=""; WAIT_ID=""; FINAL=WINDOW; PAYINV_NOTICES=0; DECRYPT_FAILURES=0; MAKER_CANDIDATES=0; TAKER_CANDIDATES=0
          i=0
          while [ $i -lt 15 ]; do
            i=$((i+1))
            timeout 40 nak req -k 14 -a "$DAEMON" -t p="$MAKER" --limit 50 --jq "$EXPR_M" --jq-raw ws://localhost:8080 < /dev/null > /tmp/mk.cand 2> /tmp/mk.cand.err; mrc=$?
            timeout 40 nak req -k 14 -a "$DAEMON" -t p="$TAKER" --limit 50 --jq "$EXPR_T" --jq-raw ws://localhost:8080 < /dev/null > /tmp/tk.cand 2> /tmp/tk.cand.err; trc=$?
            echo "invoice_poll=$i maker_rc=$mrc taker_rc=$trc"
            [ "$mrc" = 0 ] && ! grep -Evq '^[0-9a-f]{64}$' /tmp/mk.cand || { FINAL=QUERY_FAILED; break; }
            [ "$trc" = 0 ] && ! grep -Evq '^[0-9a-f]{64}$' /tmp/tk.cand || { FINAL=QUERY_FAILED; break; }
            for id in $(cat /tmp/mk.cand); do
              grep -qx "$id" /tmp/hold.seen && continue
              echo "$id" >> /tmp/hold.seen
              MAKER_CANDIDATES=$((MAKER_CANDIDATES+1))
              timeout 40 nak req --id "$id" --limit 1 ws://localhost:8080 < /dev/null > /tmp/mk.ev 2>/dev/null || continue
              [ -s /tmp/mk.ev ] || continue
              nak verify < /tmp/mk.ev > /dev/null 2>&1 || continue
              CT2=$(timeout 40 nak req --id "$id" --limit 1 --jq '.content' --jq-raw ws://localhost:8080 < /dev/null 2>/dev/null)
              [ -n "$CT2" ] || continue
              export NOSTR_SECRET_KEY="$(cat /tmp/maker.hex)"
              timeout 40 nak decrypt --sender-pubkey "$DAEMON" "$CT2" < /dev/null > /tmp/mk.plain 2>/dev/null; DEC_RC=$?
              unset NOSTR_SECRET_KEY
              [ "$DEC_RC" = 0 ] || { DECRYPT_FAILURES=$((DECRYPT_FAILURES+1)); continue; }
              grep -q '"action":"pay-invoice"' /tmp/mk.plain || continue
              PAYINV_NOTICES=$((PAYINV_NOTICES+1))
              grep -q 'lnbcrt1' /tmp/mk.plain || continue
              HOLD_ID=$id
              cp /tmp/mk.ev "$E/maker_pay_invoice14.json"
              cp /tmp/mk.plain "$E/maker_pay_invoice14.plain"
              printf '%s\n' "$id" > "$E/maker_pay_invoice14.id"
              nak verify < "$E/maker_pay_invoice14.json" > "$E/maker_pay_invoice14.verify.stdout" 2> "$E/maker_pay_invoice14.verify.stderr"
              echo $? > "$E/maker_pay_invoice14.verify.rc"
              break
            done
            for id in $(cat /tmp/tk.cand); do
              grep -qx "$id" /tmp/wait.seen && continue
              echo "$id" >> /tmp/wait.seen
              TAKER_CANDIDATES=$((TAKER_CANDIDATES+1))
              timeout 40 nak req --id "$id" --limit 1 ws://localhost:8080 < /dev/null > /tmp/tk.ev 2>/dev/null || continue
              [ -s /tmp/tk.ev ] || continue
              nak verify < /tmp/tk.ev > /dev/null 2>&1 || continue
              CT3=$(timeout 40 nak req --id "$id" --limit 1 --jq '.content' --jq-raw ws://localhost:8080 < /dev/null 2>/dev/null)
              [ -n "$CT3" ] || continue
              export NOSTR_SECRET_KEY="$(cat /tmp/taker.hex)"
              timeout 40 nak decrypt --sender-pubkey "$DAEMON" "$CT3" < /dev/null > /tmp/tk.plain 2>/dev/null; DEC_RC=$?
              unset NOSTR_SECRET_KEY
              [ "$DEC_RC" = 0 ] || { DECRYPT_FAILURES=$((DECRYPT_FAILURES+1)); continue; }
              grep -q '"action":"waiting-seller-to-pay"' /tmp/tk.plain || continue
              WAIT_ID=$id
              cp /tmp/tk.ev "$E/taker_waiting_seller_to_pay14.json"
              cp /tmp/tk.plain "$E/taker_waiting_seller_to_pay14.plain"
              printf '%s\n' "$id" > "$E/taker_waiting_seller_to_pay14.id"
              nak verify < "$E/taker_waiting_seller_to_pay14.json" > "$E/taker_waiting_seller_to_pay14.verify.stdout" 2> "$E/taker_waiting_seller_to_pay14.verify.stderr"
              echo $? > "$E/taker_waiting_seller_to_pay14.verify.rc"
              break
            done
            [ -n "$HOLD_ID" ] && [ -n "$WAIT_ID" ] && break
            sleep 20
          done
          if [ -n "$HOLD_ID" ] && [ -n "$WAIT_ID" ]; then FINAL=SELECTED
          elif [ -z "$HOLD_ID" ]; then FINAL=MISSING_HOLD_INVOICE
          else FINAL=MISSING_WAITING_SELLER
          fi
          if [ "$FINAL" = SELECTED ]; then
            event_found=no
            for p in $(seq 1 15); do
              timeout 40 nak -v req -k 38383 -a "$DAEMON" -t d="$ORDER" --limit 5 ws://localhost:8080 < /dev/null > /tmp/raw38383.json 2> "$E/order38383.waitingpayment.req.stderr"
              orc=$?; echo "$orc" > "$E/order38383.waitingpayment.req.rc"
              jq -c 'select(any(.tags[]; .[0]=="s" and .[1]=="waiting-payment"))' /tmp/raw38383.json > "$E/order38383.waitingpayment.json" 2>/dev/null || true
              jq -sc '{count: length, events: [.[]? | {id: .id, created_at: .created_at, pubkey: .pubkey, kind: .kind, d: ([.tags[]? | select(.[0]=="d") | .[1]][0] // null), s: ([.tags[]? | select(.[0]=="s") | .[1]][0] // null)}]}' /tmp/raw38383.json > "$E/order38383.waitingpayment.meta.json" 2>/dev/null || true
              if [ "$orc" = 0 ] && grep -q '"kind":38383' "$E/order38383.waitingpayment.json"; then event_found=yes; break; fi
              sleep 20
            done
            rm -f /tmp/raw38383.json
            if [ "$event_found" = yes ]; then
              nak verify < "$E/order38383.waitingpayment.json" > "$E/order38383.waitingpayment.verify.stdout" 2> "$E/order38383.waitingpayment.verify.stderr"
              echo $? > "$E/order38383.waitingpayment.verify.rc"
            else
              FINAL=INCONCLUSIVE_FINAL_STATUS
            fi
          fi
          echo "pay_invoice_notices=$PAYINV_NOTICES maker_candidates=$MAKER_CANDIDATES taker_candidates=$TAKER_CANDIDATES decrypt_failures=$DECRYPT_FAILURES hold_invoice_selected=$HOLD_ID waiting_seller_selected=$WAIT_ID"
          echo "FINAL=$FINAL"
          SH
          chmod 700 "$RUNNER_TEMP/addinvoice.sh"
