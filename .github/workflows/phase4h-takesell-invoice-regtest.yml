          small_keys={'id','kind','status','amount','fiat_code','min_amount','max_amount','fiat_amount','payment_method','premium','buyer_trade_pubkey','seller_trade_pubkey','buyer_invoice','created_at','expires_at','cashu_mint_url'}
          required_small={'kind','amount','fiat_code','fiat_amount','payment_method','premium'}
          def check_small(small,expected_id=None,expected_status=None,request=False):
              if not isinstance(small,dict) or set(small)-small_keys or required_small-set(small): raise ValueError('unexpected/incomplete SmallOrder fields')
              if small['kind']!='sell' or small['fiat_code']!='USD' or small['fiat_amount']!=10 or small['amount']!=1000 or small['premium']!=0 or small['payment_method']!='BANK_TRANSFER':
