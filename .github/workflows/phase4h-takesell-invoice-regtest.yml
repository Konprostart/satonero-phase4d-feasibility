              scan_strings(redact(msg))
          event_specs=(
              ('maker_neworder14.json',14,maker,daemon,None,None,None),
              ('maker_ack14.json',14,daemon,maker,None,None,None),
              ('taker_take_sell14.json',14,taker,daemon,None,None,None),
              ('taker_add_invoice14.json',14,daemon,taker,None,None,None),
              ('maker_waiting_buyer_invoice14.json',14,daemon,maker,None,None,None),
