name: phase6d-rating-conformance
# Phase 6C — the post-settlement rating and reputation leg, driven end to end by
# the Android app against a real Satonero daemon on regtest.
#
# Phase 6D re-runs the proven Phase 6C stack and gate against the corrected
# kind-38384 keying: the daemon now publishes the rating event under the RATED
# user's trade pubkey (protocol/src/user_rating.md), so the app's rating of the
# seller is keyed by the seller's trade pubkey and the seller's rating of the
# buyer by the buyer's trade pubkey.
#
# Reuses the proven Phase 6B stack and gate (same relay read helper, same seeded
# app, same CLI maker, same settlement leg) and adds the reputation leg on top.
# Phase 6A and Phase 6B are not touched: their successful evidence stays valid,
# including 6B's "no settlement" assertions.
#
# Dispatch once with:
#
#   gh workflow run phase6d-rating-conformance --ref main
#
# Gates in one manually dispatched run:
#   6C-0  the app boots against the regtest relay, discovers the CLI maker's
#         pending sell order and renders it in the real order book;
#   6C    the app takes that order as the buyer, submits a real regtest payout
#         invoice, the harness pays the seller hold invoice once with alice_lnd,
#         and both the app and the daemon end up in `active`;
#   6C    the app marks the fiat as sent, the CLI maker (seller) releases, the
#         daemon settles the hold invoice, pays the buyer payout invoice and
#         finalises the order as Success;
#   6C    the app rates the seller through the production rating screen, the
#         daemon validates it and publishes a signed kind-38384 aggregate, and
#         the app renders the updated reputation on a fresh pending order.
#
# The rating is only accepted for a seller that proved a separate identity key:
# mostro-core drops a rating aimed at a full-privacy counterpart. The harness
# maker therefore sends protocol-v2 envelopes for its orders with a trade key
# plus an identity proof, exactly the shape the mobile app and mostro-core
# produce. It also drives the negative cases the protocol supports: invalid
# rating value, unknown order reference, non-participant rating and a duplicate
# rating from the same side.
#
# Everything is regtest-only and disposable: pow = 0, no bonds, no Cashu, no
# dev fee (mainnet-only), no mainnet, no secrets, no real money. The rating
# publication interval is shortened to 5s so the run does not wait an hour for
# the daemon's kind-38384 queue.
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: phase6d-rating-conformance
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      DAEMON_SHA: ccce4cb707f6ee58a9273f79025e44a8cb08ddfe
      REGTEST_SHA: c6adbdaaaf0a2152a0728dbce6adf11945f547bd
      MOBILE_SHA: b980eb8c973ebb72197651bfb83a6a80184cafb3
      # android/app/build.gradle throws at configuration time when no release
      # keystore exists, so every Gradle invocation in this job needs the same
      # CI-only escape hatch that Satonero-mobile's own workflows use
      # (satonero-ci.yml, private-mode-validation.yml). It only affects release
      # builds; this job builds and runs DEBUG APKs and publishes nothing.
      ALLOW_DEBUG_SIGNING: "true"
    steps:
      - name: Pre-flight and disk gate
        run: |
          set -euo pipefail
          df -h /
          docker --version
          docker compose version
          jq --version
          git --version
          java -version
      - name: Free preinstalled space (keep the Android SDK)
        run: |
          set -euo pipefail
          # The emulator needs (ANDROID_SDK_ROOT, platform-tools, system image),
          # so unlike the CLI phases the Android SDK is NOT deleted here.
          for p in /usr/share/dotnet /opt/ghc /usr/share/swift; do
            if [ -e "$p" ]; then sudo rm -rf "$p"; fi
          done
          free_kb=$(df --output=avail -k / | tail -1)
          echo "free_kb=$free_kb"
          test "$free_kb" -ge 20971520 || { echo "INFEASIBLE-DISK: < 20 GB free"; exit 1; }
          test -n "${ANDROID_SDK_ROOT:-}" && test -d "$ANDROID_SDK_ROOT"
          echo "Android SDK kept at $ANDROID_SDK_ROOT"
      - uses: actions/checkout@v4
        with:
          repository: Konprostart/Satonero
          ref: ${{ env.DAEMON_SHA }}
          path: satonero
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: MostroP2P/mostro-regtest
          ref: c6adbdaaaf0a2152a0728dbce6adf11945f547bd
          path: mostro-regtest
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: Konprostart/Satonero-mobile
          ref: ${{ env.MOBILE_SHA }}
          path: mobile
          persist-credentials: false
          fetch-depth: 1
      - name: Verify pinned SHAs and clean trees
        run: |
          set -euo pipefail
          test "$(git -C satonero rev-parse HEAD)" = "$DAEMON_SHA"
          test "$(git -C mostro-regtest rev-parse HEAD)" = "$REGTEST_SHA"
          test "$(git -C mobile rev-parse HEAD)" = "$MOBILE_SHA"
          test -z "$(git -C satonero status --porcelain --untracked-files=all)"
          test -z "$(git -C mobile status --porcelain --untracked-files=all)"
          test -f mobile/integration_test/regtest_mobile_daemon_test.dart
      - name: Pin nak and apply runner-only relay healthcheck fix
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          f=docker/nostr_relay/Dockerfile
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "16c3d80abc0ec58a72b782dc78f5eab2021c3fdab386514672777d941d34f553"
          python3 - <<'PY'
          p = "docker/nostr_relay/Dockerfile"
          lines = open(p, encoding="utf-8").read().split("\n")
          old, new = "apt-get install -y curl gosu", "apt-get install -y curl gosu jq"
          hits = [n for n, line in enumerate(lines) if old in line]
          assert len(hits) == 1, hits
          lines[hits[0]] = lines[hits[0]].replace(old, new)
          i = [n for n, line in enumerate(lines) if line.startswith("RUN BIN_URL=$(curl -s https://api.github.com/repos/fiatjaf/nak/releases/latest")]
          assert len(i) == 1, i
          i = i[0]
          slash = chr(92)
          assert lines[i].endswith("grep linux-amd64) " + slash), lines[i]
          lines[i] = "RUN BIN_URL=https://github.com/fiatjaf/nak/releases/download/v0.22.2/nak-v0.22.2-linux-amd64 " + slash
          j = [n for n, line in enumerate(lines) if line == "  && curl -SLO $BIN_URL " + slash]
          assert len(j) == 1, j
          lines[j[0]:j[0] + 1] = [
              "  && curl -fSLO $BIN_URL " + slash,
              '  && echo "1b81a772619d913f345ecc3d663edcd37e7548ea6b4e21c582bb3826e2604556  nak-v0.22.2-linux-amd64" | sha256sum -c - ' + slash,
          ]
          open(p, "w", encoding="utf-8").write("\n".join(lines))
          PY
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "ab32f22df3de0185ac04d75b5269d532127557abcad3f89180a63e9032402cb3"
          f=docker-compose.yml
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "ac08e210765c0c95cd255be2045127f595b3da8d66a27288a4b254ff8b71ea4d"
          python3 - <<'PY'
          p = "docker-compose.yml"
          text = open(p, encoding="utf-8").read()
          old, new = "nak relay nostr_relay:8080", "nak relay http://nostr_relay:8080"
          assert text.count(old) == 1
          open(p, "w", encoding="utf-8").write(text.replace(old, new))
          PY
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "65a3d14cc76245ec6dca5b1b939e934cbd509fe8788c1935d940def9be606b0c"
      - name: Pin geth-hdwallet in bitcoin image
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          f=docker/bitcoin/Dockerfile
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "f093ea3eaab491e62e8f4b87ffff8d066f0a980d7b3424277f377da87324cc45"
          python3 - <<'PY'
          p = "docker/bitcoin/Dockerfile"
          lines = open(p, encoding="utf-8").read().split("\n")
          slash = chr(92)
          i = [n for n, line in enumerate(lines) if line.startswith("RUN BIN_URL=$(curl -s https://api.github.com/repos/miguelmota/go-ethereum-hdwallet/releases/")]
          assert len(i) == 1, i
          i = i[0]
          assert lines[i + 1] == "  && TMP_DIR=$(mktemp -d) " + slash, lines[i + 1]
          assert lines[i + 2] == "  && cd $TMP_DIR " + slash, lines[i + 2]
          assert lines[i + 3] == "  && curl -SLO $BIN_URL " + slash, lines[i + 3]
          assert lines[i + 4] == "  && tar -xzf ${BIN_URL##*/} " + slash, lines[i + 4]
          lines[i] = "RUN BIN_URL=https://api.github.com/repos/miguelmota/go-ethereum-hdwallet/releases/assets/249927833 " + slash
          lines[i + 3] = '  && curl -fSL --retry 3 --retry-max-time 60 -H "Accept: application/octet-stream" -o geth-hdwallet.tar.gz "$BIN_URL" ' + slash
          lines[i + 4] = "  && tar -xzf geth-hdwallet.tar.gz " + slash
          lines.insert(i + 4, '  && echo "a53a72d29ac0d57c36a2ab46010a6a52c6fa1bcf21345abc649f1a2161302d48  geth-hdwallet.tar.gz" | sha256sum -c - ' + slash)
          open(p, "w", encoding="utf-8").write("\n".join(lines))
          PY
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "9fb761ea6f2b3d6c5cacf31fec49bae2c9f9a5dfe50c1131ddf3975cbd7b2a05"
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: stable
          cache: true
      - name: Build Satonero daemon image
        working-directory: satonero
        timeout-minutes: 40
        run: |
          set -euo pipefail
          docker compose -f docker/compose.yml build mostro
          free_kb=$(df --output=avail -k / | tail -1)
          echo "free_kb_after_daemon_build=$free_kb"
          test "$free_kb" -ge 8388608 || { echo "INFEASIBLE-DISK: < 8 GB free"; exit 1; }
      - name: Start disposable regtest services and wait for health
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          docker compose up -d bitcoin mostro_lnd alice_lnd bob_lnd nostr_relay
          for i in $(seq 1 60); do
            out=$(docker compose ps --format '{{.Service}} {{.Health}}' bitcoin mostro_lnd alice_lnd bob_lnd nostr_relay)
            echo "$out"
            [ "$(printf '%s\n' "$out" | grep -c ' healthy$')" -eq 5 ] && exit 0
            sleep 10
          done
          echo "FAIL: regtest healthchecks not all healthy"; exit 1
      - name: Generate disposable daemon key and assert pre-invoice settings
        working-directory: satonero
        run: |
          set +x
          set -euo pipefail
          umask 077
          hex=$(docker run --rm --entrypoint nak mostro-regtest-nostr_relay key generate)
          nsec=$(printf '%s\n' "$hex" | docker run --rm -i --entrypoint nak mostro-regtest-nostr_relay encode nsec)
          pub=$(printf '%s\n' "$hex" | docker run --rm -i --entrypoint nak mostro-regtest-nostr_relay key public)
          printf '%s' "$nsec" > "$RUNNER_TEMP/daemon.nsec"
          printf '%s' "$pub" > "$RUNNER_TEMP/daemon.pub"
          unset hex nsec
          python3 - <<'PY'
          import os, tomllib
          rt = os.environ["RUNNER_TEMP"]
          src = open("settings.tpl.toml", encoding="utf-8").read()
          daemon_nsec = open(os.path.join(rt, "daemon.nsec"), encoding="utf-8").read().strip()
          replacements = [
              ("lnd_cert_file = '/home/user/.polar/networks/1/volumes/lnd/alice/tls.cert'", "lnd_cert_file = '/config/lnd/tls.cert'"),
              ("lnd_macaroon_file = '/home/user/.polar/networks/1/volumes/lnd/alice/data/chain/bitcoin/regtest/admin.macaroon'", "lnd_macaroon_file = '/config/lnd/admin.macaroon'"),
              ("lnd_grpc_host = 'https://127.0.0.1:10001'", "lnd_grpc_host = 'https://mostro_lnd:10001'"),
              ("nsec_privkey = 'nsec1...'", "nsec_privkey = '" + daemon_nsec + "'"),
              ("relays = ['ws://localhost:7000']", "relays = ['ws://nostr_relay:8080']"),
              ('bitcoin_price_api_url = "https://api.yadio.io"', 'bitcoin_price_api_url = "http://127.0.0.1:9"'),
              # Phase 6C: the daemon queues kind-38384 rating events and publishes
              # them on this tick. The default is 3600s, so a rating would never
              # reach the relay inside a run; 5s keeps the gate honest and fast.
              ("user_rates_sent_interval_seconds = 3600", "user_rates_sent_interval_seconds = 5"),
          ]
          for old, new in replacements:
              assert src.count(old) == 1, old
              src = src.replace(old, new)
          cfg = tomllib.loads(src)
          assert cfg["mostro"]["dev_fee_enabled"] is False
          # PoW must be pinned to zero: the app reads only `pow`, so a stiffer
          # `pow_first_contact` would silently drop its first contact.
          assert cfg["mostro"]["pow"] == 0
          assert cfg["mostro"].get("pow_first_contact") in (None, 0)
          assert cfg.get("anti_abuse_bond") is None or cfg["anti_abuse_bond"].get("enabled") is not True
          assert cfg.get("cashu") is None or cfg["cashu"].get("enabled") is not True
          assert cfg["nostr"]["relays"] == ["ws://nostr_relay:8080"]
          # The rating gate depends on a short publication tick: assert the
          # override actually reached the parsed settings.
          assert cfg["mostro"]["user_rates_sent_interval_seconds"] == 5
          open(os.path.join(rt, "settings.toml"), "w", encoding="utf-8").write(src)
          print("settings parsed; pow=0, bonds/Cashu/dev-fee payments disabled, rating tick=5s")
          PY
          echo "daemon pubkey: $pub"
      - name: Install settings and start daemon
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id docker-mostro -u)
          docker volume create satonero-config >/dev/null
          docker run --rm --user root --entrypoint sh -v satonero-config:/config -v mostro-regtest_mostro_lnd:/lnd:ro -v "$RUNNER_TEMP":/src:ro docker-mostro -c "set -e; mkdir -p /config/lnd; cp /src/settings.toml /config/settings.toml; cp /lnd/tls.cert /config/lnd/tls.cert; cp /lnd/data/chain/bitcoin/regtest/admin.macaroon /config/lnd/admin.macaroon; chmod 600 /config/settings.toml /config/lnd/admin.macaroon; chown -R $uid:$uid /config"
          docker network inspect mostro-regtest_default >/dev/null
          docker run -d --name satonero-daemon --network mostro-regtest_default -v satonero-config:/config docker-mostro:latest >/dev/null
          sleep 60
          test "$(docker inspect -f '{{.State.Running}}' satonero-daemon)" = true
      - name: Verify LND, mine regtest blocks, sync and maintenance off
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          lnd_id=$(docker compose exec -T --user lnd mostro_lnd lncli --network=regtest --rpcserver=localhost:10001 getinfo | jq -r .identity_pubkey)
          daemon_id=""
          for i in $(seq 1 30); do
            daemon_id=$(docker logs satonero-daemon 2>&1 | grep -a "Recorded Lightning node identity" | grep -oE '[0-9a-f]{66}' | tail -1 || true)
            [ -n "$daemon_id" ] && break
            sleep 10
          done
          test -n "$daemon_id" && test "$daemon_id" = "$lnd_id"
          if docker logs satonero-daemon 2>&1 | grep -a -E "No connection to LND|panic|REFUSING TO START"; then echo "FAIL: daemon startup/LND error"; exit 1; fi
          bc() { docker compose exec -T --user bitcoin bitcoin bitcoin-cli -regtest -rpcport=18443 -rpcuser=bitcoin -rpcpassword=bitcoin "$@"; }
          bc createwallet dev >/dev/null 2>&1 || bc loadwallet dev >/dev/null 2>&1 || true
          addr=$(bc -rpcwallet=dev getnewaddress)
          bc -rpcwallet=dev generatetoaddress 150 "$addr" >/dev/null
          synced=no
          for i in $(seq 1 60); do
            [ "$(docker compose exec -T --user lnd mostro_lnd lncli --network=regtest --rpcserver=localhost:10001 getinfo | jq -r .synced_to_chain)" = true ] && { synced=yes; break; }
            sleep 10
          done
          test "$synced" = yes
          channel_count=$(docker compose exec -T --user lnd mostro_lnd lncli --network=regtest --rpcserver=localhost:10001 listchannels | jq '.channels | length')
          test "$channel_count" = 0 || { echo "FAIL: unexpected regtest channel count=$channel_count"; exit 1; }
          sleep 320
          test "$(docker logs satonero-daemon 2>&1 | grep -a -c 'maintenance mode ON' || true)" = 0
          last_info=$(docker logs satonero-daemon 2>&1 | grep -a "Sending info about mostro" | tail -1 || true)
          if printf '%s' "$last_info" | grep -q maintenance; then echo "FAIL: maintenance advertised"; exit 1; fi
          echo "LND identity/sync and maintenance-off gates passed"
      - name: Generate the disposable maker and rater keys
        working-directory: mostro-regtest
        run: |
          set +x
          set -euo pipefail
          umask 077
          gen() {
            h=$(docker run --rm --entrypoint nak mostro-regtest-nostr_relay key generate)
            p=$(printf '%s\n' "$h" | docker run --rm -i --entrypoint nak mostro-regtest-nostr_relay key public)
            printf '%s' "$h" > "$RUNNER_TEMP/$1.hex"
            printf '%s' "$p" > "$RUNNER_TEMP/$1.pub"
            chmod 600 "$RUNNER_TEMP/$1.hex"
            printf '%s' "$p"
            unset h p
          }
          # The maker now has TWO keys, exactly like a reputation-mode client:
          # the trade key authors its kind-14 events (and is the order's seller
          # trade pubkey), the identity key proves who it is inside the
          # ciphertext. mostro-core drops a rating aimed at a full-privacy
          # counterpart, so `master_seller_pubkey` must differ from the trade
          # key for the buyer's rating to be accepted.
          trade_pub=$(gen maker)
          identity_pub=$(gen maker_identity)
          # A third key that is party to nothing: the unauthorized-rating case.
          third_pub=$(gen third)
          echo "maker trade pubkey: $trade_pub"
          echo "maker identity pubkey: $identity_pub"
          echo "third-party pubkey: $third_pub"
          unset trade_pub identity_pub third_pub
      - name: Precompute the maker's signed protocol-v2 order envelopes
        run: |
          set +x
          set -euo pipefail
          umask 077
          # The harness maker is a reputation-mode client: its orders carry the
          # 3-tuple [Message, trade_sig, [identity_pubkey, identity_sig]] that
          # mostro-core wraps and the daemon verifies. The signatures are BIP-340
          # Schnorr over the SHA-256 of the exact JSON mostro-core re-serializes,
          # so the canonical form below is the contract (see mostro-core
          # transport.rs and message.rs: MessageKind and SmallOrder field order,
          # `skip_serializing_if` on id/pubkeys/invoice/mint, plain null for the
          # remaining options).
          python3 - "$RUNNER_TEMP" <<'PY'
          import hashlib
          import json
          import os
          import sys

          rt = sys.argv[1]

          # Minimal BIP-340 signer (validated against the official test vectors
          # outside this workflow; the run self-checks the derived pubkeys).
          P = 0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEFFFFFC2F
          N = 0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141
          GX = 0x79BE667EF9DCBBAC55A06295CE870B07029BFCDB2DCE28D959F2815B16F81798
          GY = 0x483ADA7726A3C4655DA4FBFC0E1108A8FD17B448A68554199C47D08FFB10D4B8

          def inv(a):
              return pow(a, P - 2, P)

          def padd(p, q):
              if p is None:
                  return q
              if q is None:
                  return p
              x1, y1 = p
              x2, y2 = q
              if x1 == x2:
                  if (y1 + y2) % P == 0:
                      return None
                  lam = (3 * x1 * x1) * inv(2 * y1) % P
              else:
                  lam = (y2 - y1) * inv((x2 - x1) % P) % P
              x3 = (lam * lam - x1 - x2) % P
              return (x3, (lam * (x1 - x3) - y1) % P)

          def pmul(k, pt):
              out = None
              addend = pt
              while k:
                  if k & 1:
                      out = padd(out, addend)
                  addend = padd(addend, addend)
                  k >>= 1
              return out

          G = (GX, GY)

          def tagged(tag, data):
              t = hashlib.sha256(tag.encode()).digest()
              return hashlib.sha256(t + t + data).digest()

          def xonly(sk):
              d0 = int.from_bytes(sk, "big")
              assert 1 <= d0 <= N - 1
              return pmul(d0, G)[0].to_bytes(32, "big")

          def schnorr(sk, msg32):
              d0 = int.from_bytes(sk, "big")
              assert 1 <= d0 <= N - 1
              pt = pmul(d0, G)
              d = d0 if pt[1] % 2 == 0 else N - d0
              aux = os.urandom(32)
              t = d ^ int.from_bytes(tagged("BIP0340/aux", aux), "big")
              px = pt[0].to_bytes(32, "big")
              k0 = int.from_bytes(
                  tagged("BIP0340/nonce", t.to_bytes(32, "big") + px + msg32), "big"
              ) % N
              assert k0 != 0
              rp = pmul(k0, G)
              k = k0 if rp[1] % 2 == 0 else N - k0
              rx = rp[0].to_bytes(32, "big")
              e = int.from_bytes(
                  tagged("BIP0340/challenge", rx + px + msg32), "big"
              ) % N
              return rx + ((k + e * d) % N).to_bytes(32, "big")

          def read(name):
              return open(os.path.join(rt, name), encoding="utf-8").read().strip()

          trade_sk = bytes.fromhex(read("maker.hex"))
          ident_sk = bytes.fromhex(read("maker_identity.hex"))
          trade_pub = xonly(trade_sk).hex()
          ident_pub = xonly(ident_sk).hex()
          assert trade_pub == read("maker.pub").lower(), "trade pubkey mismatch"
          assert ident_pub == read("maker_identity.pub").lower(), "identity pubkey mismatch"
          assert trade_pub != ident_pub, "identity proof requires distinct keys"

          def new_order(amount, fiat_amount, request_id, trade_index):
              return {"order": {
                  "version": 2,
                  "request_id": request_id,
                  "trade_index": trade_index,
                  "action": "new-order",
                  "payload": {"order": {
                      "kind": "sell",
                      "status": "pending",
                      "amount": amount,
                      "fiat_code": "USD",
                      "min_amount": None,
                      "max_amount": None,
                      "fiat_amount": fiat_amount,
                      "payment_method": "BANK_TRANSFER",
                      "premium": 0,
                      "created_at": 0,
                      "expires_at": None,
                  }},
              }}

          def envelope(msg, path):
              canon = json.dumps(msg, separators=(",", ":"), ensure_ascii=False)
              trade_sig = schnorr(trade_sk, hashlib.sha256(canon.encode()).digest()).hex()
              proof = "mostro-transport-v2-identity:%s:%s" % (trade_pub, canon)
              ident_sig = schnorr(ident_sk, hashlib.sha256(proof.encode()).digest()).hex()
              with open(path, "w", encoding="utf-8") as f:
                  json.dump([msg, trade_sig, [ident_pub, ident_sig]], f, separators=(",", ":"))

          envelope(new_order(1000, 10, 601, 1), os.path.join(rt, "maker_order1.tuple.json"))
          envelope(new_order(1234, 12, 602, 2), os.path.join(rt, "maker_order2.tuple.json"))
          print("signed order envelopes written: trade=%s identity=%s" % (trade_pub, ident_pub))
          PY
          test -s "$RUNNER_TEMP/maker_order1.tuple.json"
          test -s "$RUNNER_TEMP/maker_order2.tuple.json"
          echo "maker order envelopes ready (trade key authors, identity key proves)"
      - name: Create one buyer regtest payout invoice
        working-directory: mostro-regtest
        run: |
          set +x
          set -euo pipefail
          umask 077
          req=$(docker compose exec -T --user lnd bob_lnd lncli --network=regtest --rpcserver=localhost:10001 addinvoice --amt 1000 --expiry 86400 | jq -r .payment_request)
          case "$req" in lnbcrt1*) ;; *) echo "FAIL: payout invoice is not regtest"; exit 1;; esac
          printf '%s\n' "$req" | grep -Eq '^lnbcrt([1-9][0-9]*[munp])?1[02-9ac-hj-np-z]{50,2000}$' || { echo "FAIL: malformed payout invoice"; exit 1; }
          printf '%s' "$req" > "$RUNNER_TEMP/taker_invoice.txt"
          chmod 600 "$RUNNER_TEMP/taker_invoice.txt"
          unset req
          echo "buyer payout invoice created (bolt11 withheld from logs)"
      - name: Write Phase 6C scripts (no keys in script files)
        run: |
          set +x
          umask 077
          cat > "$RUNNER_TEMP/maker.sh" <<'SH'
          #!/bin/sh
          # Publishes exactly one signed SELL order with nak and stops, leaving
          # the order pending on the relay for the mobile app to discover. The
          # plaintext is the precomputed reputation-mode 3-tuple (trade key +
          # identity proof); this script only encrypts and publishes it.
          set -u
          umask 077
          DAEMON="$1"; MAKER="$2"; E=/tmp/evidence
          mkdir -p "$E"; chmod 700 "$E"
          TSEND=$(date +%s); TSTART=$((TSEND - 10))
          cp /tmp/maker_order1.tuple.json "$E/maker_neworder.tuple.json"
          export NOSTR_SECRET_KEY="$(cat /tmp/maker.hex)"
          CT=$(nak encrypt --recipient-pubkey "$DAEMON" < /tmp/maker_order1.tuple.json)
          echo "encrypt_rc=$? ciphertext_chars=${#CT}"
          nak event -k 14 -c "$CT" --tag p="$DAEMON" ws://localhost:8080 < /dev/null > /tmp/maker.pub.out 2> /tmp/maker.pub.err
          echo "new_order_publish_rc=$?"
          echo "new_order_publish_stderr=$(tr '\n' ' ' < /tmp/maker.pub.err | cut -c1-200)"
          cp /tmp/maker.pub.out "$E/maker_neworder14.json"
          nak verify < "$E/maker_neworder14.json" > /dev/null 2>&1
          echo "new_order_verify_rc=$?"
          EXPR="select(.kind==14 and .pubkey==\"$DAEMON\" and ([.tags[]|select(.[0]==\"p\")]==[[\"p\",\"$MAKER\"]]) and .created_at>=$TSTART) | .id"
          : > /tmp/maker.seen
          i=0; FINAL=WINDOW
          while [ $i -lt 15 ]; do
            i=$((i+1))
            timeout 40 nak req -k 14 -a "$DAEMON" -t p="$MAKER" --limit 50 --jq "$EXPR" --jq-raw ws://localhost:8080 < /dev/null > /tmp/maker.cand 2> /tmp/maker.cand.err
            rc=$?; echo "maker_ack_poll=$i rc=$rc"
            if [ "$rc" != 0 ] || grep -Evq '^[0-9a-f]{64}$' /tmp/maker.cand; then FINAL=QUERY_FAILED; break; fi
            cat /tmp/maker.cand >> /tmp/maker.seen
            n=$(sort -u /tmp/maker.seen | grep -c . || true)
            if [ "$n" -gt 1 ]; then FINAL=AMBIGUOUS_ACK; break; fi
            sleep 20
          done
          n=$(sort -u /tmp/maker.seen | grep -c . || true)
          [ "$FINAL" != WINDOW ] || { [ "$n" = 1 ] && FINAL=SELECTED || FINAL=MISSING_ACK; }
          echo "maker_ack_candidates=$n maker_ack_final=$FINAL"
          if [ "$FINAL" = SELECTED ]; then
            ACKID=$(sort -u /tmp/maker.seen | grep . | head -1)
            printf '%s\n' "$ACKID" > "$E/maker_ack14.id"
            timeout 40 nak req --id "$ACKID" --limit 1 ws://localhost:8080 < /dev/null > "$E/maker_ack14.json" 2>/dev/null
            nak verify < "$E/maker_ack14.json" > /dev/null 2>&1
            CT2=$(timeout 40 nak req --id "$ACKID" --limit 1 --jq '.content' --jq-raw ws://localhost:8080 < /dev/null 2>/dev/null)
            nak decrypt --sender-pubkey "$DAEMON" "$CT2" < /dev/null > "$E/maker_ack.plain" 2>/dev/null
            ORDER=$(grep -oE '"id":"[0-9a-f-]{36}"' "$E/maker_ack.plain" | head -1 | cut -d'"' -f4)
            printf '%s\n' "$ORDER" > "$E/order_id.txt"
            echo "ORDER_ID=$ORDER"
            ORDER_EXPR="select(.kind==38383 and .pubkey==\"$DAEMON\" and ([.tags[]|select(.[0]==\"d\")]==[[\"d\",\"$ORDER\"]]) and ([.tags[]|select(.[0]==\"s\")]==[[\"s\",\"pending\"]]))"
            : > /tmp/order.initial.json
            for j in $(seq 1 15); do
              timeout 40 nak req -k 38383 -a "$DAEMON" -t d="$ORDER" --limit 5 --jq "$ORDER_EXPR" ws://localhost:8080 < /dev/null > /tmp/order.initial.json 2>/dev/null
              [ -s /tmp/order.initial.json ] && break
              sleep 20
            done
            cp /tmp/order.initial.json "$E/order38383.initial.json"
            if [ -s "$E/order38383.initial.json" ]; then
              nak verify < "$E/order38383.initial.json" > /dev/null 2>&1
              echo "order38383_verify_rc=$?"
            else
              FINAL=INCONCLUSIVE_INITIAL_ORDER_EVENT
            fi
          fi
          unset NOSTR_SECRET_KEY CT CT2 MSG
          echo "FINAL=$FINAL"
          SH
          cat > "$RUNNER_TEMP/findhold.sh" <<'SH'
          #!/bin/sh
          # Waits for the daemon to send the maker the seller hold invoice that
          # the mobile app's add-invoice triggers. Writes the decrypted payload
          # to /tmp/evidence and exits 0 only when a regtest hold invoice is
          # found; exits 2 after the window without one.
          set -u
          umask 077
          DAEMON="$1"; MAKER="$2"; E=/tmp/evidence
          mkdir -p "$E"; chmod 700 "$E"
          TSEND=$(date +%s); TSTART=$((TSEND - 10))
          echo "TSTART=$TSTART"
          EXPR="select(.kind==14 and .pubkey==\"$DAEMON\" and ([.tags[]|select(.[0]==\"p\")]==[[\"p\",\"$MAKER\"]]) and .created_at>=$TSTART) | .id"
          : > /tmp/hold.seen
          HOLD_ID=""; FINAL=WINDOW; CANDIDATES=0
          i=0
          while [ $i -lt 300 ]; do
            i=$((i+1))
            timeout 40 nak req -k 14 -a "$DAEMON" -t p="$MAKER" --limit 50 --jq "$EXPR" --jq-raw ws://localhost:8080 < /dev/null > /tmp/mk.cand 2>/dev/null
            rc=$?
            [ "$rc" = 0 ] && ! grep -Evq '^[0-9a-f]{64}$' /tmp/mk.cand || { FINAL=QUERY_FAILED; break; }
            for id in $(cat /tmp/mk.cand); do
              grep -qx "$id" /tmp/hold.seen && continue
              echo "$id" >> /tmp/hold.seen
              CANDIDATES=$((CANDIDATES+1))
              timeout 40 nak req --id "$id" --limit 1 ws://localhost:8080 < /dev/null > /tmp/mk.ev 2>/dev/null || continue
              [ -s /tmp/mk.ev ] || continue
              nak verify < /tmp/mk.ev > /dev/null 2>&1 || continue
              CT=$(timeout 40 nak req --id "$id" --limit 1 --jq '.content' --jq-raw ws://localhost:8080 < /dev/null 2>/dev/null)
              [ -n "$CT" ] || continue
              export NOSTR_SECRET_KEY="$(cat /tmp/maker.hex)"
              timeout 40 nak decrypt --sender-pubkey "$DAEMON" "$CT" < /dev/null > /tmp/mk.plain 2>/dev/null; DEC_RC=$?
              unset NOSTR_SECRET_KEY
              [ "$DEC_RC" = 0 ] || continue
              grep -q '"action":"pay-invoice"' /tmp/mk.plain || continue
              grep -q 'lnbcrt1' /tmp/mk.plain || continue
              HOLD_ID=$id
              cp /tmp/mk.plain "$E/hold_pay_invoice.plain"
              cp /tmp/mk.ev "$E/hold_pay_invoice14.json"
              FINAL=SELECTED
              break
            done
            [ -n "$HOLD_ID" ] && break
            sleep 5
          done
          [ -n "$HOLD_ID" ] || FINAL=MISSING_HOLD_INVOICE
          echo "hold_candidates=$CANDIDATES hold_invoice_selected=$HOLD_ID"
          echo "FINAL=$FINAL"
          [ -n "$HOLD_ID" ] || exit 2
          SH
          chmod 700 "$RUNNER_TEMP/maker.sh" "$RUNNER_TEMP/findhold.sh"
      - name: Run single maker NewOrder and capture ACK
        working-directory: mostro-regtest
        run: |
          set +x
          set -uo pipefail
          cid=$(docker compose ps -q nostr_relay); test -n "$cid"
          docker cp "$RUNNER_TEMP/maker.hex" "$cid:/tmp/maker.hex"
          docker cp "$RUNNER_TEMP/maker.sh" "$cid:/tmp/maker.sh"
          docker cp "$RUNNER_TEMP/findhold.sh" "$cid:/tmp/findhold.sh"
          docker cp "$RUNNER_TEMP/maker_order1.tuple.json" "$cid:/tmp/maker_order1.tuple.json"
          daemon=$(cat "$RUNNER_TEMP/daemon.pub"); maker=$(cat "$RUNNER_TEMP/maker.pub")
          timeout 900 docker compose exec -T nostr_relay sh /tmp/maker.sh "$daemon" "$maker" > "$RUNNER_TEMP/maker.out" 2> "$RUNNER_TEMP/maker.err"
          echo "maker script rc=$?"
          cat "$RUNNER_TEMP/maker.out"
          rm -rf "$RUNNER_TEMP/evidence"
          docker cp "$cid:/tmp/evidence" "$RUNNER_TEMP/"
          order=$(cat "$RUNNER_TEMP/evidence/order_id.txt" 2>/dev/null || true)
          echo "order id present=$([ -n "$order" ] && echo yes || echo no)"
          printf '%s' "$order" > "$RUNNER_TEMP/order_id.txt"
          grep -q '^FINAL=SELECTED$' "$RUNNER_TEMP/maker.out" || { echo "FAIL: maker new-order did not reach SELECTED"; exit 1; }
          [ -n "$order" ] || { echo "FAIL: no order id"; exit 1; }
          echo "GATE 6C-0 maker order published: $order"
      - name: Write the relay read helper and self-test it on the maker order
        working-directory: mostro-regtest
        run: |
          set +x
          set -uo pipefail
          umask 077
          D=$(cat "$RUNNER_TEMP/daemon.pub")
          # Runner-side nak: the very binary the relay image carries, so this
          # client path has no version drift and needs no network download.
          docker run --rm --entrypoint cat mostro-regtest-nostr_relay /usr/local/bin/nak \
            > "$RUNNER_TEMP/nak-host" 2>/dev/null || true
          if [ -s "$RUNNER_TEMP/nak-host" ]; then chmod 700 "$RUNNER_TEMP/nak-host"; else rm -f "$RUNNER_TEMP/nak-host"; fi
          echo "container nak version: $(docker compose exec -T nostr_relay nak --version 2>&1 | head -1 || true)"
          echo "runner nak version:    $([ -x "$RUNNER_TEMP/nak-host" ] && "$RUNNER_TEMP/nak-host" --version 2>&1 | head -1 || echo unavailable)"
          cat > "$RUNNER_TEMP/relayreq.sh" <<'SH'
          #!/bin/bash
          # Read events from the regtest relay for one filter, trying the client
          # paths in order and stopping at the first one that returns events.
          #
          # Why more than one path: the gate used to read the relay only through
          # `docker compose exec -T nostr_relay nak ...`. That exec path has been
          # observed answering EOSE with zero events for filters the relay
          # serves to clients on its published port at the same moment (the
          # relay database and the relay log both show the event was persisted
          # and served). What the gate has to verify is the relay's content, so
          # a read is accepted from any client path that actually reaches the
          # relay; every attempt is recorded in relay_req_paths.log, so the
          # divergence stays visible instead of being hidden by the fallback.
          set -u
          umask 077
          cd "$GITHUB_WORKSPACE/mostro-regtest" || exit 1
          OUT="$1"; shift
          TMP="$OUT.tmp"
          LOG="$RUNNER_TEMP/relay_req_paths.log"
          : > "$TMP"
          try() {
            label="$1"; shift
            : > "$TMP"
            case "$label" in
              container-direct)
                timeout 60 docker compose exec -T nostr_relay nak req "$@" ws://localhost:8080 \
                  < /dev/null > "$TMP" 2>/dev/null || true ;;
              container-sh)
                quoted=$(printf '%q ' "$@")
                timeout 60 docker compose exec -T nostr_relay sh -c "nak req $quoted ws://localhost:8080" \
                  < /dev/null > "$TMP" 2>/dev/null || true ;;
              host)
                if [ ! -x "$RUNNER_TEMP/nak-host" ]; then
                  echo "relayreq path=host SKIPPED unavailable args=$*" >> "$LOG"
                  return 1
                fi
                timeout 60 "$RUNNER_TEMP/nak-host" req "$@" ws://localhost:8080 \
                  < /dev/null > "$TMP" 2>/dev/null || true ;;
            esac
            n=$(jq -sc 'length' "$TMP" 2>/dev/null || echo 0)
            echo "relayreq path=$label events=${n:-0} args=$*" >> "$LOG"
            [ "${n:-0}" -gt 0 ] 2>/dev/null || return 1
            cp "$TMP" "$OUT"
            printf '%s\n' "$label" > "$RUNNER_TEMP/relay_req_last_path"
            return 0
          }
          if try container-direct "$@" || try container-sh "$@" || try host "$@"; then
            rc=0
          else
            : > "$OUT"
            rc=1
          fi
          rm -f "$TMP"
          exit "$rc"
          SH
          chmod 700 "$RUNNER_TEMP/relayreq.sh"
          bash -n "$RUNNER_TEMP/relayreq.sh"
          : > "$RUNNER_TEMP/relay_req_paths.log"
          # Self-test: the maker's kind-38383 revision must be readable before
          # the run spends ~30 minutes on the emulator.
          rc=0
          bash "$RUNNER_TEMP/relayreq.sh" "$RUNNER_TEMP/relayreq_probe.json" -k 38383 -a "$D" --limit 50 || rc=$?
          echo "relay read self-test rc=$rc"
          cat "$RUNNER_TEMP/relay_req_paths.log"
          probe=$(jq -sc 'length' "$RUNNER_TEMP/relayreq_probe.json" 2>/dev/null || echo 0)
          echo "relay read self-test: events=$probe read_path=$(cat "$RUNNER_TEMP/relay_req_last_path" 2>/dev/null || echo none)"
          jq -r '.[]? | " 38383 id=\(.id) d=\((.tags|map(select(.[0]=="d")|.[1])|first)//"-") s=\((.tags|map(select(.[0]=="s")|.[1])|first)//"-")"' \
            "$RUNNER_TEMP/relayreq_probe.json" 2>/dev/null || true
          [ "${probe:-0}" -gt 0 ] || { echo 'FAIL: no client path could read the maker order from the relay'; exit 1; }
          echo 'relay read self-test passed'
      - name: Write the Phase 6C rater (host side)
        run: |
          set +x
          umask 077
          # Drives the post-success rating lifecycle. Reads the relay through
          # the proven relay-request helper (which tries the container paths and
          # falls back to the runner-side client) and publishes through the relay
          # container, exactly like the maker and the releaser. It never touches
          # the daemon database, LN or any settlement path.
          cat > "$RUNNER_TEMP/rater.sh" <<'RATER'
          #!/bin/bash
          set -u
          umask 077
          cd "$GITHUB_WORKSPACE/mostro-regtest" || exit 1
          DAEMON="$1"; MAKER="$2"; THIRD="$3"; ORDER="$4"
          NAK="$RUNNER_TEMP/nak-host"
          STATUS="$RUNNER_TEMP/rater.status"
          RESULT="$RUNNER_TEMP/rater_state"
          LOG="$RUNNER_TEMP/rater.log"
          E="$RUNNER_TEMP/rater_evidence"
          mkdir -p "$E"; chmod 700 "$E"
          : > "$RESULT"; : > "$LOG"
          echo "STARTING" > "$STATUS"
          cid=$(docker compose ps -q nostr_relay)
          [ -n "$cid" ] || { echo "NO_RELAY" > "$STATUS"; exit 1; }

          log() { printf '%s\n' "$*" >> "$LOG"; printf '%s\n' "$*"; }
          fail() {
            log "FAIL: $*"
            printf 'FAILED: %s\n' "$*" >> "$RESULT"
            echo "FAILED" > "$STATUS"
            exit 1
          }

          # Publish one full-privacy kind-14 message from the relay container.
          send_dm() {
            local sec="$1" plain="$2"
            docker cp "$sec" "$cid:/tmp/rater_sec.hex" >/dev/null || return 1
            docker cp "$plain" "$cid:/tmp/rater_msg.json" >/dev/null || return 1
            docker compose exec -T nostr_relay sh -c '
              export NOSTR_SECRET_KEY="$(cat /tmp/rater_sec.hex)"
              CT=$(nak encrypt --recipient-pubkey "$1" < /tmp/rater_msg.json) || exit 1
              nak event -k 14 -c "$CT" --tag p="$1" ws://localhost:8080 < /dev/null > /dev/null
            ' sh "$DAEMON"
          }

          send_rate() {  # secfile rating request_id order_id
            local sec="$1" rating="$2" rid="$3" oid="$4" msg
            msg='[{"order":{"version":2,"request_id":'"$rid"',"trade_index":null,"id":"'"$oid"'","action":"rate-user","payload":{"rating_user":'"$rating"'}}},null,null]'
            printf '%s\n' "$msg" > "$E/rate_${rid}.plain"
            send_dm "$sec" "$E/rate_${rid}.plain" || return 1
            log "sent rate-user request_id=$rid rating=$rating order=$oid"
          }

          read38384() {
            : > "$E/all38384.json"
            bash "$RUNNER_TEMP/relayreq.sh" "$E/all38384.json" -k 38384 -a "$DAEMON" --limit 50 || true
            jq -sc '.' "$E/all38384.json" > "$E/all38384.tmp" 2>/dev/null || echo '[]' > "$E/all38384.tmp"
            mv "$E/all38384.tmp" "$E/all38384.json"
          }
          count38384() { jq -r 'length' "$E/all38384.json" 2>/dev/null || echo 0; }
          tagval() { jq -r --arg n "$2" '[.tags[] | select(.[0]==$n) | .[1]][0] // ""' <<< "$1"; }

          # Decrypt the daemon's DMs to the maker and look for a pattern.
          wait_dm() {  # pattern timeout_seconds
            local pattern="$1" limit="$2" deadline id ct
            : > "$E/dm_seen"
            deadline=$(( $(date +%s) + limit ))
            while [ "$(date +%s)" -lt "$deadline" ]; do
              : > "$E/dm_cand.json"
              bash "$RUNNER_TEMP/relayreq.sh" "$E/dm_cand.json" -k 14 -a "$DAEMON" -t p="$MAKER" --limit 50 || true
              jq -sc '.' "$E/dm_cand.json" > "$E/dm_cand.tmp" 2>/dev/null || echo '[]' > "$E/dm_cand.tmp"
              mv "$E/dm_cand.tmp" "$E/dm_cand.json"
              while IFS= read -r id; do
                [ -n "$id" ] || continue
                grep -qx "$id" "$E/dm_seen" && continue
                echo "$id" >> "$E/dm_seen"
                jq -r --arg id "$id" '.[] | select(.id==$id) | .content' "$E/dm_cand.json" > "$E/dm_ct" 2>/dev/null || true
                [ -s "$E/dm_ct" ] || continue
                ct=$(cat "$E/dm_ct")
                NOSTR_SECRET_KEY="$(cat "$RUNNER_TEMP/maker.hex")" \
                  "$NAK" decrypt --sender-pubkey "$DAEMON" "$ct" < /dev/null > "$E/dm_plain" 2>/dev/null || continue
                if grep -q "$pattern" "$E/dm_plain"; then
                  cp "$E/dm_plain" "$E/dm_match.json"
                  return 0
                fi
              done < <(jq -r '.[].id' "$E/dm_cand.json" 2>/dev/null)
              sleep 3
            done
            return 1
          }

          # 0) Wait for the app's rating to be processed. mostro-core weights the
          #    first review by 1/2, so the seller's aggregate is 5 -> 2.5 with one
          #    review. The daemon keys the kind-38384 event by the RATED user's
          #    trade pubkey (protocol/src/user_rating.md), so this event's d is
          #    the seller's trade pubkey for the order; identify it by its tags
          #    and assert d explicitly.
          deadline=$(( $(date +%s) + 1800 ))
          app_event=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            read38384
            app_event=$(jq -c '
              [.[] | select(
                (([.tags[] | select(.[0]=="total_rating") | .[1]][0] // "") | tonumber) == 2.5
                and ([.tags[] | select(.[0]=="total_reviews") | .[1]][0] // "") == "1")]
              | .[0] // empty' "$E/all38384.json" 2>/dev/null || true)
            [ -n "$app_event" ] && break
            sleep 3
          done
          [ -n "$app_event" ] || fail "the app's kind-38384 rating for the seller never appeared"
          printf '%s\n' "$app_event" > "$E/app_rating_event.json"
          BASE=$(count38384)
          [ "$BASE" = 1 ] || fail "expected exactly one kind-38384 before the rater checks, got $BASE"
          [ "$(tagval "$app_event" total_reviews)" = 1 ] || fail "app rating total_reviews is not 1"
          [ "$(tagval "$app_event" last_rating)" = 5 ] || fail "app rating last_rating is not 5"
          [ "$(tagval "$app_event" min_rate)" = 5 ] || fail "app rating min_rate is not 5"
          [ "$(tagval "$app_event" max_rate)" = 5 ] || fail "app rating max_rate is not 5"
          [ "$(tagval "$app_event" d)" = "$MAKER" ] \
            || fail "app rating event is not keyed by the rated seller's trade pubkey"
          log "APP_RATING_38384_COUNT=$BASE d=$(tagval "$app_event" d) total_rating=$(tagval "$app_event" total_rating)"

          # 1) Invalid rating value (6) from the seller. The daemon rejects it
          #    before claiming the seller flag, so a later valid rating works.
          send_rate "$RUNNER_TEMP/maker.hex" 6 603 "$ORDER" || fail "invalid-rating message could not be published"
          sleep 12
          read38384; c=$(count38384)
          [ "$c" = "$BASE" ] || fail "invalid rating value created a kind-38384 event (count=$c)"
          log "INVALID_COUNT_AFTER=$c"

          # 2) Unknown order reference: the daemon answers cant-do/not_found.
          BAD=$(cat /proc/sys/kernel/random/uuid)
          send_rate "$RUNNER_TEMP/maker.hex" 5 604 "$BAD" || fail "unknown-order rating could not be published"
          wait_dm '"cant_do":"not_found"' 90 || fail "no cant-do not_found for an unknown order"
          log "INCORRECT_CANTDO=not_found"
          sleep 8
          read38384; c=$(count38384)
          [ "$c" = "$BASE" ] || fail "unknown-order rating created a kind-38384 event (count=$c)"
          log "INCORRECT_COUNT_AFTER=$c"

          # 3) A third key that is party to nothing: the daemon ignores it.
          send_rate "$RUNNER_TEMP/third.hex" 5 605 "$ORDER" || fail "unauthorized rating could not be published"
          sleep 12
          read38384; c=$(count38384)
          [ "$c" = "$BASE" ] || fail "unauthorized rating created a kind-38384 event (count=$c)"
          log "UNAUTHORIZED_COUNT_AFTER=$c"

          # 4) The seller rates the buyer (4/5). The buyer proved an identity key
          #    on take-sell, so the aggregate is stored and published. The event
          #    is keyed by the RATED user's trade pubkey, i.e. the buyer's trade
          #    pubkey for this order (the gate checks it against the app key).
          send_rate "$RUNNER_TEMP/maker.hex" 4 606 "$ORDER" || fail "seller rating could not be published"
          wait_dm '"action":"rate-received"' 90 || fail "no rate-received for the seller rating"
          grep -q '"rating_user":4' "$E/dm_match.json" || fail "rate-received payload is not rating_user=4"
          log "SELLER_RATE_RECEIVED=yes"
          sleep 15
          read38384; c=$(count38384)
          [ "$c" = "$((BASE + 1))" ] || fail "seller rating did not add exactly one kind-38384 (count=$c)"
          jq -c '[.[] | select(
              (([.tags[] | select(.[0]=="total_rating") | .[1]][0] // "") | tonumber) == 2.0
              and ([.tags[] | select(.[0]=="total_reviews") | .[1]][0] // "") == "1")]
            | .[0] // empty' "$E/all38384.json" > "$E/seller_rating_event.json"
          [ -s "$E/seller_rating_event.json" ] || fail "the seller's rating event is missing (1 review / 2.0)"
          [ "$(tagval "$(cat "$E/seller_rating_event.json")" d)" != "$MAKER" ] \
            || fail "the seller's rating event is still keyed by the rater's trade pubkey"
          SELLER_EVENT=$(cat "$E/seller_rating_event.json")
          SELLER_D=$(tagval "$SELLER_EVENT" d)
          SELLER_TR=$(tagval "$SELLER_EVENT" total_rating)
          SELLER_REV=$(tagval "$SELLER_EVENT" total_reviews)
          SELLER_LAST=$(tagval "$SELLER_EVENT" last_rating)
          [ "$SELLER_REV" = 1 ] || fail "seller rating event total_reviews is not 1"
          [ "$SELLER_LAST" = 4 ] || fail "seller rating event last_rating is not 4"
          [ "$(printf '%s' "$SELLER_TR" | python3 -c 'import sys;print(int(float(sys.stdin.read())==2.0))')" = 1 ] \
            || fail "seller rating event total_rating is not 2.0 (got $SELLER_TR)"
          log "SELLER_RATING_EVENT d=$SELLER_D total_rating=$SELLER_TR total_reviews=$SELLER_REV last_rating=$SELLER_LAST"

          # 5) A duplicate rating from the same side must not add an event.
          send_rate "$RUNNER_TEMP/maker.hex" 4 607 "$ORDER" || fail "duplicate rating could not be published"
          sleep 12
          read38384; c=$(count38384)
          FINAL_COUNT=$c
          [ "$c" = "$((BASE + 1))" ] || fail "duplicate rating added a kind-38384 event (count=$c)"
          log "DUPLICATE_COUNT_AFTER=$c"

          # 6) A fresh pending order for the reputation display. It is signed with
          #    the same identity key, so the daemon attaches the seller's updated
          #    aggregate (2.5 / 1) to it and the app can render that number.
          docker cp "$RUNNER_TEMP/maker.hex" "$cid:/tmp/rater_sec.hex" >/dev/null \
            || fail "could not stage the maker key for the reputation order"
          docker cp "$RUNNER_TEMP/maker_order2.tuple.json" "$cid:/tmp/rater_order.json" >/dev/null \
            || fail "could not stage the reputation order envelope"
          docker compose exec -T nostr_relay sh -c '
            export NOSTR_SECRET_KEY="$(cat /tmp/rater_sec.hex)"
            CT=$(nak encrypt --recipient-pubkey "$1" < /tmp/rater_order.json) || exit 1
            nak event -k 14 -c "$CT" --tag p="$1" ws://localhost:8080 < /dev/null > /dev/null
          ' sh "$DAEMON" || fail "second order publish failed"
          deadline=$(( $(date +%s) + 180 ))
          : > "$E/order2_38383.json"
          while [ "$(date +%s)" -lt "$deadline" ]; do
            : > "$E/orders.json"
            bash "$RUNNER_TEMP/relayreq.sh" "$E/orders.json" -k 38383 -a "$DAEMON" --limit 50 || true
            jq -sc '.' "$E/orders.json" > "$E/orders.tmp" 2>/dev/null || echo '[]' > "$E/orders.tmp"
            mv "$E/orders.tmp" "$E/orders.json"
            jq -c '[.[] | select((.tags | any(.[0]=="s" and .[1]=="pending"))
                                 and (.tags | any(.[0]=="amt" and .[1]=="1234")))][0] // empty' \
              "$E/orders.json" > "$E/order2_38383.json" 2>/dev/null || true
            [ -s "$E/order2_38383.json" ] && break
            sleep 3
          done
          [ -s "$E/order2_38383.json" ] || fail "the fresh pending order never appeared on the relay"
          ORDER2=$(jq -r '[.tags[] | select(.[0]=="d") | .[1]][0]' "$E/order2_38383.json")
          RATING_TAG=$(jq -r '[.tags[] | select(.[0]=="rating") | .[1]][0] // "missing"' "$E/order2_38383.json")
          printf '%s\n' "$RATING_TAG" > "$E/order2.rating"
          printf '%s' "$RATING_TAG" | jq -e '.[1].total_reviews == 1 and .[1].total_rating == 2.5' >/dev/null 2>&1 \
            || fail "fresh order rating tag is not 1 review / 2.5: $RATING_TAG"
          log "SECOND_ORDER_ID=$ORDER2"
          log "SECOND_ORDER_RATING=$RATING_TAG"

          read38384
          FINAL=$(count38384)
          [ "$FINAL" = "$((BASE + 1))" ] || fail "unexpected kind-38384 total after all checks ($FINAL)"
          {
            printf 'APP_RATING_38384_COUNT=%s\n' "$BASE"
            printf 'APP_RATING_D=%s\n' "$(tagval "$app_event" d)"
            printf 'INVALID_COUNT_AFTER=%s\n' "$BASE"
            printf 'INCORRECT_CANTDO=not_found\n'
            printf 'UNAUTHORIZED_COUNT_AFTER=%s\n' "$BASE"
            printf 'SELLER_RATE_RECEIVED=yes\n'
            printf 'SELLER_RATING_EVENT_D=%s\n' "$SELLER_D"
            printf 'SELLER_RATING_TOTAL_RATING=%s\n' "$SELLER_TR"
            printf 'SELLER_RATING_TOTAL_REVIEWS=%s\n' "$SELLER_REV"
            printf 'SELLER_RATING_LAST=%s\n' "$SELLER_LAST"
            printf 'DUPLICATE_COUNT_AFTER=%s\n' "$FINAL_COUNT"
            printf 'SECOND_ORDER_ID=%s\n' "$ORDER2"
            printf 'SECOND_ORDER_RATING_TAG=%s\n' "$RATING_TAG"
            printf 'FINAL_38384_COUNT=%s\n' "$FINAL"
            printf 'FINAL=ok\n'
          } >> "$RESULT"
          echo "OK" > "$STATUS"
          log "RATER_FINAL=ok"
          RATER
          chmod 700 "$RUNNER_TEMP/rater.sh"
          bash -n "$RUNNER_TEMP/rater.sh"
      - name: Fund seller and open exactly one regtest channel to the daemon
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          umask 077
          SELLER_ID=$(docker compose exec -T --user lnd alice_lnd lncli --network=regtest --rpcserver=localhost:10001 getinfo | jq -r .identity_pubkey)
          DAEMON_ID=$(docker compose exec -T --user lnd mostro_lnd lncli --network=regtest --rpcserver=localhost:10001 getinfo | jq -r .identity_pubkey)
          [ "$SELLER_ID" != "$DAEMON_ID" ] || { echo 'FAIL: seller is daemon'; exit 1; }
          bc() { docker compose exec -T --user bitcoin bitcoin bitcoin-cli -regtest -rpcport=18443 -rpcuser=bitcoin -rpcpassword=bitcoin "$@"; }
          ln_alice() { docker compose exec -T --user lnd alice_lnd lncli --network=regtest --rpcserver=localhost:10001 "$@"; }
          ln_mostro() { docker compose exec -T --user lnd mostro_lnd lncli --network=regtest --rpcserver=localhost:10001 "$@"; }
          wait_sync() {
            svc=$1
            for i in $(seq 1 120); do
              case "$svc" in
                alice_lnd) gi=$(ln_alice getinfo);;
                mostro_lnd) gi=$(ln_mostro getinfo);;
              esac
              [ "$(printf '%s' "$gi" | jq -r .synced_to_chain)" = true ] && return 0
              sleep 2
            done
            return 1
          }
          addr=$(ln_alice newaddress p2wkh | jq -r .address)
          bc -rpcwallet=dev sendtoaddress "$addr" 0.1 >/dev/null
          mine=$(bc -rpcwallet=dev getnewaddress)
          bc -rpcwallet=dev generatetoaddress 3 "$mine" >/dev/null
          wait_sync alice_lnd; wait_sync mostro_lnd
          ln_alice connect "$DAEMON_ID@mostro_lnd" >/dev/null
          ln_alice openchannel "$DAEMON_ID" 1000000 0 >/dev/null
          bc -rpcwallet=dev generatetoaddress 6 "$mine" >/dev/null
          ch=0; dch=0; pend=1; dpend=1
          for i in $(seq 1 120); do
            ch=$(ln_alice listchannels | jq --arg id "$DAEMON_ID" '[.channels[]|select(.remote_pubkey==$id and .active==true)]|length')
            dch=$(ln_mostro listchannels | jq --arg id "$SELLER_ID" '[.channels[]|select(.remote_pubkey==$id and .active==true)]|length')
            pend=$(ln_alice pendingchannels | jq '((.pending_open_channels|length)+(.pending_closing_channels|length)+(.pending_force_closing_channels|length)+(.waiting_close_channels|length))')
            dpend=$(ln_mostro pendingchannels | jq '((.pending_open_channels|length)+(.pending_closing_channels|length)+(.pending_force_closing_channels|length)+(.waiting_close_channels|length))')
            [ "$ch" = 1 ] && [ "$dch" = 1 ] && [ "$pend" = 0 ] && [ "$dpend" = 0 ] && break
            sleep 2
          done
          [ "$ch" = 1 ] || { echo 'FAIL: seller channel not active'; exit 1; }
          [ "$dch" = 1 ] || { echo 'FAIL: daemon channel not active'; exit 1; }
          [ "$pend" = 0 ] && [ "$dpend" = 0 ] || { echo 'FAIL: pending channel'; exit 1; }
          [ "$(ln_alice listchannels | jq '.channels|length')" = 1 ] || { echo 'FAIL: seller extra channels'; exit 1; }
          [ "$(ln_mostro listchannels | jq '.channels|length')" = 1 ] || { echo 'FAIL: daemon extra channels'; exit 1; }
          [ "$(ln_alice listpayments --include_incomplete | jq '.payments|length')" = 0 ] || { echo 'FAIL: seller already paid'; exit 1; }
          local=$(ln_alice channelbalance | jq -r '.local_balance.sat')
          {
            printf 'SELLER_ID=%s\n' "$SELLER_ID"
            printf 'DAEMON_ID=%s\n' "$DAEMON_ID"
            printf 'CHANNEL_LOCAL=%s\n' "$local"
          } > "$RUNNER_TEMP/phase6c_vars"
          chmod 600 "$RUNNER_TEMP/phase6c_vars"
          echo "channel ok: seller<->daemon active both sides local_sats=$local"
      - name: Fund the daemon and open the settlement channel to the buyer
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          umask 077
          # The buyer payout is paid by the daemon's own LND node, so the daemon
          # needs outbound liquidity towards the buyer. Phase 6A funded only the
          # seller and asserted a single seller<->daemon channel; that assertion
          # is untouched above. This step adds exactly one daemon<->buyer
          # channel on top of it, funds `mostro_lnd` on-chain for the reserve,
          # and proves a 1000-sat payout route exists BEFORE any release can
          # happen. The order fee is 0 in the pinned settings, so the payout is
          # exactly the 1000-sat order amount.
          source "$RUNNER_TEMP/phase6c_vars"
          bc() { docker compose exec -T --user bitcoin bitcoin bitcoin-cli -regtest -rpcport=18443 -rpcuser=bitcoin -rpcpassword=bitcoin "$@"; }
          ln_alice() { docker compose exec -T --user lnd alice_lnd lncli --network=regtest --rpcserver=localhost:10001 "$@"; }
          ln_mostro() { docker compose exec -T --user lnd mostro_lnd lncli --network=regtest --rpcserver=localhost:10001 "$@"; }
          ln_bob() { docker compose exec -T --user lnd bob_lnd lncli --network=regtest --rpcserver=localhost:10001 "$@"; }
          wait_sync() {
            for i in $(seq 1 120); do
              [ "$(ln_mostro getinfo | jq -r .synced_to_chain)" = true ] && return 0
              sleep 2
            done
            return 1
          }
          BOB_ID=$(ln_bob getinfo | jq -r .identity_pubkey)
          test -n "$BOB_ID" && [ "$BOB_ID" != "$DAEMON_ID" ] || { echo 'FAIL: buyer is daemon'; exit 1; }
          [ "$(ln_bob listchannels | jq '.channels|length')" = 0 ] || { echo 'FAIL: buyer already has channels'; exit 1; }
          addr=$(ln_mostro newaddress p2wkh | jq -r .address)
          bc -rpcwallet=dev sendtoaddress "$addr" 0.1 >/dev/null
          mine=$(bc -rpcwallet=dev getnewaddress)
          bc -rpcwallet=dev generatetoaddress 3 "$mine" >/dev/null
          wait_sync
          ln_mostro connect "$BOB_ID@bob_lnd" >/dev/null
          ln_mostro openchannel "$BOB_ID" 1000000 >/dev/null
          bc -rpcwallet=dev generatetoaddress 6 "$mine" >/dev/null
          dch=0; bch=0; pend=1; bpnd=1
          for i in $(seq 1 120); do
            dch=$(ln_mostro listchannels | jq --arg id "$BOB_ID" '[.channels[]|select(.remote_pubkey==$id and .active==true)]|length')
            bch=$(ln_bob listchannels | jq --arg id "$DAEMON_ID" '[.channels[]|select(.remote_pubkey==$id and .active==true)]|length')
            pend=$(ln_mostro pendingchannels | jq '((.pending_open_channels|length)+(.pending_closing_channels|length)+(.pending_force_closing_channels|length)+(.waiting_close_channels|length))')
            bpnd=$(ln_bob pendingchannels | jq '((.pending_open_channels|length)+(.pending_closing_channels|length)+(.pending_force_closing_channels|length)+(.waiting_close_channels|length))')
            [ "$dch" = 1 ] && [ "$bch" = 1 ] && [ "$pend" = 0 ] && [ "$bpnd" = 0 ] && break
            sleep 2
          done
          [ "$dch" = 1 ] || { echo 'FAIL: daemon->buyer channel not active on the daemon'; exit 1; }
          [ "$bch" = 1 ] || { echo 'FAIL: daemon->buyer channel not active on the buyer'; exit 1; }
          [ "$pend" = 0 ] && [ "$bpnd" = 0 ] || { echo 'FAIL: pending settlement channel'; exit 1; }
          [ "$(ln_mostro listchannels | jq '.channels|length')" = 2 ] || { echo 'FAIL: daemon channel count is not 2'; exit 1; }
          [ "$(ln_bob listchannels | jq '.channels|length')" = 1 ] || { echo 'FAIL: buyer channel count is not 1'; exit 1; }
          [ "$(ln_alice listchannels | jq '.channels|length')" = 1 ] || { echo 'FAIL: seller channel count changed'; exit 1; }
          daemon_local=$(ln_mostro channelbalance | jq -r '.local_balance.sat')
          [ "${daemon_local:-0}" -ge 1000 ] || { echo "FAIL: daemon outbound $daemon_local < 1000"; exit 1; }
          # Route preflight: no payment is made, the daemon only asks LND which
          # path it would take. LND 0.18 renamed the destination flag, so accept
          # either spelling and fail loudly if neither yields a route.
          routes=""
          for flag in --dest_pubkey --dest; do
            if routes=$(ln_mostro queryroutes "$flag" "$BOB_ID" --amt 1000 2>/dev/null) \
               && printf '%s' "$routes" | jq -e '(.routes|length) >= 1' >/dev/null 2>&1; then
              break
            fi
            routes=""
          done
          [ -n "$routes" ] || { echo 'FAIL: no payout route daemon->buyer for 1000 sat'; exit 1; }
          total_msat=$(printf '%s' "$routes" | jq -r '.routes[0].total_amt_msat // 0')
          hops=$(printf '%s' "$routes" | jq -r '.routes[0].hops | length')
          [ "${total_msat:-0}" -ge 1000000 ] || { echo "FAIL: payout route total_amt_msat=$total_msat < 1000000"; exit 1; }
          {
            printf 'BOB_ID=%s\n' "$BOB_ID"
            printf 'DAEMON_OUTBOUND=%s\n' "$daemon_local"
            printf 'PAYOUT_ROUTE_MSAT=%s\n' "$total_msat"
            printf 'PAYOUT_ROUTE_HOPS=%s\n' "$hops"
          } >> "$RUNNER_TEMP/phase6c_vars"
          echo "settlement channel ok: daemon<->buyer active, daemon outbound=$daemon_local sats, route to buyer total_msat=$total_msat hops=$hops (no payment made)"
      - name: Install mobile dependencies and build the debug APK
        working-directory: mobile
        timeout-minutes: 40
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get
          dart run build_runner build -d
          flutter gen-l10n
          flutter analyze
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
          echo "debug APK built"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phase6d-satonero-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Write the hold-invoice payer (host side)
        run: |
          set +x
          umask 077
          cat > "$RUNNER_TEMP/payer.sh" <<'SH'
          #!/bin/bash
          # Waits for the mobile app's add-invoice to make the daemon create the
          # seller hold invoice, then pays it exactly once with alice_lnd.
          # Never settles and never releases: Phase 6C stops at `active`.
          set -u
          umask 077
          cd "$GITHUB_WORKSPACE/mostro-regtest" || exit 1
          DAEMON="$1"; MAKER="$2"
          STATUS="$RUNNER_TEMP/payer.status"
          echo "STARTING" > "$STATUS"
          cid=$(docker compose ps -q nostr_relay)
          [ -n "$cid" ] || { echo "NO_RELAY" > "$STATUS"; exit 1; }
          docker cp "$RUNNER_TEMP/findhold.sh" "$cid:/tmp/findhold.sh"
          timeout 2400 docker compose exec -T nostr_relay sh /tmp/findhold.sh "$DAEMON" "$MAKER" > "$RUNNER_TEMP/findhold.out" 2>&1
          find_rc=$?
          cat "$RUNNER_TEMP/findhold.out"
          if [ "$find_rc" -ne 0 ]; then
            echo "FINDHOLD_FAILED rc=$find_rc" > "$STATUS"
            exit 1
          fi
          docker cp "$cid:/tmp/evidence/hold_pay_invoice.plain" "$RUNNER_TEMP/hold_pay_invoice.plain" || {
            echo "NO_HOLD_EVIDENCE" > "$STATUS"; exit 1; }
          HOLD=$(jq -r '.[0].order.payload.payment_request[1]' "$RUNNER_TEMP/hold_pay_invoice.plain")
          case "$HOLD" in lnbcrt1*) ;; *) echo "BAD_HOLD_INVOICE" > "$STATUS"; exit 1;; esac
          printf '%s' "$HOLD" > "$RUNNER_TEMP/hold_invoice.txt"
          chmod 600 "$RUNNER_TEMP/hold_invoice.txt"
          ln_mostro() { docker compose exec -T --user lnd mostro_lnd lncli --network=regtest --rpcserver=localhost:10001 "$@"; }
          ln_alice() { docker compose exec -T --user lnd alice_lnd lncli --network=regtest --rpcserver=localhost:10001 "$@"; }
          ln_bob() { docker compose exec -T --user lnd bob_lnd lncli --network=regtest --rpcserver=localhost:10001 "$@"; }
          HOLD_HASH=$(ln_mostro decodepayreq "$HOLD" | jq -r .payment_hash)
          echo "HOLD_HASH=$HOLD_HASH"
          printf '%s' "$HOLD_HASH" > "$RUNNER_TEMP/hold_hash.txt"
          HOLD_AMT=$(ln_mostro decodepayreq "$HOLD" | jq -r .num_satoshis)
          echo "HOLD_AMT=$HOLD_AMT"
          ( ln_alice payinvoice --force --pay_req "$HOLD" --timeout 900s --json --inflight_updates > "$RUNNER_TEMP/alice_pay.out" 2>&1 ) &
          PAY_PID=$!
          printf '%s' "$PAY_PID" > "$RUNNER_TEMP/alice_pay.pid"
          state=OPEN
          for i in $(seq 1 150); do
            state=$(ln_mostro lookupinvoice "$HOLD_HASH" | jq -r .state 2>/dev/null || echo error)
            [ "$state" = ACCEPTED ] && break
            if [ "$state" = SETTLED ] || [ "$state" = CANCELED ]; then
              echo "UNEXPECTED_HOLD_STATE state=$state" > "$STATUS"; exit 1
            fi
            sleep 2
          done
          if [ "$state" != ACCEPTED ]; then
            echo "HOLD_NOT_ACCEPTED state=$state" > "$STATUS"; exit 1
          fi
          echo "ACCEPTED"
          total=0; count=0; status=missing
          for i in $(seq 1 120); do
            pay=$(ln_alice listpayments --include_incomplete 2>/dev/null || echo '{}')
            total=$(printf '%s' "$pay" | jq '.payments|length' 2>/dev/null || echo 0)
            count=$(printf '%s' "$pay" | jq --arg h "$HOLD_HASH" '[.payments[]?|select(.payment_hash==$h)]|length' 2>/dev/null || echo 0)
            status=$(printf '%s' "$pay" | jq -r --arg h "$HOLD_HASH" '[.payments[]?|select(.payment_hash==$h)]|.[0].status // "missing"' 2>/dev/null || echo missing)
            [ "$total" = 1 ] && [ "$count" = 1 ] && [ "$status" = IN_FLIGHT ] && break
            sleep 2
          done
          {
            printf 'HOLD_STATE=%s\n' "$state"
            printf 'SELLER_PAYMENT_COUNT=%s\n' "$count"
            printf 'SELLER_TOTAL_PAYMENTS=%s\n' "$total"
            printf 'SELLER_PAYMENT_STATUS=%s\n' "$status"
          } > "$RUNNER_TEMP/payer_state"
          if [ "$total" = 1 ] && [ "$count" = 1 ] && [ "$status" = IN_FLIGHT ]; then
            echo "PAID" > "$STATUS"
            exit 0
          fi
          echo "PAY_STATE_MISMATCH total=$total count=$count status=$status" > "$STATUS"
          exit 1
          SH
          chmod 700 "$RUNNER_TEMP/payer.sh"
      - name: Write the orderbook watcher (host side)
        run: |
          set +x
          umask 077
          cat > "$RUNNER_TEMP/watch38383.sh" <<'SH'
          #!/bin/bash
          # Records the daemon's kind-38383 `s=in-progress` revision while the
          # trade is live. A parameterized replaceable event can be superseded
          # by a later revision, and a relay may answer a `#d` tag filter
          # differently from a plain author filter, so the gate must not depend
          # on finding the revision only at the end of the run. The script
          # queries ALL of the daemon's kind-38383 events (no tag filter) and
          # selects the one with d=<order> and s=in-progress locally.
          set -u
          umask 077
          cd "$GITHUB_WORKSPACE/mostro-regtest" || exit 1
          DAEMON="$1"; ORDER="$2"
          OUT="$RUNNER_TEMP/watcher38383.json"
          SEEN="$RUNNER_TEMP/watcher38383_seen.jsonl"
          LOG="$RUNNER_TEMP/watcher38383.log"
          ERR="$RUNNER_TEMP/watcher38383.err"
          : > "$OUT"; : > "$SEEN"; : > "$LOG"; : > "$ERR"
          echo "WATCHING daemon=$DAEMON order=$ORDER" >> "$LOG"
          for i in $(seq 1 300); do
            : > "$RUNNER_TEMP/watcher38383_poll.json"
            bash "$RUNNER_TEMP/relayreq.sh" "$RUNNER_TEMP/watcher38383_poll.json" \
              -k 38383 -a "$DAEMON" --limit 50 >> "$ERR" 2>&1 || true
            jq -sc '.' "$RUNNER_TEMP/watcher38383_poll.json" > "$RUNNER_TEMP/watcher38383_poll.tmp" 2>/dev/null \
              || echo '[]' > "$RUNNER_TEMP/watcher38383_poll.tmp"
            mv "$RUNNER_TEMP/watcher38383_poll.tmp" "$RUNNER_TEMP/watcher38383_poll.json"
            jq -c '.[]' "$RUNNER_TEMP/watcher38383_poll.json" >> "$SEEN" 2>/dev/null || true
            match=$(jq -c --arg d "$ORDER" \
              'map(select((.tags | any(.[0]=="d" and .[1]==$d)) and (.tags | any(.[0]=="s" and .[1]=="in-progress")))) | .[0] // empty' \
              "$RUNNER_TEMP/watcher38383_poll.json" 2>/dev/null || true)
            if [ -n "$match" ]; then
              printf '%s\n' "$match" > "$OUT.tmp" && mv "$OUT.tmp" "$OUT"
              echo "FOUND poll=$i created_at=$(printf '%s' "$match" | jq -r '.created_at')" >> "$LOG"
              sort -u "$SEEN" -o "$SEEN" 2>/dev/null || true
              exit 0
            fi
            sleep 2
          done
          sort -u "$SEEN" -o "$SEEN" 2>/dev/null || true
          echo "TIMEOUT" >> "$LOG"
          exit 3
          SH
          chmod 700 "$RUNNER_TEMP/watch38383.sh"
          bash -n "$RUNNER_TEMP/watch38383.sh"
      - name: Write the settlement releaser (host side)
        run: |
          set +x
          umask 077
          # The inner script runs inside the relay container, next to the maker
          # key and `nak`, exactly like findhold.sh. It waits for the daemon's
          # `fiat-sent-ok` DM to the maker (the buyer marked the fiat as sent in
          # the app) and then publishes the seller `release` action — the only
          # settlement-side actor the harness adds. The daemon does the rest:
          # settle the hold invoice, pay the buyer payout invoice, Success.
          cat > "$RUNNER_TEMP/releaser_inner.sh" <<'SH'
          #!/bin/sh
          # Waits for the buyer's fiat-sent to reach the maker, then releases.
          # Never pays, never settles, never touches the daemon database.
          set -u
          umask 077
          DAEMON="$1"; MAKER="$2"; ORDER="$3"; E=/tmp/evidence
          mkdir -p "$E"; chmod 700 "$E"
          TSEND=$(date +%s); TSTART=$((TSEND - 10))
          echo "TSTART=$TSTART"
          EXPR="select(.kind==14 and .pubkey==\"$DAEMON\" and ([.tags[]|select(.[0]==\"p\")]==[[\"p\",\"$MAKER\"]]) and .created_at>=$TSTART) | .id"
          : > /tmp/fiat.seen
          FOUND=""; CANDIDATES=0
          i=0
          while [ $i -lt 300 ]; do
            i=$((i+1))
            timeout 40 nak req -k 14 -a "$DAEMON" -t p="$MAKER" --limit 50 --jq "$EXPR" --jq-raw ws://localhost:8080 < /dev/null > /tmp/fiat.cand 2>/dev/null
            rc=$?
            [ "$rc" = 0 ] || { echo "fiat_poll=$i rc=$rc"; sleep 5; continue; }
            for id in $(cat /tmp/fiat.cand); do
              grep -qx "$id" /tmp/fiat.seen && continue
              echo "$id" >> /tmp/fiat.seen
              CANDIDATES=$((CANDIDATES+1))
              timeout 40 nak req --id "$id" --limit 1 ws://localhost:8080 < /dev/null > /tmp/fiat.ev 2>/dev/null || continue
              [ -s /tmp/fiat.ev ] || continue
              nak verify < /tmp/fiat.ev > /dev/null 2>&1 || continue
              CT=$(timeout 40 nak req --id "$id" --limit 1 --jq '.content' --jq-raw ws://localhost:8080 < /dev/null 2>/dev/null)
              [ -n "$CT" ] || continue
              export NOSTR_SECRET_KEY="$(cat /tmp/maker.hex)"
              timeout 40 nak decrypt --sender-pubkey "$DAEMON" "$CT" < /dev/null > /tmp/fiat.plain 2>/dev/null; DEC_RC=$?
              unset NOSTR_SECRET_KEY
              [ "$DEC_RC" = 0 ] || continue
              grep -q '"action":"fiat-sent-ok"' /tmp/fiat.plain || continue
              FOUND=$id
              cp /tmp/fiat.plain "$E/fiat_sent_ok.plain"
              cp /tmp/fiat.ev "$E/fiat_sent_ok14.json"
              break
            done
            [ -n "$FOUND" ] && break
            sleep 5
          done
          echo "fiat_candidates=$CANDIDATES fiat_sent_ok_dm=$FOUND"
          if [ -z "$FOUND" ]; then echo "NO_FIAT_SENT_OK"; exit 2; fi
          # Release carries no payload: mostrod only needs the order id and a
          # seller-signed envelope (it rejects a non-seller sender).
          MSG='[{"order":{"version":2,"request_id":602,"id":"'"$ORDER"'","action":"release","payload":null}},null,null]'
          printf '%s\n' "$MSG" > "$E/release.plain"
          export NOSTR_SECRET_KEY="$(cat /tmp/maker.hex)"
          CT=$(nak encrypt --recipient-pubkey "$DAEMON" "$MSG" < /dev/null)
          echo "release_encrypt_rc=$? ciphertext_chars=${#CT}"
          nak event -k 14 -c "$CT" --tag p="$DAEMON" ws://localhost:8080 < /dev/null > /tmp/release.pub.out 2> /tmp/release.pub.err
          REL_RC=$?
          echo "release_publish_rc=$REL_RC"
          echo "release_publish_stderr=$(tr '\n' ' ' < /tmp/release.pub.err | cut -c1-200)"
          cp /tmp/release.pub.out "$E/release14.json"
          unset NOSTR_SECRET_KEY CT MSG
          if [ "$REL_RC" != 0 ]; then echo "RELEASE_PUBLISH_FAILED"; exit 3; fi
          nak verify < "$E/release14.json" > /dev/null 2>&1
          echo "release_verify_rc=$?"
          echo "RELEASED"
          SH
          cat > "$RUNNER_TEMP/releaser.sh" <<'SH'
          #!/bin/bash
          # Host wrapper: copies the release driver into the relay container and
          # runs it there, so it uses the same pinned `nak` and the same maker
          # key path as the maker and the hold-invoice finder.
          set -u
          umask 077
          cd "$GITHUB_WORKSPACE/mostro-regtest" || exit 1
          DAEMON="$1"; MAKER="$2"; ORDER="$3"
          STATUS="$RUNNER_TEMP/releaser.status"
          echo "STARTING" > "$STATUS"
          cid=$(docker compose ps -q nostr_relay)
          [ -n "$cid" ] || { echo "NO_RELAY" > "$STATUS"; exit 1; }
          docker cp "$RUNNER_TEMP/releaser_inner.sh" "$cid:/tmp/releaser_inner.sh"
          timeout 2400 docker compose exec -T nostr_relay sh /tmp/releaser_inner.sh "$DAEMON" "$MAKER" "$ORDER" > "$RUNNER_TEMP/releaser.out" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/releaser.out"
          if [ "$rc" -ne 0 ]; then
            echo "RELEASER_FAILED rc=$rc" > "$STATUS"
            exit 1
          fi
          docker cp "$cid:/tmp/evidence/fiat_sent_ok.plain" "$RUNNER_TEMP/fiat_sent_ok.plain" 2>/dev/null || true
          docker cp "$cid:/tmp/evidence/release14.json" "$RUNNER_TEMP/release14.json" 2>/dev/null || true
          echo "RELEASED" > "$STATUS"
          exit 0
          SH
          chmod 700 "$RUNNER_TEMP/releaser_inner.sh" "$RUNNER_TEMP/releaser.sh"
          sh -n "$RUNNER_TEMP/releaser_inner.sh"
          bash -n "$RUNNER_TEMP/releaser.sh"
      - name: Enable KVM for the Android emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Launch the hold-invoice payer in the background
        working-directory: mostro-regtest
        run: |
