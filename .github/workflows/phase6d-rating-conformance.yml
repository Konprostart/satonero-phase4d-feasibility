          nohup bash "$RUNNER_TEMP/releaser.sh" "$(cat "$RUNNER_TEMP/daemon.pub")" "$(cat "$RUNNER_TEMP/maker.pub")" "$(cat "$RUNNER_TEMP/order_id.txt")" \
            > "$RUNNER_TEMP/releaser.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/releaser.pid"
          for i in $(seq 1 30); do
            [ -f "$RUNNER_TEMP/releaser.status" ] && break
            sleep 1
          done
          test -f "$RUNNER_TEMP/releaser.status" || { echo 'FAIL: releaser did not start'; exit 1; }
          echo "settlement releaser started pid=$(cat "$RUNNER_TEMP/releaser.pid")"
      - name: Launch the Phase 6C rater in the background
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          nohup bash "$RUNNER_TEMP/rater.sh" \
            "$(cat "$RUNNER_TEMP/daemon.pub")" \
            "$(cat "$RUNNER_TEMP/maker.pub")" \
            "$(cat "$RUNNER_TEMP/third.pub")" \
            "$(cat "$RUNNER_TEMP/order_id.txt")" \
            > "$RUNNER_TEMP/rater.out" 2>&1 &
          echo $! > "$RUNNER_TEMP/rater.pid"
          for i in $(seq 1 30); do
            [ -f "$RUNNER_TEMP/rater.status" ] && break
            sleep 1
          done
          test -f "$RUNNER_TEMP/rater.status" || { echo 'FAIL: rater did not start'; exit 1; }
          echo "rater started pid=$(cat "$RUNNER_TEMP/rater.pid")"
      - name: Write the Gate 6C emulator script
        run: |
          set +x
          umask 077
          cat > "$RUNNER_TEMP/gate6c.sh" <<'GATE6C'
          set -euo pipefail
          adb wait-for-device
          # The app requests POST_NOTIFICATIONS during bootstrap and awaits the
          # answer, so an un-answered system dialog would hang startup.
          # Installing the debug APK first and granting the permission makes the
          # status `granted`; `flutter test` reinstalls with `adb install -r`,
          # which preserves the grant.
          adb install -r -t mobile/build/app/outputs/flutter-apk/app-debug.apk
          adb shell pm grant com.konprostart.satonero android.permission.POST_NOTIFICATIONS
          adb shell dumpsys package com.konprostart.satonero | grep 'POST_NOTIFICATIONS' | grep 'granted=true' \
            || { echo 'FAIL: notification permission is not granted; the app would block on the dialog'; exit 1; }
          DAEMON_PUB=$(cat "$RUNNER_TEMP/daemon.pub")
          ORDER=$(cat "$RUNNER_TEMP/order_id.txt")
          INVOICE=$(cat "$RUNNER_TEMP/taker_invoice.txt")
          cd mobile
          flutter test integration_test/regtest_mobile_daemon_test.dart \
            -d emulator-5554 \
            --dart-define=REGTEST_DAEMON_PUBKEY="$DAEMON_PUB" \
            --dart-define=REGTEST_ORDER_ID="$ORDER" \
            --dart-define=REGTEST_BUYER_INVOICE="$INVOICE" \
            --dart-define=REGTEST_RELAY_URL=ws://10.0.2.2:8080 \
            --dart-define=REGTEST_REPUTATION_ORDER_AMOUNT=1234 \
            2>&1 | tee "$RUNNER_TEMP/flutter_integration.out"
          test "${PIPESTATUS[0]}" = 0
          GATE6C
          chmod 700 "$RUNNER_TEMP/gate6c.sh"
          test -s "$RUNNER_TEMP/gate6c.sh"
          bash -n "$RUNNER_TEMP/gate6c.sh"
      - name: Run the mobile integration test on an Android emulator (Gate 6C)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # reactivecircus/android-emulator-runner splits `script:` into
          # individual lines, runs each with /usr/bin/sh (dash) and drops the
          # `#` comment lines. dash has no `set -o pipefail` and no PIPESTATUS,
          # and variables set on one line do not survive to the next. So the
          # real body lives in gate6c.sh (written above) and is run with bash.
          script: |
            bash "$RUNNER_TEMP/gate6c.sh"
      - name: Collect payer, releaser and rater results
        if: always()
        working-directory: mostro-regtest
        run: |
          set +x
          set -uo pipefail
          if [ -f "$RUNNER_TEMP/payer.pid" ]; then
            pid=$(cat "$RUNNER_TEMP/payer.pid")
            for i in $(seq 1 300); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 2
            done
          fi
          if [ -f "$RUNNER_TEMP/releaser.pid" ]; then
            rpid=$(cat "$RUNNER_TEMP/releaser.pid")
            for i in $(seq 1 300); do
              kill -0 "$rpid" 2>/dev/null || break
              sleep 2
            done
          fi
          if [ -f "$RUNNER_TEMP/rater.pid" ]; then
            tpid=$(cat "$RUNNER_TEMP/rater.pid")
            for i in $(seq 1 600); do
              kill -0 "$tpid" 2>/dev/null || break
              sleep 2
            done
          fi
          echo "--- payer.status"
          cat "$RUNNER_TEMP/payer.status" 2>/dev/null || echo missing
          echo "--- payer.out (tail)"
          tail -40 "$RUNNER_TEMP/payer.out" 2>/dev/null || true
          echo "--- findhold.out"
          cat "$RUNNER_TEMP/findhold.out" 2>/dev/null || true
          echo "--- payer_state"
          cat "$RUNNER_TEMP/payer_state" 2>/dev/null || echo missing
          echo "--- releaser.status"
          cat "$RUNNER_TEMP/releaser.status" 2>/dev/null || echo missing
          echo "--- releaser.out (tail)"
          tail -40 "$RUNNER_TEMP/releaser.out" 2>/dev/null || true
          echo "--- rater.status"
          cat "$RUNNER_TEMP/rater.status" 2>/dev/null || echo missing
          echo "--- rater_state"
          cat "$RUNNER_TEMP/rater_state" 2>/dev/null || echo missing
          echo "--- rater.log (tail)"
          tail -60 "$RUNNER_TEMP/rater.log" 2>/dev/null || true
          echo "--- integration test markers"
          grep -a '^REGTEST_' "$RUNNER_TEMP/flutter_integration.out" 2>/dev/null || echo "no markers"
      # ---------------------------------------------------------------------
      # DIAGNOSTIC ONLY. These two steps exist to explain the relay visibility
      # contradiction observed in run 43205148657: the app's own kind-38383
      # subscription was served the maker order, while every `nak` query for
      # that author returned zero events (including the plain
      # `-k 38383 -a <daemon> --limit 50` shape used by gate assertion 2).
      #
      # They are read-only: only REQ frames and sqlite reads. They do not
      # change, weaken or replace any gate assertion, and the assertion step
      # still runs afterwards against the same live state.
      # ---------------------------------------------------------------------
      - name: Relay visibility control matrix (diagnostic only)
        if: always()
        working-directory: mostro-regtest
        run: |
          set +x
          set -uo pipefail
          umask 077
          M="$RUNNER_TEMP/relay_matrix"
          mkdir -p "$M"; chmod 700 "$M"
          D=$(cat "$RUNNER_TEMP/daemon.pub")
          ORDER=$(cat "$RUNNER_TEMP/order_id.txt" 2>/dev/null || true)
          APP_SINCE=$(cat "$RUNNER_TEMP/phase6c_tappstart" 2>/dev/null || echo 0)
          LOOKBACK=$((APP_SINCE - 172800))
          # Host-side nak: extract the SAME pinned binary out of the relay image
          # so the host path needs no network download and no version drift.
          HOST_NAK="$RUNNER_TEMP/nak-host"
          docker run --rm --entrypoint cat mostro-regtest-nostr_relay /usr/local/bin/nak \
            > "$HOST_NAK" 2>/dev/null || true
          if [ -s "$HOST_NAK" ]; then
            chmod 700 "$HOST_NAK"
            echo "host_nak=extracted-from-relay-image"
          else
            HOST_NAK=""
            echo "host_nak=UNAVAILABLE"
          fi
          cid=$(docker compose ps -q nostr_relay 2>/dev/null || true)
          echo "relay_container_id=$cid"
          if [ -n "$cid" ]; then
            docker inspect -f 'relay_state={{.State.Status}} relay_started_at={{.State.StartedAt}} relay_restarts={{.RestartCount}}' "$cid" || true
          fi
          echo "matrix_started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "host_epoch=$(date -u +%s)"
          echo "relay_container_epoch=$(docker compose exec -T nostr_relay date -u +%s 2>/dev/null || echo unavailable)"
          echo "daemon_pubkey=$D"
          echo "order=$ORDER app_since=$APP_SINCE lookback=$LOOKBACK"
          : > "$M/summary.log"
          : > "$M/raw.log"
          q() {
            label=$1; where=$2; shift 2
            out="$M/$label.json"; err="$M/$label.err"
            : > "$out"
            if [ "$where" = host ]; then
              if [ -z "$HOST_NAK" ]; then
                echo "MATRIX $where/$label SKIPPED no-host-nak" | tee -a "$M/summary.log"
                return 0
              fi
              timeout 60 "$HOST_NAK" req "$@" ws://localhost:8080 < /dev/null > "$out" 2> "$err"
            elif [ "$where" = container-sh ]; then
              quoted=$(printf '%q ' "$@")
              timeout 60 docker compose exec -T nostr_relay sh -c "nak req $quoted ws://localhost:8080" \
                < /dev/null > "$out" 2> "$err"
            else
              timeout 60 docker compose exec -T nostr_relay nak req "$@" ws://localhost:8080 < /dev/null > "$out" 2> "$err"
            fi
            rc=$?
            n=$(jq -sc 'length' "$out" 2>/dev/null || echo ERR)
            ids=$(jq -sr '[.[]? | "\(.id[0:12])/k\(.kind)/s=\(([.tags[]? | select(.[0]=="s") | .[1]][0]) // "-")"] | join(",")' "$out" 2>/dev/null || true)
            echo "MATRIX $where/$label rc=$rc events=$n ids=[$ids] args=$*" >> "$M/summary.log"
            {
              echo "===== $where/$label :: nak req $* :: ws://localhost:8080"
              cat "$err" 2>/dev/null || true
              cat "$out" 2>/dev/null || true
              echo
            } >> "$M/raw.log"
          }
          # The exact failing shape from gate assertion 2, then one variable at
          # a time: since, until=0 floor, the known-good #d shape, no author,
          # no limit, and two non-38383 controls.
          q c_author_limit         container -k 38383 -a "$D" --limit 50
          q c_author_since_limit   container -k 38383 -a "$D" -s "$LOOKBACK" --limit 50
          q c_author_since0_limit  container -k 38383 -a "$D" -s 0 --limit 50
          q c_author_d_limit       container -k 38383 -a "$D" -t "d=$ORDER" --limit 5
          q c_kind_limit           container -k 38383 --limit 50
          q c_author_only          container -k 38383 -a "$D"
          q c_author_since_only    container -k 38383 -a "$D" -s "$LOOKBACK"
          q c_app_filter           container -k 38383 -k 38385 -a "$D" -s "$LOOKBACK"
          q c_info_only            container -k 38385 -a "$D"
          q c_info_limit           container -k 38385 -a "$D" --limit 5
          q c_dm_limit             container -k 14 -a "$D" --limit 50
          # Same filters again through the two axes that could distinguish the
          # paths: the shell wrapper, and nak's client-side --jq option.
          q c_author_limit_jq      container -k 38383 -a "$D" --limit 50 --jq .id --jq-raw
          q c_dm_limit_jq          container -k 14 -a "$D" --limit 50 --jq .id --jq-raw
          q s_author_limit         container-sh -k 38383 -a "$D" --limit 50
          q s_author_limit_jq      container-sh -k 38383 -a "$D" --limit 50 --jq .id --jq-raw
          q s_dm_limit             container-sh -k 14 -a "$D" --limit 50
          # Same queries again over the published host port, from the runner.
          q h_author_limit         host      -k 38383 -a "$D" --limit 50
          q h_author_only          host      -k 38383 -a "$D"
          q h_author_since_only    host      -k 38383 -a "$D" -s "$LOOKBACK"
          q h_app_filter           host      -k 38383 -k 38385 -a "$D" -s "$LOOKBACK"
          echo "--- relay read helper path log"
          cat "$RUNNER_TEMP/relay_req_paths.log" 2>/dev/null || true
          echo "--- matrix summary"
          cat "$M/summary.log"
      - name: Relay database inspection (diagnostic only)
        if: always()
        working-directory: mostro-regtest
        run: |
          set +x
          set -uo pipefail
          umask 077
          DB="$RUNNER_TEMP/relaydb"
          mkdir -p "$DB"; chmod 700 "$DB"
          cid=$(docker compose ps -q nostr_relay 2>/dev/null || true)
          if [ -z "$cid" ]; then
            echo "relay container missing; database cannot be inspected" > "$DB/analysis.txt"
            exit 0
          fi
          docker compose exec -T nostr_relay sh -c 'ls -la /home/dev/.nostr_relay/db' \
            > "$DB/db_listing.txt" 2>&1 || true
          for f in nostr.db nostr.db-wal nostr.db-shm; do
            if docker cp "$cid:/home/dev/.nostr_relay/db/$f" "$DB/$f" 2>/dev/null; then
              echo "copied $f"
            else
              echo "absent $f"
            fi
          done
          python3 - "$DB" "$(cat "$RUNNER_TEMP/daemon.pub")" \
            "$(cat "$RUNNER_TEMP/order_id.txt" 2>/dev/null || true)" \
            "14f938cef0b02c46ab79faae0a2b560260dd34bcfde448d43ada642a887f2b29" \
            > "$DB/py.out" 2>&1 <<'PY'
          import os
          import sqlite3
          import sys

          d, daemon, order, pending_id = sys.argv[1:5]
          db = os.path.join(d, "nostr.db")
          out = os.path.join(d, "analysis.txt")
          lines = []

          def p(*parts):
              lines.append(" ".join(str(x) for x in parts))

          if not os.path.exists(db):
              p("nostr.db was not copied; nothing to inspect")
              open(out, "w", encoding="utf-8").write("\n".join(lines) + "\n")
              raise SystemExit(0)

          p("db_bytes=%d wal=%s shm=%s" % (
              os.path.getsize(db), os.path.exists(db + "-wal"), os.path.exists(db + "-shm")))
          con = sqlite3.connect(db)  # writable copy: lets sqlite replay the copied -wal
          cur = con.cursor()

          p("== event counts by kind")
          for kind, n in cur.execute(
                  "select kind, count(*) from event group by kind order by 2 desc, 1"):
              p("  kind=%s count=%s" % (kind, n))
          p("event_total=%s" % cur.execute("select count(*) from event").fetchone()[0])
          p("hidden_rows=%s" % cur.execute("select count(*) from event where hidden=1").fetchone()[0])

          p("== author column shape")
          p("  distinct_length_author=%s" % [r[0] for r in cur.execute(
              "select distinct length(author) from event")])
          p("  daemon_pubkey_hex=%s" % daemon)
          p("  rows_by_daemon_blob=%s" % cur.execute(
              "select count(*) from event where author=?", (bytes.fromhex(daemon),)).fetchone()[0])
          p("  rows_by_daemon_hex=%s" % cur.execute(
              "select count(*) from event where hex(author)=?", (daemon,)).fetchone()[0])

          p("== indexes on event")
          p("  " + ", ".join(r[1] for r in cur.execute("pragma index_list(event)")))

          p("== every kind-38383 row")
          rows = list(cur.execute(
              "select id, hex(event_hash), hex(author), created_at, expires_at, hidden, first_seen "
              "from event where kind=38383"))
          if not rows:
              p("  (none)")
          for row in rows:
              (rid, ehash, author, created, exp, hidden, first_seen) = row
              dvals = [r[0] for r in cur.execute(
                  "select value from tag where event_id=? and name='d'", (rid,))]
              svals = [r[0] for r in cur.execute(
                  "select value from tag where event_id=? and name='s'", (rid,))]
              p("  38383 rowid=%s id=%s author=%s created_at=%s expires_at=%s hidden=%s "
                "first_seen=%s d=%s s=%s" % (
                    rid, ehash, author, created, exp, hidden, first_seen, dvals, svals))

          p("== tag rows with d=%s" % order)
          tag_rows = list(cur.execute(
              "select event_id, kind, created_at from tag where name='d' and value=?",
              (order,)))
          if not tag_rows:
              p("  (none)")
          for (ev, kind, created) in tag_rows:
              p("  tag d row event_id=%s kind=%s tag_created_at=%s" % (ev, kind, created))
              ev_row = cur.execute(
                  "select hex(event_hash), kind, created_at, expires_at, hidden "
                  "from event where id=?", (ev,)).fetchone()
              p("    -> event %s" % (ev_row,))

          p("== known pending order event id from the daemon log: %s" % pending_id)
          hit = cur.execute(
              "select hex(event_hash), kind, created_at, expires_at, hidden "
              "from event where hex(event_hash)=?", (pending_id,)).fetchone()
          p("  %s" % ("present: %s" % (hit,) if hit else "NOT PRESENT in relay db"))

          p("== kind-14 / kind-0 / kind-10002 counts for the daemon")
          for kind in (0, 14, 10002, 38385):
              n = cur.execute(
                  "select count(*) from event where kind=? and author=?",
                  (kind, bytes.fromhex(daemon))).fetchone()[0]
              p("  kind=%s daemon_rows=%s" % (kind, n))

          con.close()
          open(out, "w", encoding="utf-8").write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
          if [ ! -f "$DB/analysis.txt" ]; then
            {
              echo "python relay db analysis failed; raw output below"
              cat "$DB/py.out" 2>/dev/null || true
            } > "$DB/analysis.txt"
          fi
          cat "$DB/analysis.txt" 2>/dev/null || true
      - name: Phase 6C gate assertions
        id: phase6c_gate
        if: always()
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          umask 077
          ln_alice() { docker compose exec -T --user lnd alice_lnd lncli --network=regtest --rpcserver=localhost:10001 "$@"; }
          ln_bob() { docker compose exec -T --user lnd bob_lnd lncli --network=regtest --rpcserver=localhost:10001 "$@"; }
          ln_mostro() { docker compose exec -T --user lnd mostro_lnd lncli --network=regtest --rpcserver=localhost:10001 "$@"; }
          ORDER=$(cat "$RUNNER_TEMP/order_id.txt")
          DAEMON_PUB=$(cat "$RUNNER_TEMP/daemon.pub")
          MAKER_PUB=$(cat "$RUNNER_TEMP/maker.pub")
          THIRD_PUB=$(cat "$RUNNER_TEMP/third.pub")
          TAPPSTART=$(cat "$RUNNER_TEMP/phase6c_tappstart" 2>/dev/null || echo 0)
          source "$RUNNER_TEMP/phase6c_vars"

          # (1) The mobile app reported every gate.
          grep -aq "^REGTEST_GATE1_ORDER_VISIBLE order=$ORDER" "$RUNNER_TEMP/flutter_integration.out" \
            || { echo 'FAIL: app did not report the maker order in the order book'; exit 1; }
          grep -aq "^REGTEST_GATE2_ACTIVE order=$ORDER role=buyer status=active" "$RUNNER_TEMP/flutter_integration.out" \
            || { echo 'FAIL: app did not reach active as the buyer'; exit 1; }
          grep -aq "^REGTEST_GATE3_FIAT_SENT_TAPPED order=$ORDER" "$RUNNER_TEMP/flutter_integration.out" \
            || { echo 'FAIL: app did not mark the fiat as sent'; exit 1; }
          grep -aq "^REGTEST_GATE3_SUCCESS order=$ORDER role=buyer status=success" "$RUNNER_TEMP/flutter_integration.out" \
            || { echo 'FAIL: app did not reach success after settlement'; exit 1; }
          grep -aq "^REGTEST_GATE4_RATE_OPENED order=$ORDER" "$RUNNER_TEMP/flutter_integration.out" \
            || { echo 'FAIL: app did not open the counterpart rating screen'; exit 1; }
          grep -aq "^REGTEST_GATE4_RATING_SUBMITTED order=$ORDER rating=5" "$RUNNER_TEMP/flutter_integration.out" \
            || { echo 'FAIL: app did not submit a 5/5 rating'; exit 1; }
          grep -aq "^REGTEST_GATE4_RATE_RECEIVED order=$ORDER action=rateReceived status=success" "$RUNNER_TEMP/flutter_integration.out" \
            || { echo 'FAIL: app did not receive the daemon rate-received acknowledgement'; exit 1; }
          grep -aqE "^REGTEST_GATE4_REPUTATION order=[0-9a-f-]+ amount=1234 total_reviews=1 total_rating=2.5$" \
            "$RUNNER_TEMP/flutter_integration.out" \
            || { echo 'FAIL: app did not render the updated seller reputation (1 review / 2.5)'; exit 1; }
          echo 'gate 6C-0 ok: maker order rendered in the app order book'
          echo 'gate 6C (pre-settlement) ok: app reported role=buyer status=active'
          echo 'gate 6C (settlement) ok: app reported fiat-sent and final status=success'
          echo 'gate 6C (rating) ok: app rated the seller, received rate-received and rendered the reputation'

          # (2) The daemon published the success revision of this order.
          #
          # `FiatSent` and `SettledHoldInvoice` are internal statuses:
          # create_status_tags() (src/nip33.rs) returns create_event=false for
          # them, while `Success` is published (s=success). A kind-38383 order
          # event is parameterized replaceable, so the success revision
          # supersedes the in-progress one and the end-of-run query below is the
          # authoritative check. The query asks for EVERY kind-38383 event of the
          # daemon (no `#d` tag filter) and selects d=<order> + s=success
          # locally, through the relay read helper that also records which
          # client path actually served the events.
          : > "$RUNNER_TEMP/success38383.json"
          capture_order_events() {
            : > "$RUNNER_TEMP/success_probe.json"
            bash "$RUNNER_TEMP/relayreq.sh" "$RUNNER_TEMP/success_probe.json" \
              -k 38383 -a "$DAEMON_PUB" --limit 50 >> "$RUNNER_TEMP/nak38383.err" 2>&1 || true
            jq -sc '.' "$RUNNER_TEMP/success_probe.json" > "$RUNNER_TEMP/daemon38383_all.json" 2>/dev/null \
              || echo '[]' > "$RUNNER_TEMP/daemon38383_all.json"
          }
          for i in $(seq 1 30); do
            capture_order_events
            jq -c --arg d "$ORDER" \
              'map(select((.tags | any(.[0]=="d" and .[1]==$d)) and (.tags | any(.[0]=="s" and .[1]=="success")))) | .[0] // empty' \
              "$RUNNER_TEMP/daemon38383_all.json" > "$RUNNER_TEMP/success38383.json" 2>/dev/null || true
            [ -s "$RUNNER_TEMP/success38383.json" ] && break
            sleep 5
          done
          # Evidence of what the relay actually held, whatever the verdict.
          echo "daemon kind-38383 event count on relay: $(jq 'length' "$RUNNER_TEMP/daemon38383_all.json" 2>/dev/null || echo 0)"
          jq -r '.[] | " 38383 id=\(.id) created_at=\(.created_at) d=\((.tags|map(select(.[0]=="d")|.[1])|first)//"-") s=\((.tags|map(select(.[0]=="s")|.[1])|first)//"-")"' \
            "$RUNNER_TEMP/daemon38383_all.json" 2>/dev/null || true
          echo "relay read path log:"; cat "$RUNNER_TEMP/relay_req_paths.log" 2>/dev/null || true
          [ -s "$RUNNER_TEMP/success38383.json" ] \
            || { echo 'FAIL: daemon never published status success for the order'; exit 1; }
          jq -e --arg d "$ORDER" --arg daemon "$DAEMON_PUB" \
            '.kind == 38383 and .pubkey == $daemon and (.tags | any(.[0]=="d" and .[1]==$d)) and (.tags | any(.[0]=="s" and .[1]=="success"))' \
            "$RUNNER_TEMP/success38383.json" >/dev/null 2>&1 \
            || { echo 'FAIL: captured kind-38383 event is not this order success revision'; exit 1; }
          docker compose exec -T nostr_relay nak verify < "$RUNNER_TEMP/success38383.json" >/dev/null 2>&1 \
            || { echo 'FAIL: success order event signature'; exit 1; }
          echo 'daemon published a signed kind-38383 success event for the order'

          # (3) The app's own protocol messages are on the relay. Phase 6C adds
          # the buyer's fiat-sent and the rate-user on top of take-sell and
          # add-invoice, so at least four are expected; every one must address
          # the daemon and carry a valid signature. The maker and the
          # unauthorized third key also send kind-14 traffic, so both are
          # excluded by author.
          bash "$RUNNER_TEMP/relayreq.sh" "$RUNNER_TEMP/all14.json" \
            -k 14 -t p="$DAEMON_PUB" --limit 200 || true
          jq -sc --arg daemon "$DAEMON_PUB" --arg maker "$MAKER_PUB" --arg third "$THIRD_PUB" --argjson since "$TAPPSTART" \
            '[.[]? | select(.pubkey != $daemon and .pubkey != $maker and .pubkey != $third and .created_at >= $since)]' \
            "$RUNNER_TEMP/all14.json" > "$RUNNER_TEMP/app_msgs.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/app_msgs.json"
          APP_MSGS=$(jq -r 'length' "$RUNNER_TEMP/app_msgs.json" 2>/dev/null || echo 0)
          echo "app_to_daemon_kind14_count=$APP_MSGS"
          [ "${APP_MSGS:-0}" -ge 4 ] \
            || { echo "FAIL: expected the app's take-sell, add-invoice, fiat-sent and rate-user kind-14 events, found $APP_MSGS"; exit 1; }
          ADDRESSED=$(jq -r --arg daemon "$DAEMON_PUB" \
            '[.[] | select(([.tags[]? | select(.[0]=="p") | .[1]] | index($daemon)) != null)] | length' \
            "$RUNNER_TEMP/app_msgs.json" 2>/dev/null || echo 0)
          [ "$ADDRESSED" = "$APP_MSGS" ] \
            || { echo "FAIL: $((APP_MSGS - ADDRESSED)) app message(s) not addressed to the daemon"; exit 1; }
          bad_sig=0
          while IFS= read -r line; do
            printf '%s\n' "$line" | docker compose exec -T nostr_relay nak verify >/dev/null 2>&1 || bad_sig=$((bad_sig+1))
          done < <(jq -c '.[]' "$RUNNER_TEMP/app_msgs.json")
          [ "$bad_sig" = 0 ] \
            || { echo "FAIL: $bad_sig app kind-14 event(s) failed signature verification"; exit 1; }
          echo "app kind-14 events verified: count=$APP_MSGS all addressed to the daemon, all signatures valid"

          # (4) The seller hold invoice settled and the seller's payment did too.
          [ -s "$RUNNER_TEMP/hold_hash.txt" ] \
            || { echo 'FAIL: the hold-invoice payer never recorded the hold payment hash'; exit 1; }
          HOLD_HASH=$(cat "$RUNNER_TEMP/hold_hash.txt")
          HOLD_FINAL=$(ln_mostro lookupinvoice "$HOLD_HASH" | jq -r .state)
          [ "$HOLD_FINAL" = SETTLED ] || { echo "FAIL: hold invoice state=$HOLD_FINAL, expected SETTLED"; exit 1; }
          SELLER_PAY=$(ln_alice listpayments --include_incomplete)
          SELLER_TOTAL=$(printf '%s' "$SELLER_PAY" | jq '.payments|length')
          SELLER_SUCCEEDED=$(printf '%s' "$SELLER_PAY" | jq '[.payments[]?|select(.status=="SUCCEEDED")]|length')
          SELLER_HASHES=$(printf '%s' "$SELLER_PAY" | jq --arg h "$HOLD_HASH" '[.payments[]?|select(.payment_hash==$h)]|length')
          [ "$SELLER_TOTAL" = 1 ] || { echo "FAIL: seller payments total=$SELLER_TOTAL"; exit 1; }
          [ "$SELLER_SUCCEEDED" = 1 ] || { echo "FAIL: seller SUCCEEDED payments=$SELLER_SUCCEEDED"; exit 1; }
          [ "$SELLER_HASHES" = 1 ] || { echo "FAIL: seller payment for the hold hash not found uniquely"; exit 1; }
          echo "hold invoice SETTLED and the single seller payment SUCCEEDED (hash=$HOLD_HASH)"

          # (5) The buyer payout invoice settled and the daemon paid it exactly
          # once, with nothing left in flight or failed.
          PAYOUT_HASH=$(ln_bob decodepayreq "$(cat "$RUNNER_TEMP/taker_invoice.txt")" | jq -r .payment_hash)
          PAYOUT_STATE=$(ln_bob lookupinvoice "$PAYOUT_HASH" | jq -r .state)
          [ "$PAYOUT_STATE" = SETTLED ] || { echo "FAIL: buyer payout invoice state=$PAYOUT_STATE, expected SETTLED"; exit 1; }
          PAYOUT_PAID_SAT=$(ln_bob lookupinvoice "$PAYOUT_HASH" | jq -r '.amt_paid_sat // 0')
          DAEMON_PAY=$(ln_mostro listpayments --include_incomplete)
          DAEMON_TOTAL=$(printf '%s' "$DAEMON_PAY" | jq '.payments|length')
          DAEMON_SUCCEEDED=$(printf '%s' "$DAEMON_PAY" | jq '[.payments[]?|select(.status=="SUCCEEDED")]|length')
          DAEMON_INFLIGHT=$(printf '%s' "$DAEMON_PAY" | jq '[.payments[]?|select(.status=="IN_FLIGHT")]|length')
          DAEMON_FAILED=$(printf '%s' "$DAEMON_PAY" | jq '[.payments[]?|select(.status=="FAILED")]|length')
          DAEMON_HASHES=$(printf '%s' "$DAEMON_PAY" | jq --arg h "$PAYOUT_HASH" '[.payments[]?|select(.payment_hash==$h)]|length')
          [ "$DAEMON_SUCCEEDED" = 1 ] || { echo "FAIL: daemon SUCCEEDED payouts=$DAEMON_SUCCEEDED"; exit 1; }
          [ "$DAEMON_TOTAL" = 1 ] || { echo "FAIL: daemon payment rows total=$DAEMON_TOTAL"; exit 1; }
          [ "$DAEMON_INFLIGHT" = 0 ] || { echo "FAIL: daemon IN_FLIGHT payouts=$DAEMON_INFLIGHT"; exit 1; }
          [ "$DAEMON_FAILED" = 0 ] || { echo "FAIL: daemon FAILED payouts=$DAEMON_FAILED"; exit 1; }
          [ "$DAEMON_HASHES" = 1 ] || { echo "FAIL: daemon payout for the buyer invoice not found uniquely"; exit 1; }
          [ "${PAYOUT_PAID_SAT:-0}" -ge 1000 ] || { echo "FAIL: buyer payout paid ${PAYOUT_PAID_SAT} sat < 1000"; exit 1; }
          echo "buyer invoice SETTLED, exactly one daemon payout SUCCEEDED (hash=$PAYOUT_HASH, paid=$PAYOUT_PAID_SAT sat), zero IN_FLIGHT, zero FAILED"

          # (6) Channel bookkeeping and no leftover payment state.
          DAEMON_CHANNELS=$(ln_mostro listchannels | jq '.channels|length')
          SELLER_CHANNELS=$(ln_alice listchannels | jq '.channels|length')
          BUYER_CHANNELS=$(ln_bob listchannels | jq '.channels|length')
          [ "$DAEMON_CHANNELS" = 2 ] || { echo "FAIL: daemon channels=$DAEMON_CHANNELS, expected 2"; exit 1; }
          [ "$SELLER_CHANNELS" = 1 ] || { echo "FAIL: seller channels=$SELLER_CHANNELS, expected 1"; exit 1; }
          [ "$BUYER_CHANNELS" = 1 ] || { echo "FAIL: buyer channels=$BUYER_CHANNELS, expected 1"; exit 1; }
          [ "$(ln_bob listpayments --include_incomplete | jq '.payments|length')" = 0 ] \
            || { echo 'FAIL: buyer made a payment'; exit 1; }
          echo "channels unchanged in shape: daemon=$DAEMON_CHANNELS seller=$SELLER_CHANNELS buyer=$BUYER_CHANNELS; no leftover payments"

          # (7) Phase 6C: the rating and reputation lifecycle.
          [ -s "$RUNNER_TEMP/rater_state" ] \
            || { echo 'FAIL: the rater produced no state'; exit 1; }
          grep -q '^FINAL=ok$' "$RUNNER_TEMP/rater_state" \
            || { echo 'FAIL: the rater did not finish cleanly'; cat "$RUNNER_TEMP/rater_state"; exit 1; }
          APP_RATING_COUNT=$(grep '^APP_RATING_38384_COUNT=' "$RUNNER_TEMP/rater_state" | cut -d= -f2)
          [ "$APP_RATING_COUNT" = 1 ] || { echo "FAIL: app rating event count=$APP_RATING_COUNT"; exit 1; }
          APP_AUTHORS=$(jq -r '[.[].pubkey] | unique | length' "$RUNNER_TEMP/app_msgs.json" 2>/dev/null || echo 0)
          [ "$APP_AUTHORS" = 1 ] || { echo "FAIL: the app used $APP_AUTHORS distinct trade pubkeys"; exit 1; }
          APP_TRADE_PUB=$(jq -r '.[0].pubkey // empty' "$RUNNER_TEMP/app_msgs.json")
          [ -n "$APP_TRADE_PUB" ] || { echo 'FAIL: could not read the app trade pubkey'; exit 1; }
          echo "app trade pubkey (from its kind-14 events): $APP_TRADE_PUB"

          # Independent relay read of every kind-38384 event.
          bash "$RUNNER_TEMP/relayreq.sh" "$RUNNER_TEMP/ratings_38384.json" \
            -k 38384 -a "$DAEMON_PUB" --limit 50 || true
          jq -sc '.' "$RUNNER_TEMP/ratings_38384.json" > "$RUNNER_TEMP/ratings_all.json" 2>/dev/null \
            || echo '[]' > "$RUNNER_TEMP/ratings_all.json"
          RATING_TOTAL=$(jq 'length' "$RUNNER_TEMP/ratings_all.json")
          echo "kind-38384 event count on relay: $RATING_TOTAL"
          jq -r '.[] | " 38384 id=\(.id) d=\((.tags|map(select(.[0]=="d")|.[1])|first)//"-") reviews=\((.tags|map(select(.[0]=="total_reviews")|.[1])|first)//"-") rating=\((.tags|map(select(.[0]=="total_rating")|.[1])|first)//"-") last=\((.tags|map(select(.[0]=="last_rating")|.[1])|first)//"-")"' \
            "$RUNNER_TEMP/ratings_all.json" 2>/dev/null || true
          [ "$RATING_TOTAL" = 2 ] || { echo "FAIL: expected exactly 2 kind-38384 events (app + seller), got $RATING_TOTAL"; exit 1; }

          # The app's rating: the daemon keys the event by the RATED user's trade
          # pubkey (protocol/src/user_rating.md), so d is the seller's trade key
          # while the tags carry the seller's aggregate. mostro-core weights the
          # first review 1/2: 5 -> 2.5.
          jq -c --arg d "$MAKER_PUB" \
            '[.[] | select(.tags | any(.[0]=="d" and .[1]==$d))][0] // empty' \
            "$RUNNER_TEMP/ratings_all.json" > "$RUNNER_TEMP/app_rating_38384.json"
          [ -s "$RUNNER_TEMP/app_rating_38384.json" ] \
            || { echo "FAIL: no kind-38384 keyed by the rated seller trade pubkey $MAKER_PUB"; exit 1; }
          jq -e --arg daemon "$DAEMON_PUB" --arg d "$MAKER_PUB" '
            .kind == 38384
            and .pubkey == $daemon
            and (.tags | any(.[0]=="d" and .[1]==$d))
            and (.tags | any(.[0]=="total_reviews" and .[1]=="1"))
            and (.tags | any(.[0]=="total_rating" and ((.[1]|tonumber) == 2.5)))
            and (.tags | any(.[0]=="last_rating" and .[1]=="5"))
            and (.tags | any(.[0]=="min_rate" and .[1]=="5"))
            and (.tags | any(.[0]=="max_rate" and .[1]=="5"))
          ' "$RUNNER_TEMP/app_rating_38384.json" >/dev/null 2>&1 \
            || { echo 'FAIL: the app rating kind-38384 event has the wrong author/d/aggregate'; exit 1; }
          docker compose exec -T nostr_relay nak verify < "$RUNNER_TEMP/app_rating_38384.json" >/dev/null 2>&1 \
            || { echo 'FAIL: app rating kind-38384 signature'; exit 1; }
          echo "app rating accepted: signed kind-38384 d=<rated seller trade pubkey> 1 review / 2.5 (last 5, min 5, max 5)"

          # The seller's rating of the buyer: keyed by the RATED buyer's trade
          # pubkey, and the aggregate of the buyer's identity (first review
          # 4 -> 2.0).
          jq -c --arg d "$APP_TRADE_PUB" \
            '[.[] | select(.tags | any(.[0]=="d" and .[1]==$d))][0] // empty' \
            "$RUNNER_TEMP/ratings_all.json" > "$RUNNER_TEMP/seller_rating_38384.json"
          [ -s "$RUNNER_TEMP/seller_rating_38384.json" ] \
            || { echo "FAIL: no kind-38384 keyed by the rated buyer trade pubkey $APP_TRADE_PUB"; exit 1; }
          jq -e --arg daemon "$DAEMON_PUB" --arg d "$APP_TRADE_PUB" '
            .kind == 38384
            and .pubkey == $daemon
            and (.tags | any(.[0]=="d" and .[1]==$d))
            and (.tags | any(.[0]=="total_reviews" and .[1]=="1"))
            and (.tags | any(.[0]=="total_rating" and ((.[1]|tonumber) == 2)))
            and (.tags | any(.[0]=="last_rating" and .[1]=="4"))
            and (.tags | any(.[0]=="min_rate" and .[1]=="4"))
            and (.tags | any(.[0]=="max_rate" and .[1]=="4"))
          ' "$RUNNER_TEMP/seller_rating_38384.json" >/dev/null 2>&1 \
            || { echo 'FAIL: the seller rating kind-38384 event has the wrong author/d/aggregate'; exit 1; }
          docker compose exec -T nostr_relay nak verify < "$RUNNER_TEMP/seller_rating_38384.json" >/dev/null 2>&1 \
            || { echo 'FAIL: seller rating kind-38384 signature'; exit 1; }
          echo "seller rating accepted: signed kind-38384 d=<rated buyer trade pubkey> 1 review / 2.0 (last 4, min 4, max 4)"

          # The negative cases the daemon supports.
          grep -q '^INVALID_COUNT_AFTER=1$' "$RUNNER_TEMP/rater_state" \
            || { echo 'FAIL: an invalid rating value created a rating event'; exit 1; }
          grep -q '^INCORRECT_CANTDO=not_found$' "$RUNNER_TEMP/rater_state" \
            || { echo 'FAIL: an unknown order reference was not answered cant-do/not_found'; exit 1; }
          grep -q '^UNAUTHORIZED_COUNT_AFTER=1$' "$RUNNER_TEMP/rater_state" \
            || { echo 'FAIL: a non-participant rating created a rating event'; exit 1; }
          # `grep -q` would close the pipe on the first match and `docker logs`
          # would then die of SIGPIPE, which `pipefail` turns into a failure for
          # the whole pipeline. `grep -c` reads the stream to the end instead.
          INVALID_LOG_HITS=$(docker logs satonero-daemon 2>&1 | grep -a -c 'Invalid rating value' || true)
          [ "${INVALID_LOG_HITS:-0}" -ge 1 ] \
            || { echo 'FAIL: the daemon never logged the invalid rating value rejection'; exit 1; }
          echo "negative cases: invalid value ignored (daemon logged the rejection), unknown order cant-do/not_found, non-participant ignored, duplicate ignored"

          # The fresh pending order the app rendered: the daemon attached the
          # seller's persisted aggregate to it.
          ORDER2=$(grep '^SECOND_ORDER_ID=' "$RUNNER_TEMP/rater_state" | cut -d= -f2)
          [ -n "$ORDER2" ] || { echo 'FAIL: the rater did not publish a reputation order id'; exit 1; }
          bash "$RUNNER_TEMP/relayreq.sh" "$RUNNER_TEMP/order2_probe.json" \
            -k 38383 -a "$DAEMON_PUB" --limit 50 || true
          jq -sc --arg d "$ORDER2" '[.[] | select(.tags | any(.[0]=="d" and .[1]==$d))][0] // empty' \
            "$RUNNER_TEMP/order2_probe.json" > "$RUNNER_TEMP/order2_38383.json" 2>/dev/null || true
          [ -s "$RUNNER_TEMP/order2_38383.json" ] \
            || { echo "FAIL: the reputation order $ORDER2 is missing from the relay"; exit 1; }
          jq -e '.kind == 38383 and (.tags | any(.[0]=="s" and .[1]=="pending")) and (.tags | any(.[0]=="amt" and .[1]=="1234"))' \
            "$RUNNER_TEMP/order2_38383.json" >/dev/null 2>&1 \
            || { echo 'FAIL: the reputation order is not a pending 1234-sat order'; exit 1; }
          RATING_TAG=$(jq -r '[.tags[] | select(.[0]=="rating") | .[1]][0] // "missing"' "$RUNNER_TEMP/order2_38383.json")
          echo "$RATING_TAG" > "$RUNNER_TEMP/order2_rating_tag.txt"
          jq -e '.[1].total_reviews == 1 and .[1].total_rating == 2.5' <<< "$RATING_TAG" >/dev/null 2>&1 \
            || { echo "FAIL: the reputation order rating tag is not 1 review / 2.5: $RATING_TAG"; exit 1; }
          docker compose exec -T nostr_relay nak verify < "$RUNNER_TEMP/order2_38383.json" >/dev/null 2>&1 \
            || { echo 'FAIL: reputation order signature'; exit 1; }
          echo "reputation order published and signed: d=$ORDER2 amt=1234 rating_tag=$RATING_TAG"
          # The app's rendered reputation marker must name the same order the
          # rater published, so the display assertion and the relay assertion
          # describe one object.
          APP_REP_ID=$(grep -aoE '^REGTEST_GATE4_REPUTATION order=[0-9a-f-]+' "$RUNNER_TEMP/flutter_integration.out" \
            | head -1 | sed 's/.*order=//')
          [ "$APP_REP_ID" = "$ORDER2" ] \
            || { echo "FAIL: app rendered reputation order '$APP_REP_ID', rater published '$ORDER2'"; exit 1; }
          echo "app rendered the same reputation order the rater published"

          echo 'gate=pass' >> "$GITHUB_OUTPUT"
      - name: Capture Phase 6C diagnostics (always)
        if: always()
        working-directory: mostro-regtest
        run: |
          set +x
          set -uo pipefail
          umask 077
          D="$RUNNER_TEMP/phase6c_diagnostics"
          mkdir -p "$D"; chmod 700 "$D"
          docker logs --timestamps satonero-daemon > "$RUNNER_TEMP/phase6c_daemon.raw.log" 2>&1 || true
          # Relay-side view of the protocol: whether the kind-38383 revisions
          # were accepted and how the later REQs were answered. `docker logs`
          # needs the real container, not the compose service name (the name
          # `nostr_relay` does not exist as a container and silently produced
          # "No such container" in run 43205148657).
          cid=$(docker compose ps -q nostr_relay 2>/dev/null || true)
          if [ -n "$cid" ]; then
            docker logs --timestamps "$cid" > "$RUNNER_TEMP/phase6c_relay.raw.log" 2>&1 || true
            docker inspect -f 'relay_container={{.Name}} id={{.Id}} state={{.State.Status}} started_at={{.State.StartedAt}} restarts={{.RestartCount}}' "$cid" \
              > "$RUNNER_TEMP/phase6c_relay_identity.txt" 2>&1 || true
          else
            docker compose logs --no-color --timestamps nostr_relay > "$RUNNER_TEMP/phase6c_relay.raw.log" 2>&1 || true
            echo "relay container not found via docker compose ps -q" > "$RUNNER_TEMP/phase6c_relay_identity.txt"
          fi
          docker compose ps -a > "$RUNNER_TEMP/phase6c_compose_ps.txt" 2>&1 || true
          python3 - "$RUNNER_TEMP" "$D" <<'PY'
          import json, os, pathlib, re, sys
          rt = pathlib.Path(sys.argv[1]); out = pathlib.Path(sys.argv[2])
          keep = re.compile(r'(hold[_ -]?invoice|invoice|order|nostr|relay|publish|enqueue|buyer|seller|waiting|payment|lnd|maintenance|error|warn|panic|message|flow|replaceable)', re.I)
          secret = re.compile(r'(-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----.*?-----END [A-Z0-9 ]*PRIVATE KEY-----|lnbcrt1[0-9a-z]+|lnbc1[0-9a-z]+|nsec1[0-9a-z]+|macaroon[^ \t,;"]*|preimage[^ \t,;"]*|payment_request[^ \t,;"]*)', re.I | re.S)
          tokens = ('lnbcrt1', 'lnbc1', 'nsec1', 'macaroon', 'preimage', 'payment_request', '-----begin')
          def sanitize(text):
              return secret.sub('[redacted]', text)
          lines = []
          raw = rt / 'phase6c_daemon.raw.log'
          if raw.exists():
              for line in raw.read_text(errors='replace').splitlines():
                  if keep.search(line[:500]):
                      lines.append(sanitize(line[:500]))
          (out / 'daemon_events.log').write_text(('\n'.join(lines) + '\n') if lines else '')
          relay_raw = rt / 'phase6c_relay.raw.log'
          if relay_raw.exists():
              body = relay_raw.read_text(errors='replace').splitlines()
              relay_lines = [sanitize(l[:500]) for l in body[-20000:]]
              (out / 'relay_events.log').write_text(('\n'.join(relay_lines) + '\n') if relay_lines else '')
              # Everything the relay said about this order and about the two
              # decisions that can hide an event (replaceable pruning, far
              # future-dated rejection, failing subscription queries).
              order_hint = ''
              oid = rt / 'order_id.txt'
              if oid.exists():
                  order_hint = oid.read_text(errors='replace').strip()
              needles = [n for n in (order_hint, 'removed', 'far future',
                                     'Subscription error', 'scraper', 'invalid event',
                                     'duplicate subscription', 'expired') if n]
              matched = []
              for line in body:
                  low = line.lower()
                  if any(n.lower() in low for n in needles):
                      matched.append(sanitize(line[:500]))
              (out / 'relay_events_matches.log').write_text(
                  ('\n'.join(matched[-2000:]) + '\n') if matched else '')
          identity = rt / 'phase6c_relay_identity.txt'
          if identity.exists():
              (out / 'relay_identity.txt').write_text(sanitize(identity.read_text(errors='replace')))
          ps = rt / 'phase6c_compose_ps.txt'
          if ps.exists():
              (out / 'compose_ps.txt').write_text(sanitize(ps.read_text(errors='replace')[-20000:]))
          # Relay visibility diagnostics: the control-query matrix and the
          # read-only sqlite inspection of the relay database.
          for src, dest in (('relay_matrix/summary.log', 'relay_matrix_summary.log'),
                            ('relay_matrix/raw.log', 'relay_matrix_raw.log'),
                            ('relaydb/analysis.txt', 'relay_db_analysis.txt'),
                            ('relaydb/db_listing.txt', 'relay_db_listing.txt')):
              p = rt / src
              if p.exists():
                  (out / dest).write_text(sanitize(p.read_text(errors='replace')[-80000:]))
          # Full daemon kind-38383 view: the end-of-run dump plus every distinct
          # revision the live watcher saw while the trade was running.
          for name, dest in (('daemon38383_all.json', 'order38383_all.json'),
                             ('watcher38383_seen.jsonl', 'order38383_seen.jsonl'),
                             ('watcher38383.json', 'order38383_inprogress.json'),
                             ('watcher38383.log', 'watcher38383.log'),
                             ('watcher38383.err', 'watcher38383.err'),
                             ('nak38383.err', 'nak38383.err')):
              p = rt / name
              if not p.exists():
                  continue
              body = p.read_text(errors='replace')
              if name == 'daemon38383_all.json':
                  # Keep the diagnostics valid JSON: at most 100 events.
                  try:
                      events = json.loads(body) if body.strip() else []
                      body = json.dumps(events[:100], indent=2)
                  except (ValueError, TypeError):
                      body = body[-80000:]
              else:
                  body = body[-80000:]
              (out / dest).write_text(sanitize(body))
          for name in ('payer.out', 'findhold.out', 'payer_state', 'phase6c_vars',
                       'flutter_integration.out', 'relay_req_paths.log',
                       'relayreq_probe.json', 'releaser.out', 'releaser.status',
                       'fiat_sent_ok.plain', 'success38383.json',
                       'rater.out', 'rater.log', 'rater_state', 'rater.status',
                       'ratings_all.json', 'app_rating_38384.json',
                       'seller_rating_38384.json', 'order2_38383.json',
                       'order2_rating_tag.txt'):
              p = rt / name
              if not p.exists():
                  continue
              body = p.read_text(errors='replace')[-80000:]
              if name == 'flutter_integration.out':
                  keep_lines = [l for l in body.splitlines() if l.startswith('REGTEST_') or 'All tests passed' in l or 'Some tests failed' in l]
                  (out / 'integration_markers.log').write_text(sanitize('\n'.join(keep_lines)) + '\n')
              else:
                  (out / name.replace('.', '_')).write_text(sanitize(body))
          total = 0
          for f in sorted(out.iterdir()):
              body = f.read_text(errors='replace')
              hits = sum(body.lower().count(t) for t in tokens)
              if hits:
                  kept = ['[redacted line: secret scan]' if any(t in line.lower() for t in tokens) else line
                          for line in body.splitlines()]
                  f.write_text('\n'.join(kept) + '\n')
                  total += hits
          for f in sorted(out.iterdir()):
              body = f.read_text(errors='replace').lower()
              if any(t in body for t in tokens):
                  raise SystemExit('diagnostics still contain a secret token: ' + f.name)
          print('diagnostics captured: ' + ', '.join(sorted(f.name for f in out.iterdir())))
          print('diagnostic secret scan: redactions=%d' % total)
          PY
          rm -f "$RUNNER_TEMP/phase6c_daemon.raw.log" "$RUNNER_TEMP/phase6c_relay.raw.log" "$RUNNER_TEMP/taker_invoice.txt" \
                "$RUNNER_TEMP/hold_invoice.txt" "$RUNNER_TEMP/maker.hex" "$RUNNER_TEMP/daemon.nsec" \
                "$RUNNER_TEMP/hold_pay_invoice.plain" "$RUNNER_TEMP/settings.toml"
      - name: Upload Phase 6C diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6d-diagnostics
          path: ${{ runner.temp }}/phase6c_diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Cleanup (always)
        id: phase6c_cleanup
        if: always()
        working-directory: mostro-regtest
        run: |
          set +x
          umask 077
          if [ -f "$RUNNER_TEMP/alice_pay.pid" ]; then
            pid=$(cat "$RUNNER_TEMP/alice_pay.pid" 2>/dev/null || true)
            [ -n "$pid" ] && { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          fi
          if [ -f "$RUNNER_TEMP/payer.pid" ]; then
            pid=$(cat "$RUNNER_TEMP/payer.pid" 2>/dev/null || true)
            [ -n "$pid" ] && { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          fi
          if [ -f "$RUNNER_TEMP/watcher38383.pid" ]; then
            pid=$(cat "$RUNNER_TEMP/watcher38383.pid" 2>/dev/null || true)
            [ -n "$pid" ] && { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          fi
          if [ -f "$RUNNER_TEMP/releaser.pid" ]; then
            pid=$(cat "$RUNNER_TEMP/releaser.pid" 2>/dev/null || true)
            [ -n "$pid" ] && { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          fi
          if [ -f "$RUNNER_TEMP/rater.pid" ]; then
            pid=$(cat "$RUNNER_TEMP/rater.pid" 2>/dev/null || true)
            [ -n "$pid" ] && { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          fi
          ln_mostro() { docker compose exec -T --user lnd mostro_lnd lncli --network=regtest --rpcserver=localhost:10001 "$@"; }
          ln_alice() { docker compose exec -T --user lnd alice_lnd lncli --network=regtest --rpcserver=localhost:10001 "$@"; }
          resolution_ok=1
          if [ -f "$RUNNER_TEMP/hold_hash.txt" ]; then
            HOLD_HASH=$(cat "$RUNNER_TEMP/hold_hash.txt")
            state=$(ln_mostro lookupinvoice "$HOLD_HASH" 2>/dev/null | jq -r .state 2>/dev/null || echo error)
            # Phase 6C expects SETTLED: settlement is the point of the run. A
            # non-settled hold (an early failure, or a run that stopped before
            # release) is cancelled exactly as Phase 6A did, so no HTLC is left
            # parked at the CLTV horizon.
            if [ "$state" = ACCEPTED ] || [ "$state" = OPEN ]; then
              ln_mostro cancelinvoice "$HOLD_HASH" >/dev/null 2>&1 || true
              for i in $(seq 1 90); do
                state=$(ln_mostro lookupinvoice "$HOLD_HASH" 2>/dev/null | jq -r .state 2>/dev/null || echo error)
                [ "$state" = CANCELED ] && break
                sleep 2
              done
            fi
            case "$state" in
              SETTLED) echo "hold invoice SETTLED by the Phase 6C settlement (nothing to cancel)" ;;
              CANCELED) echo "hold invoice CANCELED (no settlement happened)" ;;
              *) echo "FAIL: hold invoice state=$state"; resolution_ok=0 ;;
            esac
            pay='{}'
            for i in $(seq 1 90); do
              pay=$(ln_alice listpayments --include_incomplete 2>/dev/null || echo '{}')
              inflight=$(printf '%s' "$pay" | jq --arg h "$HOLD_HASH" '[.payments[]?|select(.payment_hash==$h and .status=="IN_FLIGHT")]|length')
              [ "$inflight" = 0 ] && break
              sleep 2
            done
            [ "$(printf '%s' "$pay" | jq --arg h "$HOLD_HASH" '[.payments[]?|select(.payment_hash==$h and .status=="IN_FLIGHT")]|length')" = 0 ] \
              || { echo 'FAIL: seller payment unresolved'; resolution_ok=0; }
          else
            resolution_ok=0
          fi
          cid=$(docker compose ps -q nostr_relay 2>/dev/null || true)
          if [ -n "$cid" ]; then docker exec "$cid" sh -c 'rm -rf /tmp/evidence /tmp/maker.sh /tmp/findhold.sh /tmp/maker.hex /tmp/releaser_inner.sh /tmp/fiat.seen /tmp/fiat.cand /tmp/fiat.ev /tmp/fiat.plain /tmp/release.pub.out /tmp/release.pub.err /tmp/rater_sec.hex /tmp/rater_msg.json /tmp/rater_order.json /tmp/maker_order1.tuple.json' || true; fi
          rm -rf "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/phase6c_diagnostics" "$RUNNER_TEMP/phase6c_daemon.raw.log" \
                 "$RUNNER_TEMP/phase6c_relay.raw.log" "$RUNNER_TEMP/relay_matrix" "$RUNNER_TEMP/relaydb" \
                 "$RUNNER_TEMP/nak-host" "$RUNNER_TEMP/relayreq.sh" \
                 "$RUNNER_TEMP/relay_req_paths.log" "$RUNNER_TEMP/relay_req_last_path" \
                 "$RUNNER_TEMP/relayreq_probe.json" "$RUNNER_TEMP/relayreq_probe.json.tmp" "$RUNNER_TEMP/all14.json.tmp" \
                 "$RUNNER_TEMP"/phase6c_* "$RUNNER_TEMP/maker.hex" "$RUNNER_TEMP/maker.pub" "$RUNNER_TEMP/daemon.nsec" \
                 "$RUNNER_TEMP/maker_identity.hex" "$RUNNER_TEMP/maker_identity.pub" "$RUNNER_TEMP/third.hex" "$RUNNER_TEMP/third.pub" \
                 "$RUNNER_TEMP/maker_order1.tuple.json" "$RUNNER_TEMP/maker_order2.tuple.json" \
                 "$RUNNER_TEMP/rater.sh" "$RUNNER_TEMP/rater.out" "$RUNNER_TEMP/rater.pid" "$RUNNER_TEMP/rater.status" \
                 "$RUNNER_TEMP/rater_state" "$RUNNER_TEMP/rater.log" "$RUNNER_TEMP/rater_evidence" \
                 "$RUNNER_TEMP/ratings_38384.json" "$RUNNER_TEMP/ratings_all.json" \
                 "$RUNNER_TEMP/app_rating_38384.json" "$RUNNER_TEMP/seller_rating_38384.json" \
                 "$RUNNER_TEMP/order2_38383.json" "$RUNNER_TEMP/order2_probe.json" "$RUNNER_TEMP/order2_rating_tag.txt" \
                 "$RUNNER_TEMP/daemon.pub" "$RUNNER_TEMP/settings.toml" "$RUNNER_TEMP/maker.sh" "$RUNNER_TEMP/findhold.sh" \
                 "$RUNNER_TEMP/payer.sh" "$RUNNER_TEMP/payer.out" "$RUNNER_TEMP/payer.pid" "$RUNNER_TEMP/payer.status" \
                 "$RUNNER_TEMP/payer_state" "$RUNNER_TEMP/findhold.out" "$RUNNER_TEMP/hold_invoice.txt" \
                 "$RUNNER_TEMP/hold_pay_invoice.plain" "$RUNNER_TEMP/hold_hash.txt" "$RUNNER_TEMP/taker_invoice.txt" \
                 "$RUNNER_TEMP/order_id.txt" "$RUNNER_TEMP/maker.out" "$RUNNER_TEMP/maker.err" \
                 "$RUNNER_TEMP/all14.json" "$RUNNER_TEMP/app_msgs.json" "$RUNNER_TEMP/active38383.json" \
                 "$RUNNER_TEMP/app_msg_count.txt" "$RUNNER_TEMP/app_msg_p.txt" "$RUNNER_TEMP/alice_pay.out" \
                 "$RUNNER_TEMP/alice_pay.pid" "$RUNNER_TEMP/flutter_integration.out" \
                 "$RUNNER_TEMP/watch38383.sh" "$RUNNER_TEMP/watcher38383.json" "$RUNNER_TEMP/watcher38383.json.tmp" \
                 "$RUNNER_TEMP/watcher38383_seen.jsonl" "$RUNNER_TEMP/watcher38383.log" "$RUNNER_TEMP/watcher38383.err" \
                 "$RUNNER_TEMP/watcher38383.out" "$RUNNER_TEMP/watcher38383.pid" "$RUNNER_TEMP/watcher38383_poll.json" \
                 "$RUNNER_TEMP/watcher38383_poll.tmp" "$RUNNER_TEMP/daemon38383_all.json" \
                 "$RUNNER_TEMP/inprogress38383.json" "$RUNNER_TEMP/nak38383.err" \
                 "$RUNNER_TEMP/releaser.sh" "$RUNNER_TEMP/releaser_inner.sh" "$RUNNER_TEMP/releaser.out" \
                 "$RUNNER_TEMP/releaser.log" "$RUNNER_TEMP/releaser.pid" "$RUNNER_TEMP/releaser.status" \
                 "$RUNNER_TEMP/fiat_sent_ok.plain" "$RUNNER_TEMP/release14.json" \
                 "$RUNNER_TEMP/success38383.json" "$RUNNER_TEMP/success_probe.json" || true
          docker rm -f satonero-daemon >/dev/null 2>&1 || true
          docker volume rm satonero-config >/dev/null 2>&1 || true
          docker compose down -v || true
          docker system prune -af --volumes || true
          cleanup_failed=0
          [ "${resolution_ok:-0}" = 1 ] || cleanup_failed=1
          verify_absent() { label=$1; shift; if output=$("$@" 2>/dev/null); then if [ -z "$output" ]; then echo "absence confirmed: $label"; else echo "resource remains: $label"; cleanup_failed=1; fi; else rc=$?; echo "inspection failed: $label rc=$rc"; cleanup_failed=1; fi; }
          verify_absent 'satonero daemon containers' docker ps -a -q --filter name=satonero-daemon
          verify_absent 'satonero config volumes' docker volume ls -q --filter name=satonero-config
          verify_absent 'regtest containers' docker ps -a -q --filter name=mostro-regtest-
          verify_absent 'regtest volumes' docker volume ls -q --filter name=mostro-regtest_
          if python3 - "$RUNNER_TEMP" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          names = ('maker.hex', 'daemon.nsec', 'maker.pub', 'daemon.pub', 'settings.toml', 'maker.sh',
                   'findhold.sh', 'payer.sh', 'payer.out', 'payer.pid', 'payer.status', 'payer_state',
                   'findhold.out', 'hold_invoice.txt', 'hold_pay_invoice.plain', 'hold_hash.txt',
                   'taker_invoice.txt', 'order_id.txt', 'maker.out', 'maker.err', 'all14.json',
                   'app_msgs.json', 'active38383.json', 'app_msg_count.txt', 'app_msg_p.txt',
                   'alice_pay.out', 'alice_pay.pid', 'flutter_integration.out', 'phase6c_vars',
                   'evidence', 'phase6c_diagnostics', 'phase6c_daemon.raw.log', 'phase6c_relay.raw.log',
                   'watch38383.sh', 'watcher38383.json', 'watcher38383.json.tmp', 'watcher38383_seen.jsonl',
                   'watcher38383.log', 'watcher38383.err', 'watcher38383.out', 'watcher38383.pid',
                   'watcher38383_poll.json', 'watcher38383_poll.tmp', 'daemon38383_all.json',
                   'inprogress38383.json', 'nak38383.err',
                   'releaser.sh', 'releaser_inner.sh', 'releaser.out', 'releaser.log',
                   'releaser.pid', 'releaser.status', 'fiat_sent_ok.plain', 'release14.json',
                   'success38383.json', 'success_probe.json',
                   'maker_identity.hex', 'maker_identity.pub', 'third.hex', 'third.pub',
                   'maker_order1.tuple.json', 'maker_order2.tuple.json',
                   'rater.sh', 'rater.out', 'rater.pid', 'rater.status', 'rater_state', 'rater.log',
                   'rater_evidence', 'ratings_38384.json', 'ratings_all.json',
                   'app_rating_38384.json', 'seller_rating_38384.json',
                   'order2_38383.json', 'order2_probe.json', 'order2_rating_tag.txt')
          left = [n for n in names if (root / n).exists()]
          left.extend(p.name for p in root.glob('phase6c_*'))
          left.extend(p.name for p in root.glob('watcher38383*'))
          left.extend(p.name for p in root.glob('rater*'))
          if left:
              print('runner-temp resources remain: ' + ','.join(sorted(set(left))))
              raise SystemExit(1)
          print('runner-temp absence confirmed')
          PY
          then echo 'runner-temp absence confirmed'; else rc=$?; echo "runner-temp inspection/absence failed rc=$rc"; cleanup_failed=1; fi
          if [ "$cleanup_failed" = 0 ]; then echo 'CLEANUP VERIFIED'; else echo 'CLEANUP NOT VERIFIED'; exit 1; fi
      - name: Verdict
        if: always()
        env:
          GATE_RESULT: ${{ steps.phase6c_gate.outputs.gate }}
          CLEANUP_OUTCOME: ${{ steps.phase6c_cleanup.outcome }}
        run: |
          set +x
          gate=${GATE_RESULT:-missing}
          printf 'PHASE6C_GATE=%s CLEANUP=%s\n' "$gate" "${CLEANUP_OUTCOME:-missing}"
          if [ "$gate" != pass ]; then echo 'FAIL: Phase 6C gate'; exit 1; fi
          if [ "${CLEANUP_OUTCOME:-}" != "success" ]; then echo 'FAIL: cleanup'; exit 1; fi
          echo 'SUCCESS: the Satonero Android app took a CLI maker order on regtest, submitted the buyer invoice and reached active, marked the fiat as sent, the CLI maker released, and the daemon settled the hold invoice, paid the buyer payout invoice and finalised the order as Success; the app then rated the seller, the daemon published signed kind-38384 aggregates (app and seller), rejected the invalid/unknown/unauthorized/duplicate cases, and the app rendered the updated reputation on a fresh pending order'
