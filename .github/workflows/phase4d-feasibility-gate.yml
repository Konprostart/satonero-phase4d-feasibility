name: phase4d-feasibility-gate
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: feasibility-gate
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Pre-flight report
        run: |
          set -euo pipefail
          df -h /
          docker --version
          docker compose version
          jq --version
          git --version
      - name: Free preinstalled space (existence-checked, sizes logged)
        run: |
          set -euo pipefail
          for p in /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift; do
            if [ -e "$p" ]; then
              echo "removing $p ($(sudo du -sh "$p" | cut -f1))"
              sudo rm -rf "$p"
            else
              echo "absent: $p"
            fi
          done
          df -h /
      - name: Pre-build disk gate (>= 8 GB free)
        run: |
          set -euo pipefail
          free_kb=$(df --output=avail -k / | tail -1)
          echo "free_kb=$free_kb"
          if [ "$free_kb" -lt 8388608 ]; then echo "INFEASIBLE-DISK: < 8 GB free"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          repository: Konprostart/Satonero
          ref: 2534f8b0f05ade36007445511e02747f4468109a
          path: satonero
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: MostroP2P/mostro-regtest
          ref: c6adbdaaaf0a2152a0728dbce6adf11945f547bd
          path: mostro-regtest
          persist-credentials: false
          fetch-depth: 1
      - name: Verify pinned SHAs and clean tree
        run: |
          set -euo pipefail
          test "$(git -C satonero rev-parse HEAD)" = "2534f8b0f05ade36007445511e02747f4468109a"
          test "$(git -C mostro-regtest rev-parse HEAD)" = "c6adbdaaaf0a2152a0728dbce6adf11945f547bd"
          test -z "$(git -C satonero status --porcelain --untracked-files=all)"
      - name: Apply nak pin to runner checkout of mostro-regtest (not committed)
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          f=docker/nostr_relay/Dockerfile
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "16c3d80abc0ec58a72b782dc78f5eab2021c3fdab386514672777d941d34f553"
          python3 - <<'PY'
          p = "docker/nostr_relay/Dockerfile"
          lines = open(p, encoding="utf-8").read().split("\n")
          i = [n for n, l in enumerate(lines) if l.startswith("RUN BIN_URL=$(curl -s https://api.github.com/repos/fiatjaf/nak/releases/latest")]
          assert len(i) == 1, i
          i = i[0]
          assert lines[i].endswith("grep linux-amd64) \\"), lines[i]
          lines[i] = "RUN BIN_URL=https://github.com/fiatjaf/nak/releases/download/v0.22.2/nak-v0.22.2-linux-amd64 \\"
          j = [n for n, l in enumerate(lines) if l == "  && curl -SLO $BIN_URL \\"]
          assert len(j) == 1, j
          j = j[0]
          lines[j:j + 1] = [
              "  && curl -fSLO $BIN_URL \\",
              '  && echo "1b81a772619d913f345ecc3d663edcd37e7548ea6b4e21c582bb3826e2604556  nak-v0.22.2-linux-amd64" | sha256sum -c - \\',
          ]
          open(p, "w", encoding="utf-8").write("\n".join(lines))
          PY
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "b5b35e3d596f26552c42a63ac13134722a8924c7fca451e43ab221e3368ed00e"
          echo "patched Dockerfile sha256 verified"
      - name: Apply runner-only healthcheck fix to mostro-regtest compose (not committed)
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          f=docker-compose.yml
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "ac08e210765c0c95cd255be2045127f595b3da8d66a27288a4b254ff8b71ea4d"
          python3 - <<'PY'
          p = "docker-compose.yml"
          src = open(p, encoding="utf-8").read()
          old = "nak relay nostr_relay:8080"
          new = "nak relay http://nostr_relay:8080"
          assert src.count(old) == 1, src.count(old)
          open(p, "w", encoding="utf-8").write(src.replace(old, new))
          PY
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "65a3d14cc76245ec6dca5b1b939e934cbd509fe8788c1935d940def9be606b0c"
          echo "patched docker-compose.yml sha256 verified"
      - name: Build Satonero daemon image (build only, no up)
        working-directory: satonero
        timeout-minutes: 40
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker compose -f docker/compose.yml build mostro
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))"
      - name: Disk checkpoint (floor >= 3 GB free)
        run: |
          set -euo pipefail
          free_kb=$(df --output=avail -k / | tail -1)
          echo "free_kb=$free_kb"
          if [ "$free_kb" -lt 3145728 ]; then echo "INFEASIBLE-DISK: < 3 GB free"; exit 1; fi
      - name: Start regtest services (named volumes only, no channel init)
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          docker compose up -d bitcoin mostro_lnd alice_lnd bob_lnd nostr_relay
      - name: Wait for healthchecks (max 10 min, per-service status)
        id: health
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            out=$(docker compose ps --format '{{.Service}} {{.Health}}' bitcoin mostro_lnd alice_lnd bob_lnd nostr_relay)
            echo "$out"
            if [ "$(echo "$out" | grep -c ' healthy$')" -eq 5 ]; then echo "HEALTHY: 5/5"; exit 0; fi
            sleep 10
          done
          echo "FAIL: healthchecks not all healthy"; exit 1
      - name: Positive control - generate disposable key (runner temp only, no tracing)
        working-directory: mostro-regtest
        run: |
          set +x
          set -euo pipefail
          umask 077
          hex=$(docker run --rm --entrypoint nak mostro-regtest-nostr_relay key generate)
          pub=$(docker run --rm --entrypoint nak mostro-regtest-nostr_relay key public "$hex")
          printf '%s' "$hex" > "$RUNNER_TEMP/ctl.hex"
          printf '%s' "$pub" > "$RUNNER_TEMP/ctl.pub"
          chmod 600 "$RUNNER_TEMP/ctl.hex"
          nonce="p4e-$(date +%s%N)-$RANDOM"
          printf '%s' "$nonce" > "$RUNNER_TEMP/ctl.nonce"
          unset hex
          echo "fresh control pubkey (public): $pub"
          echo "NOTE: 094cba56... cannot be matched: its private key was generated in an earlier run and deleted."
          echo "control nonce (public): $nonce"
      - name: Positive control - transfer key via docker cp, verify, load into NOSTR_SECRET_KEY, remove file
        working-directory: mostro-regtest
        run: |
          set +x
          set -euo pipefail
          umask 077
          cid=$(docker compose ps -q nostr_relay)
          test -n "$cid"
          docker cp "$RUNNER_TEMP/ctl.hex" "$cid:/tmp/ctl.hex"
          rm -f "$RUNNER_TEMP/ctl.hex"
          test ! -e "$RUNNER_TEMP/ctl.hex"
          docker exec "$cid" sh -c 'chmod 600 /tmp/ctl.hex && test -s /tmp/ctl.hex && echo "key file in container: present, mode $(stat -c %a /tmp/ctl.hex), length $(wc -c < /tmp/ctl.hex) chars"'
          echo "runner-side key copy removed"
      - name: Positive control - nak -v event publish to local relay (fail loudly on no event)
        working-directory: mostro-regtest
        run: |
          set +x
          set -uo pipefail
          umask 077
          d="$RUNNER_TEMP/pc"; mkdir -p "$d"
          nonce=$(cat "$RUNNER_TEMP/ctl.nonce")
          pub=$(cat "$RUNNER_TEMP/ctl.pub")
          timeout 60 docker compose exec -T nostr_relay sh -c 'set +x; umask 077; export NOSTR_SECRET_KEY="$(cat /tmp/ctl.hex)"; rm -f /tmp/ctl.hex; test -n "$NOSTR_SECRET_KEY" && exec nak -v event -k 1 -c "$0" --tag t=p4e-positive-control ws://localhost:8080 < /dev/null' "$nonce" > "$d/publish.stdout" 2> "$d/publish.stderr"
          rc=$?
          echo "publish exit status: $rc"
          echo "publish stdout bytes: $(wc -c < "$d/publish.stdout")  stderr lines: $(wc -l < "$d/publish.stderr")"
          echo "-- publish stderr (first 25 lines, verbose nak output):"
          head -25 "$d/publish.stderr" | cut -c1-240
          echo "-- key file removed inside container:"
          docker compose exec -T nostr_relay sh -c 'test ! -e /tmp/ctl.hex && echo "absent"' || echo "CHECK FAILED"
          if [ "$rc" != "0" ] || [ ! -s "$d/publish.stdout" ]; then echo "PUBLISH FAILED: no event JSON produced (rc=$rc)"; exit 1; fi
          id=$(jq -r '.id // empty' "$d/publish.stdout")
          got_pub=$(jq -r '.pubkey // empty' "$d/publish.stdout")
          kind=$(jq -r '.kind // empty' "$d/publish.stdout")
          content=$(jq -r '.content // empty' "$d/publish.stdout")
          tagok=$(jq -r 'any(.tags[]; .[0]=="t" and .[1]=="p4e-positive-control")' "$d/publish.stdout")
          echo "event id (public): $id"
          echo "event pubkey (public): $got_pub"
          echo "event kind: $kind; content matches nonce: $([ "$content" = "$nonce" ] && echo yes || echo no); tag ok: $tagok"
          test "${#id}" = "64" || { echo "PUBLISH FAILED: no 64-char event id"; exit 1; }
          test "$got_pub" = "$pub" || { echo "PUBLISH FAILED: event pubkey differs from generated pubkey"; exit 1; }
          test "$kind" = "1" && test "$tagok" = "true" && test "$content" = "$nonce" || { echo "PUBLISH FAILED: event fields differ"; exit 1; }
          printf '%s' "$id" > "$RUNNER_TEMP/ctl.id"
          echo "PUBLISH OK (event id stored in runner temp)"
      - name: Filter diagnostic - nak req generated filters (no relay argument, stdin from /dev/null)
        working-directory: mostro-regtest
        run: |
          set +x
          set -uo pipefail
          umask 077
          d="$RUNNER_TEMP/pc"; mkdir -p "$d"
          id=$(cat "$RUNNER_TEMP/ctl.id")
          pub=$(cat "$RUNNER_TEMP/ctl.pub")
          timeout 30 docker compose exec -T nostr_relay nak req --id "$id" --limit 5 < /dev/null > "$d/nak_id_filter.json" 2> "$d/nak_id_filter.err"; echo "nak id filter rc=$?"
          timeout 30 docker compose exec -T nostr_relay nak req --author "$pub" --limit 20 < /dev/null > "$d/nak_author_filter.json" 2> "$d/nak_author_filter.err"; echo "nak author filter rc=$?"
          echo "-- nak id filter stdout (raw):"; cat "$d/nak_id_filter.json"
          echo "-- nak id filter stderr:"; head -3 "$d/nak_id_filter.err"
          echo "-- nak author filter stdout (raw):"; cat "$d/nak_author_filter.json"
          echo "-- nak author filter stderr:"; head -3 "$d/nak_author_filter.err"
      - name: Filter diagnostic - compare nak filters with python filters and replay nak filters over raw WebSocket
        working-directory: mostro-regtest
        run: |
          set +x
          set -uo pipefail
          umask 077
          cat > "$RUNNER_TEMP/rawws.py" <<'PY'
          import base64, json, os, socket, struct, sys

          def recv_exact(s, n):
              buf = b""
              while len(buf) < n:
                  c = s.recv(n - len(buf))
                  if not c:
                      raise ConnectionError("socket closed")
                  buf += c
              return buf

          def ws_connect(host, port):
              s = socket.create_connection((host, port), timeout=15)
              key = base64.b64encode(os.urandom(16)).decode()
              req = ("GET / HTTP/1.1\r\nHost: %s:%d\r\nUpgrade: websocket\r\nConnection: Upgrade\r\n"
                     "Sec-WebSocket-Key: %s\r\nSec-WebSocket-Version: 13\r\n\r\n") % (host, port, key)
              s.sendall(req.encode())
              head = b""
              while b"\r\n\r\n" not in head:
                  c = s.recv(1)
                  if not c:
                      raise ConnectionError("no handshake")
                  head += c
              status = head.split(b"\r\n")[0].decode(errors="replace")
              if " 101 " not in status:
                  raise ConnectionError("handshake: " + status)
              return s

          def ws_send_text(s, text):
              payload = text.encode()
              mask = os.urandom(4)
              n = len(payload)
              hdr = bytearray([0x81])
              if n < 126:
                  hdr.append(0x80 | n)
              elif n < 65536:
                  hdr.append(0x80 | 126); hdr += struct.pack(">H", n)
              else:
                  hdr.append(0x80 | 127); hdr += struct.pack(">Q", n)
              s.sendall(bytes(hdr) + mask + bytes(b ^ mask[i % 4] for i, b in enumerate(payload)))

          def ws_recv_frame(s):
              b1, b2 = recv_exact(s, 2)
              op = b1 & 0x0F
              n = b2 & 0x7F
              if n == 126:
                  n = struct.unpack(">H", recv_exact(s, 2))[0]
              elif n == 127:
                  n = struct.unpack(">Q", recv_exact(s, 8))[0]
              return op, recv_exact(s, n)

          def run(label, flt, subid):
              s = ws_connect("127.0.0.1", 8080)
              print("[%s] REQ %s" % (label, json.dumps(flt, sort_keys=True)))
              ws_send_text(s, json.dumps(["REQ", subid, flt]))
              s.settimeout(10)
              try:
                  while True:
                      op, payload = ws_recv_frame(s)
                      if op == 9:
                          continue
                      if op == 8:
                          print("[%s] CLOSE_FRAME from relay" % label)
                          break
                      if op != 1:
                          print("[%s] non-text opcode %d" % (label, op))
                          continue
                      text = payload.decode(errors="replace")
                      try:
                          m = json.loads(text)
                      except Exception:
                          print("[%s] NONJSON %s" % (label, text[:300]))
                          continue
                      kind = m[0] if isinstance(m, list) and m else "?"
                      if kind == "EVENT" and isinstance(m[2], dict):
                          e = m[2]
                          print("[%s] EVENT id=%s kind=%s pubkey=%s" % (label, e.get("id"), e.get("kind"), e.get("pubkey")))
                      else:
                          print("[%s] %s" % (label, text[:300]))
                      if kind in ("EOSE", "CLOSED"):
                          break
              except socket.timeout:
                  print("[%s] TIMEOUT: no EOSE within 10 s" % label)
              try:
                  ws_send_text(s, json.dumps(["CLOSE", subid]))
              except Exception:
                  pass
              s.close()

          def load_nak(path):
              raw = open(path, encoding="utf-8").read().strip()
              obj = json.loads(raw)
              if isinstance(obj, list) and len(obj) >= 3 and obj[0] == "REQ":
                  obj = obj[2]
              return obj

          def cmp(a, b):
              for k in sorted(set(a) | set(b)):
                  va = a.get(k, "<absent>")
                  vb = b.get(k, "<absent>")
                  tag = "SAME" if va == vb else "DIFF"
                  print("  field %-8s nak=%s  py=%s  %s  (types nak=%s py=%s)" % (k, json.dumps(va), json.dumps(vb), tag,
                        type(va).__name__, type(vb).__name__))

          if __name__ == "__main__":
              nak_id_path, nak_author_path, event_id, author = sys.argv[1:5]
              py_id = {"ids": [event_id], "limit": 5}
              py_author = {"authors": [author], "limit": 20}
              for name, nak_path, py_flt in (("id", nak_id_path, py_id), ("author", nak_author_path, py_author)):
                  try:
                      nak_flt = load_nak(nak_path)
                  except Exception as ex:
                      print("[%s] nak filter not parseable as JSON: %s" % (name, ex))
                      continue
                  print("== %s filter comparison (nak vs python) ==" % name)
                  cmp(nak_flt, py_flt)
                  print("  nak filter keys: %s" % sorted(nak_flt.keys()))
                  print("  exact-match nak==py: %s" % (nak_flt == py_flt))
                  run("nak-%s" % name, nak_flt, "nak-" + name)
                  run("py-%s" % name, py_flt, "py-" + name)
          PY
          id=$(cat "$RUNNER_TEMP/ctl.id")
          pub=$(cat "$RUNNER_TEMP/ctl.pub")
          python3 "$RUNNER_TEMP/rawws.py" "$RUNNER_TEMP/pc/nak_id_filter.json" "$RUNNER_TEMP/pc/nak_author_filter.json" "$id" "$pub" > "$RUNNER_TEMP/pc/rawws.txt" 2> "$RUNNER_TEMP/pc/rawws.err"
          echo "rawws exit status: $?"
          cat "$RUNNER_TEMP/pc/rawws.txt"
          echo "-- rawws stderr (first 5 lines):"; head -5 "$RUNNER_TEMP/pc/rawws.err" || true
      - name: Positive control - relay log lines (filtered, always)
        if: always()
        working-directory: mostro-regtest
        run: |
          set +x
          docker compose logs --no-color --tail 400 nostr_relay 2>&1 | grep -a -i -E "persisted event|reject|invalid|NOTICE|CLOSED|subscri|error" | tail -60 || true
      - name: Cleanup (always) with removal verification
        if: always()
        working-directory: mostro-regtest
        run: |
          set +x
          rm -rf "$RUNNER_TEMP/pc" || true
          rm -f "$RUNNER_TEMP/rawws.py" "$RUNNER_TEMP/pc/nak_id_filter.json" "$RUNNER_TEMP/pc/nak_author_filter.json" "$RUNNER_TEMP/ctl.hex" "$RUNNER_TEMP/ctl.pub" "$RUNNER_TEMP/ctl.nonce" "$RUNNER_TEMP/ctl.id" "$RUNNER_TEMP/wsclient.py" || true
          docker compose down -v || true
          docker system prune -af --volumes || true
          df -h /
          echo "== removal verification =="
          echo "regtest containers left: [$(docker ps -a -q --filter name=mostro-regtest-)]"
          echo "regtest volumes left: [$(docker volume ls -q --filter name=mostro-regtest_)]"
          echo "credential files left: $(for f in ctl.hex ctl.pub ctl.nonce ctl.id wsclient.py; do test -e "$RUNNER_TEMP/$f" && echo -n "$f "; done)"
          if [ -z "$(docker ps -a -q --filter name=mostro-regtest-)" ] && [ -z "$(docker volume ls -q --filter name=mostro-regtest_)" ] && ! test -e "$RUNNER_TEMP/ctl.hex"; then echo "CLEANUP VERIFIED: containers, volumes and temporary credentials removed"; else echo "CLEANUP NOT VERIFIED"; exit 1; fi
