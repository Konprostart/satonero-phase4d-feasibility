name: phase4d-feasibility-gate
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: feasibility-gate
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Pre-flight report
        run: |
          set -euo pipefail
          df -h /
          docker --version
          docker compose version
          jq --version
          git --version
      - name: Free preinstalled space (existence-checked, sizes logged)
        run: |
          set -euo pipefail
          for p in /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift; do
            if [ -e "$p" ]; then
              echo "removing $p ($(sudo du -sh "$p" | cut -f1))"
              sudo rm -rf "$p"
            else
              echo "absent: $p"
            fi
          done
          df -h /
      - name: Pre-build disk gate (>= 8 GB free)
        run: |
          set -euo pipefail
          free_kb=$(df --output=avail -k / | tail -1)
          echo "free_kb=$free_kb"
          if [ "$free_kb" -lt 8388608 ]; then echo "INFEASIBLE-DISK: < 8 GB free"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          repository: Konprostart/Satonero
          ref: 2534f8b0f05ade36007445511e02747f4468109a
          path: satonero
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: MostroP2P/mostro-regtest
          ref: c6adbdaaaf0a2152a0728dbce6adf11945f547bd
          path: mostro-regtest
          persist-credentials: false
          fetch-depth: 1
      - name: Verify pinned SHAs and clean tree
        run: |
          set -euo pipefail
          test "$(git -C satonero rev-parse HEAD)" = "2534f8b0f05ade36007445511e02747f4468109a"
          test "$(git -C mostro-regtest rev-parse HEAD)" = "c6adbdaaaf0a2152a0728dbce6adf11945f547bd"
          test -z "$(git -C satonero status --porcelain --untracked-files=all)"
      - name: Apply nak pin to runner checkout of mostro-regtest (not committed)
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          f=docker/nostr_relay/Dockerfile
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "16c3d80abc0ec58a72b782dc78f5eab2021c3fdab386514672777d941d34f553"
          python3 - <<'PY'
          p = "docker/nostr_relay/Dockerfile"
          lines = open(p, encoding="utf-8").read().split("\n")
          i = [n for n, l in enumerate(lines) if l.startswith("RUN BIN_URL=$(curl -s https://api.github.com/repos/fiatjaf/nak/releases/latest")]
          assert len(i) == 1, i
          i = i[0]
          assert lines[i].endswith("grep linux-amd64) \\"), lines[i]
          lines[i] = "RUN BIN_URL=https://github.com/fiatjaf/nak/releases/download/v0.22.2/nak-v0.22.2-linux-amd64 \\"
          j = [n for n, l in enumerate(lines) if l == "  && curl -SLO $BIN_URL \\"]
          assert len(j) == 1, j
          j = j[0]
          lines[j:j + 1] = [
              "  && curl -fSLO $BIN_URL \\",
              '  && echo "1b81a772619d913f345ecc3d663edcd37e7548ea6b4e21c582bb3826e2604556  nak-v0.22.2-linux-amd64" | sha256sum -c - \\',
          ]
          open(p, "w", encoding="utf-8").write("\n".join(lines))
          PY
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "b5b35e3d596f26552c42a63ac13134722a8924c7fca451e43ab221e3368ed00e"
          echo "patched Dockerfile sha256 verified"
      - name: Apply runner-only healthcheck fix to mostro-regtest compose (not committed)
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          f=docker-compose.yml
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "ac08e210765c0c95cd255be2045127f595b3da8d66a27288a4b254ff8b71ea4d"
          python3 - <<'PY'
          p = "docker-compose.yml"
          src = open(p, encoding="utf-8").read()
          old = "nak relay nostr_relay:8080"
          new = "nak relay http://nostr_relay:8080"
          assert src.count(old) == 1, src.count(old)
          open(p, "w", encoding="utf-8").write(src.replace(old, new))
          PY
          test "$(sha256sum "$f" | cut -d' ' -f1)" = "65a3d14cc76245ec6dca5b1b939e934cbd509fe8788c1935d940def9be606b0c"
          echo "patched docker-compose.yml sha256 verified"
      - name: Build Satonero daemon image (build only, no up)
        working-directory: satonero
        timeout-minutes: 40
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker compose -f docker/compose.yml build mostro
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))"
      - name: Disk checkpoint (floor >= 3 GB free)
        run: |
          set -euo pipefail
          free_kb=$(df --output=avail -k / | tail -1)
          echo "free_kb=$free_kb"
          if [ "$free_kb" -lt 3145728 ]; then echo "INFEASIBLE-DISK: < 3 GB free"; exit 1; fi
      - name: Start regtest services (named volumes only, no channel init)
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          docker compose up -d bitcoin mostro_lnd alice_lnd bob_lnd nostr_relay
      - name: Wait for healthchecks (max 10 min, per-service status)
        id: health
        working-directory: mostro-regtest
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            out=$(docker compose ps --format '{{.Service}} {{.Health}}' bitcoin mostro_lnd alice_lnd bob_lnd nostr_relay)
            echo "$out"
            if [ "$(echo "$out" | grep -c ' healthy$')" -eq 5 ]; then echo "HEALTHY: 5/5"; exit 0; fi
            sleep 10
          done
          echo "FAIL: healthchecks not all healthy"; exit 1
      - name: Generate disposable daemon key (runner temp only, no tracing)
        working-directory: mostro-regtest
        run: |
          set +x
          set -euo pipefail
          umask 077
          hex=$(docker run --rm --entrypoint nak mostro-regtest-nostr_relay key generate)
          nsec=$(docker run --rm --entrypoint nak mostro-regtest-nostr_relay encode nsec "$hex")
          pub=$(docker run --rm --entrypoint nak mostro-regtest-nostr_relay key public "$hex")
          printf '%s' "$nsec" > "$RUNNER_TEMP/daemon.nsec"
          printf '%s' "$pub" > "$RUNNER_TEMP/daemon.pub"
          test "$(wc -c < "$RUNNER_TEMP/daemon.nsec")" -gt 60
          echo "disposable daemon pubkey (public): $pub"
      - name: Build runner-only daemon settings (values not printed)
        working-directory: satonero
        run: |
          set +x
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os, tomllib
          rt = os.environ["RUNNER_TEMP"]
          src = open("settings.tpl.toml", encoding="utf-8").read()
          nsec = open(os.path.join(rt, "daemon.nsec"), encoding="utf-8").read().strip()
          reps = [
              ("lnd_cert_file = '/home/user/.polar/networks/1/volumes/lnd/alice/tls.cert'",
               "lnd_cert_file = '/config/lnd/tls.cert'"),
              ("lnd_macaroon_file = '/home/user/.polar/networks/1/volumes/lnd/alice/data/chain/bitcoin/regtest/admin.macaroon'",
               "lnd_macaroon_file = '/config/lnd/admin.macaroon'"),
              ("lnd_grpc_host = 'https://127.0.0.1:10001'",
               "lnd_grpc_host = 'https://mostro_lnd:10001'"),
              ("nsec_privkey = 'nsec1...'",
               "nsec_privkey = '" + nsec + "'"),
              ("relays = ['ws://localhost:7000']",
               "relays = ['ws://nostr_relay:8080']"),
              ('bitcoin_price_api_url = "https://api.yadio.io"',
               'bitcoin_price_api_url = "http://127.0.0.1:9"'),
          ]
          out = src
          for old, new in reps:
              n = out.count(old)
              assert n == 1, (old[:50], n)
              out = out.replace(old, new)
          cfg = tomllib.loads(out)
          assert cfg["lightning"]["lnd_grpc_host"] == "https://mostro_lnd:10001"
          assert cfg["nostr"]["relays"] == ["ws://nostr_relay:8080"]
          assert cfg["mostro"]["bitcoin_price_api_url"] == "http://127.0.0.1:9"
          assert cfg["mostro"]["dev_fee_enabled"] is False
          assert "price" not in cfg
          assert cfg["nostr"]["nsec_privkey"].startswith("nsec1")
          open(os.path.join(rt, "settings.toml"), "w", encoding="utf-8").write(out)
          print("daemon settings written and parsed")
          PY
      - name: Install daemon settings and LND credentials into named volume
        working-directory: mostro-regtest
        run: |
          set +x
          set -euo pipefail
          umask 077
          uid=$(docker run --rm --entrypoint id docker-mostro -u)
          echo "container user uid: $uid"
          docker volume create satonero-config >/dev/null
          docker run --rm --user root --entrypoint sh \
            -v satonero-config:/config \
            -v mostro-regtest_mostro_lnd:/lnd:ro \
            -v "$RUNNER_TEMP":/src:ro \
            docker-mostro -c "set -e; mkdir -p /config/lnd; cp /src/settings.toml /config/settings.toml; cp /lnd/tls.cert /config/lnd/tls.cert; cp /lnd/data/chain/bitcoin/regtest/admin.macaroon /config/lnd/admin.macaroon; chmod 600 /config/settings.toml /config/lnd/admin.macaroon; chown -R $uid:$uid /config; ls -l /config /config/lnd"
      - name: Start Satonero daemon (disposable, regtest network only)
        working-directory: mostro-regtest
        run: |
          set +x
          set -euo pipefail
          docker network inspect mostro-regtest_default >/dev/null
          docker run -d --name satonero-daemon --network mostro-regtest_default -v satonero-config:/config docker-mostro:latest >/dev/null
          sleep 60
          test "$(docker inspect -f '{{.State.Running}}' satonero-daemon)" = "true"
          echo "daemon running after 60 s; restart count: $(docker inspect -f '{{.RestartCount}}' satonero-daemon)"
      - name: Verify daemon LND identity matches mostro_lnd getinfo
        working-directory: mostro-regtest
        run: |
          set +x
          set -euo pipefail
          lnd_id=$(docker compose exec -T --user lnd mostro_lnd lncli --network=regtest --rpcserver=localhost:10001 getinfo | jq -r .identity_pubkey)
          echo "mostro_lnd identity_pubkey: $lnd_id"
          daemon_id=""
          for i in $(seq 1 30); do
            daemon_id=$(docker logs satonero-daemon 2>&1 | grep -a "Recorded Lightning node identity" | grep -oE '[0-9a-f]{66}' | tail -1 || true)
            [ -n "$daemon_id" ] && break
            sleep 10
          done
          echo "daemon recorded identity: $daemon_id"
          test -n "$daemon_id"
          test "$daemon_id" = "$lnd_id"
          if docker logs satonero-daemon 2>&1 | grep -a -E "No connection to LND|panic|REFUSING TO START"; then echo "FAIL: LND or startup error in daemon log"; exit 1; fi
          echo "VERIFIED: daemon LND identity equals mostro_lnd identity"
      - name: Mine exactly 150 regtest blocks with the dev wallet (no funding, no channels)
        working-directory: mostro-regtest
        run: |
          set +x
          set -euo pipefail
          bc() { docker compose exec -T --user bitcoin bitcoin bitcoin-cli -regtest -rpcport=18443 -rpcuser=bitcoin -rpcpassword=bitcoin "$@"; }
          bc createwallet dev >/dev/null 2>&1 || bc loadwallet dev >/dev/null 2>&1 || true
          addr=$(bc -rpcwallet=dev getnewaddress)
          bc -rpcwallet=dev generatetoaddress 150 "$addr" > /dev/null
          echo "blockcount after mining: $(bc getblockcount)"
      - name: Wait for LND synced_to_chain (max 10 min)
        working-directory: mostro-regtest
        run: |
          set +x
          set -euo pipefail
          for i in $(seq 1 60); do
            s=$(docker compose exec -T --user lnd mostro_lnd lncli --network=regtest --rpcserver=localhost:10001 getinfo | jq -r .synced_to_chain)
            if [ "$s" = "true" ]; then date +%s > "$RUNNER_TEMP/synced_at"; echo "LND synced_to_chain=true at $(date -u +%FT%TZ)"; exit 0; fi
            sleep 10
          done
          echo "FAIL: LND not synced"; exit 1
      - name: Verify maintenance OFF (wait 330 s after sync; no 'maintenance mode ON' in daemon log)
        working-directory: mostro-regtest
        run: |
          set +x
          set -euo pipefail
          t0=$(cat "$RUNNER_TEMP/synced_at")
          now=$(date +%s)
          wait=$(( t0 + 330 - now ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          on=$(docker logs satonero-daemon 2>&1 | grep -a -c "maintenance mode ON" || true)
          echo "daemon 'maintenance mode ON' log lines: $on"
          last_info=$(docker logs satonero-daemon 2>&1 | grep -a "Sending info about mostro" | tail -1 || true)
          echo "last info-event log line: ${last_info:0:160}"
          test "$on" = "0" || { echo "FAIL: daemon entered maintenance"; exit 1; }
          if echo "$last_info" | grep -q "maintenance"; then echo "FAIL: last info event in maintenance"; exit 1; fi
          echo "MAINTENANCE OFF VERIFIED"
      - name: Generate disposable client trade key (runner temp; key never printed)
        working-directory: mostro-regtest
        run: |
          set +x
          set -euo pipefail
          umask 077
          hex=$(docker run --rm --entrypoint nak mostro-regtest-nostr_relay key generate)
          pub=$(docker run --rm --entrypoint nak mostro-regtest-nostr_relay key public "$hex")
          printf '%s' "$hex" > "$RUNNER_TEMP/cli.hex"
          chmod 600 "$RUNNER_TEMP/cli.hex"
          unset hex
          echo "client trade pubkey (public): $pub"
          printf '%s' "$pub" > "$RUNNER_TEMP/cli.pub"
      - name: Write container scripts (no secrets in these files)
        run: |
          set +x
          umask 077
          cat > "$RUNNER_TEMP/exec1.sh" <<'SH'
          #!/bin/sh
          # Runs INSIDE the relay container. No jq here, so JSON selection uses
          # nak --jq (gojq). The client key lives only in NOSTR_SECRET_KEY.
          # Args: DAEMON_PUB CLIENT_PUB
          set -u
          umask 077
          DAEMON="$1"
          CLI="$2"
          E=/tmp/evidence
          rm -rf "$E"; mkdir -p "$E"; chmod 700 "$E"
          export NOSTR_SECRET_KEY="$(cat /tmp/cli.hex)"
          rm -f /tmp/cli.hex
          if [ -e /tmp/cli.hex ] || [ -z "$NOSTR_SECRET_KEY" ]; then echo "FINAL=ERROR_KEY"; exit 1; fi
          FINAL=PENDING
          TSEND=$(date +%s)
          TSTART=$((TSEND - 10))
          MSG='[{"order":{"version":2,"request_id":1,"action":"new-order","payload":{"order":{"kind":"sell","fiat_code":"USD","fiat_amount":10,"amount":1000,"payment_method":"BANK_TRANSFER","premium":0}}}},null,null]'
          CT=$(nak encrypt --recipient-pubkey "$DAEMON" "$MSG" < /dev/null)
          echo "encrypt_rc=$? ciphertext_chars=${#CT}"
          nak event -k 14 -c "$CT" --tag p="$DAEMON" ws://localhost:8080 < /dev/null > /tmp/pub.out 2> /tmp/pub.err
          echo "publish_rc=$?"
          echo "publish_stderr=$(tr '\n' ' ' < /tmp/pub.err | cut -c1-200)"
          # ACK window: 15 polls, 20 s apart (about 5 min). Candidates are kind 14,
          # author = daemon, exactly one p tag equal to the client, created after
          # the send time minus 10 s. An ACK is classified MISSING only when the
          # window has ended. More than one distinct candidate at any poll = AMBIGUOUS.
          EXPR="select(.kind==14 and .pubkey==\"$DAEMON\" and ([.tags[]|select(.[0]==\"p\")]==[[\"p\",\"$CLI\"]]) and .created_at>=$TSTART) | .id"
          : > /tmp/seen.txt
          polls=0
          FINAL=WINDOW
          while [ $polls -lt 15 ]; do
            polls=$((polls+1))
            timeout 40 nak req -k 14 -a "$DAEMON" -t p="$CLI" --limit 50 --jq "$EXPR" --jq-raw ws://localhost:8080 < /dev/null > /tmp/cand.txt 2> /tmp/cand.err
            PRC=$?
            echo "ack_poll=$polls rc=$PRC"
            if [ "$PRC" != "0" ]; then FINAL=QUERY_FAILED; break; fi
            if grep -Evq '^[0-9a-f]{64}$' /tmp/cand.txt; then FINAL=QUERY_FAILED; break; fi
            cat /tmp/cand.txt >> /tmp/seen.txt
            n=$(sort -u /tmp/seen.txt | grep -c . || true)
            if [ "$n" -gt 1 ]; then FINAL=AMBIGUOUS_ACK; break; fi
            sleep 20
          done
          n=$(sort -u /tmp/seen.txt | grep -c . || true)
          if [ "$FINAL" = "WINDOW" ]; then
            if [ "$n" = "1" ]; then FINAL=SELECTED; elif [ "$n" = "0" ]; then FINAL=MISSING_ACK; else FINAL=AMBIGUOUS_ACK; fi
          fi
          echo "ack_window_polls=$polls distinct_candidates=$n window_result=$FINAL"
          if [ "$FINAL" = "SELECTED" ]; then
            ACKID=$(sort -u /tmp/seen.txt | grep . | head -1)
            timeout 40 nak req --id "$ACKID" --limit 1 ws://localhost:8080 < /dev/null > $E/ack14.json 2> $E/ack14.req.stderr
            echo $? > $E/ack14.req.rc
            if [ "$(cat $E/ack14.req.rc)" != "0" ]; then FINAL=ACK_FETCH_FAIL; fi
            if [ "$(grep -c . $E/ack14.json || true)" != "1" ]; then FINAL=ACK_FETCH_FAIL; fi
            FETCHED_ID=$(timeout 40 nak req --id "$ACKID" --limit 1 --jq '.id' --jq-raw ws://localhost:8080 < /dev/null 2> /tmp/fid.err) || FETCHED_ID=""
            if ! printf '%s\n' "$FETCHED_ID" | grep -Eq '^[0-9a-f]{64}$'; then FINAL=ACK_FETCH_FAIL; fi
            if [ "$FETCHED_ID" != "$ACKID" ]; then FINAL=ACK_FETCH_FAIL; fi
          fi
          if [ "$FINAL" = "SELECTED" ]; then
            nak verify < $E/ack14.json > $E/ack14.verify.stdout 2> $E/ack14.verify.stderr
            echo $? > $E/ack14.verify.rc
            if [ "$(cat $E/ack14.verify.rc)" != "0" ]; then FINAL=ACK_VERIFY_FAIL; fi
          fi
          touch $E/ack_decrypt.stdout $E/ack_decrypt.stderr
          if [ "$FINAL" = "SELECTED" ]; then
            timeout 40 nak req --id "$ACKID" --limit 1 --jq '.content' --jq-raw ws://localhost:8080 < /dev/null > /tmp/ct.txt 2> /tmp/ct.err
            CT2=$(cat /tmp/ct.txt)
            if [ -z "$CT2" ]; then FINAL=CONTENT_MISSING; fi
          fi
          if [ "$FINAL" = "SELECTED" ]; then
            nak decrypt --sender-pubkey "$DAEMON" "$CT2" < /dev/null > $E/ack_decrypt.stdout 2> $E/ack_decrypt.stderr
            echo $? > $E/ack_decrypt.rc
            if [ "$(cat $E/ack_decrypt.rc)" != "0" ]; then FINAL=DECRYPT_FAIL; fi
          fi
          # Key-match check: the client key must not appear in any evidence file.
          # Result only; the key is never printed.
          unset CT CT2 MSG
          printf '%s\n' "$NOSTR_SECRET_KEY" > /tmp/keypat
          if grep -R -F -q -f /tmp/keypat "$E"; then KM=true; else KM=false; fi
          rm -f /tmp/keypat
          unset NOSTR_SECRET_KEY
          echo "client_key_match=$KM"
          rm -f /tmp/pub.out /tmp/pub.err /tmp/cand.txt /tmp/cand.err /tmp/seen.txt /tmp/ct.txt /tmp/ct.err /tmp/fid.err
          echo "FINAL=$FINAL"
          SH
          cat > "$RUNNER_TEMP/exec2.sh" <<'SH'
          #!/bin/sh
          # Runs INSIDE the relay container. No key material is available here.
          # Args: DAEMON_PUB ORDER_UUID
          set -u
          umask 077
          DAEMON="$1"
          ORDER="$2"
          E=/tmp/evidence
          case "$ORDER" in
            ????????-????-????-????-????????????) ;;
            *) echo "FINAL=BAD_ORDER_ARG"; exit 1 ;;
          esac
          : > /tmp/o38seen.txt
          polls=0
          FINAL=WINDOW
          # 38383 window: 15 polls, 20 s apart. Query by author and exact d tag.
          while [ $polls -lt 15 ]; do
            polls=$((polls+1))
            timeout 40 nak -v req -k 38383 -a "$DAEMON" -t d="$ORDER" --limit 5 ws://localhost:8080 < /dev/null > /tmp/o38.txt 2> $E/order38383.req.stderr
            PRC=$?
            echo "e38383_poll=$polls rc=$PRC lines=$(grep -c . /tmp/o38.txt || true)"
            if [ "$PRC" != "0" ]; then FINAL=QUERY_FAILED; break; fi
            cat /tmp/o38.txt >> /tmp/o38seen.txt
            n=$(sort -u /tmp/o38seen.txt | grep -c . || true)
            if [ "$n" -gt 1 ]; then FINAL=AMBIGUOUS_38383; break; fi
            sleep 20
          done
          n=$(sort -u /tmp/o38seen.txt | grep -c . || true)
          if [ "$FINAL" = "WINDOW" ]; then
            if [ "$n" = "1" ]; then FINAL=FOUND; elif [ "$n" = "0" ]; then FINAL=MISSING_38383; else FINAL=AMBIGUOUS_38383; fi
          fi
          if [ "$FINAL" = "FOUND" ]; then
            sort -u /tmp/o38seen.txt > $E/order38383.json
            nak verify < $E/order38383.json > $E/order38383.verify.stdout 2> $E/order38383.verify.stderr
            echo $? > $E/order38383.verify.rc
            # Negative control 1: content changed, original sig kept. Expect rc 123.
            sed 's/"content":""/"content":"x"/' $E/order38383.json > /tmp/neg1.json
            c1=$(grep -c '"content":"x"' /tmp/neg1.json || true)
            nak verify < /tmp/neg1.json > $E/negative_control_content.stdout 2> $E/negative_control_content.stderr
            echo $? > $E/negative_control_content.rc
            # Negative control 2: sig first hex digit changed, id and content kept. Expect rc 123.
            sig=$(grep -o '"sig":"[0-9a-f]*"' $E/order38383.json | cut -d'"' -f4)
            c=$(printf '%s' "$sig" | cut -c1)
            if [ "$c" = "0" ]; then r=1; else r=0; fi
            newsig="$r$(printf '%s' "$sig" | cut -c2-)"
            sed "s/\"sig\":\"$sig\"/\"sig\":\"$newsig\"/" $E/order38383.json > /tmp/neg2.json
            c2=$(grep -c "\"sig\":\"$newsig\"" /tmp/neg2.json || true)
            nak verify < /tmp/neg2.json > $E/negative_control_sig.stdout 2> $E/negative_control_sig.stderr
            echo $? > $E/negative_control_sig.rc
            echo "neg_control_content_substitutions=$c1 neg_control_sig_substitutions=$c2"
            rm -f /tmp/neg1.json /tmp/neg2.json
          fi
          rm -f /tmp/o38.txt /tmp/o38seen.txt
          echo "FINAL=$FINAL"
          SH
          chmod 700 "$RUNNER_TEMP/exec1.sh" "$RUNNER_TEMP/exec2.sh"
          test -s "$RUNNER_TEMP/exec1.sh" && test -s "$RUNNER_TEMP/exec2.sh"
          echo "container scripts written"
      - name: Run NewOrder client in container (send, ACK window, verify, decrypt, key check)
        working-directory: mostro-regtest
        run: |
          set +x
          set -uo pipefail
          umask 077
          cid=$(docker compose ps -q nostr_relay)
          test -n "$cid"
          docker cp "$RUNNER_TEMP/cli.hex" "$cid:/tmp/cli.hex"
          rm -f "$RUNNER_TEMP/cli.hex"
          test ! -e "$RUNNER_TEMP/cli.hex"
          docker cp "$RUNNER_TEMP/exec1.sh" "$cid:/tmp/exec1.sh"
          daemon_pub=$(cat "$RUNNER_TEMP/daemon.pub")
          cli_pub=$(cat "$RUNNER_TEMP/cli.pub")
          timeout 900 docker compose exec -T nostr_relay sh /tmp/exec1.sh "$daemon_pub" "$cli_pub" > "$RUNNER_TEMP/exec1.out" 2> "$RUNNER_TEMP/exec1.err"
          echo "exec1 rc=$?"
          cat "$RUNNER_TEMP/exec1.out"
          echo "exec1 stderr lines: $(wc -l < "$RUNNER_TEMP/exec1.err")"
          rm -rf "$RUNNER_TEMP/evidence"
          docker cp "$cid:/tmp/evidence" "$RUNNER_TEMP/"
          test -d "$RUNNER_TEMP/evidence"
          echo "evidence copied from container: $(ls "$RUNNER_TEMP/evidence" | wc -l) files"
      - name: Read decrypted ACK, validate shape, derive ORDER (runner only; jq)
        working-directory: mostro-regtest
        run: |
          set +x
          set -uo pipefail
          E="$RUNNER_TEMP/evidence"
          : > "$RUNNER_TEMP/shape.txt"
          final=$({ grep -a "^FINAL=" "$RUNNER_TEMP/exec1.out" || true; } | tail -1 | cut -d= -f2)
          echo "exec1_final=$final" >> "$RUNNER_TEMP/shape.txt"
          if [ "$final" != "SELECTED" ] && [ "$final" != "DECRYPT_FAIL" ]; then
            echo "shape=not_applicable" >> "$RUNNER_TEMP/shape.txt"
          elif [ "$(cat $E/ack_decrypt.rc 2>/dev/null)" != "0" ]; then
            echo "shape=decrypt_not_ok" >> "$RUNNER_TEMP/shape.txt"
          else
            if jq -e 'type=="array" and length==3 and .[1]==null and .[2]==null and (.[0]|type=="object") and ((.[0]|keys)==["order"]) and (.[0].order.action=="new-order") and (.[0].order.id|type=="string") and (.[0].order.payload.order.kind=="sell")' "$E/ack_decrypt.stdout" > /dev/null 2>&1; then
              echo "shape=new_order_ok" >> "$RUNNER_TEMP/shape.txt"
              jq -r '.[0].order.id' "$E/ack_decrypt.stdout" > "$RUNNER_TEMP/order.txt"
            elif jq -e 'type=="array" and length==3 and (.[0]|type=="object") and ((.[0]|keys)==["cant-do"])' "$E/ack_decrypt.stdout" > /dev/null 2>&1; then
              echo "shape=cant_do_diagnostic" >> "$RUNNER_TEMP/shape.txt"
            else
              echo "shape=unexpected_shape" >> "$RUNNER_TEMP/shape.txt"
            fi
          fi
          cat "$RUNNER_TEMP/shape.txt"
          if [ -s "$RUNNER_TEMP/order.txt" ]; then
            ORDER=$(cat "$RUNNER_TEMP/order.txt")
            logid=$(docker logs satonero-daemon 2>&1 | { grep -a "New order saved Id: $ORDER" || true; } | wc -l)
            echo "order id matches daemon 'New order saved' log line: $([ "$logid" -ge 1 ] && echo true || echo false)"
          fi
      - name: Run 38383 lookup and verification in container (only for a validated new-order ACK)
        working-directory: mostro-regtest
        run: |
          set +x
          set -uo pipefail
          if ! grep -q "^shape=new_order_ok" "$RUNNER_TEMP/shape.txt"; then
            echo "skipped: no validated new-order ACK"; exit 0
          fi
          cid=$(docker compose ps -q nostr_relay)
          docker cp "$RUNNER_TEMP/exec2.sh" "$cid:/tmp/exec2.sh"
          ORDER=$(cat "$RUNNER_TEMP/order.txt")
          daemon_pub=$(cat "$RUNNER_TEMP/daemon.pub")
          timeout 600 docker compose exec -T nostr_relay sh /tmp/exec2.sh "$daemon_pub" "$ORDER" > "$RUNNER_TEMP/exec2.out" 2> "$RUNNER_TEMP/exec2.err"
          echo "exec2 rc=$?"
          cat "$RUNNER_TEMP/exec2.out"
          docker cp "$cid:/tmp/evidence/." "$RUNNER_TEMP/evidence/"
          ls "$RUNNER_TEMP/evidence" | wc -l
      - name: C1 and ACK structural checks (runner; jq; public fields only)
        working-directory: mostro-regtest
        run: |
          set +x
          set -uo pipefail
          E="$RUNNER_TEMP/evidence"
          : > "$RUNNER_TEMP/c1.txt"
          daemon_pub=$(cat "$RUNNER_TEMP/daemon.pub")
          cli_pub=$(cat "$RUNNER_TEMP/cli.pub")
          if [ -s "$RUNNER_TEMP/order.txt" ] && [ -s "$E/order38383.json" ]; then
            ORDER=$(cat "$RUNNER_TEMP/order.txt")
            lines=$(grep -c . "$E/order38383.json" || true)
            echo "c1_single_line=$([ "$lines" = "1" ] && echo pass || echo fail)" >> "$RUNNER_TEMP/c1.txt"
            if jq -e --arg d "$daemon_pub" --arg o "$ORDER" '.kind==38383 and .pubkey==$d and ([.tags[]|select(.[0]=="d")]==[["d",$o]])' "$E/order38383.json" > /dev/null; then
              echo "c1_kind_author_exact_d_tag=pass" >> "$RUNNER_TEMP/c1.txt"
            else
              echo "c1_kind_author_exact_d_tag=fail" >> "$RUNNER_TEMP/c1.txt"
            fi
            logeid=$(docker logs satonero-daemon 2>&1 | { grep -a "Publishing Event Id" || true; } | { grep -a "$ORDER" || true; } | { grep -oE 'Event Id: [0-9a-f]{64}' || true; } | tail -1 | cut -d' ' -f3)
            evid=$(jq -r .id "$E/order38383.json")
            if [ -n "$logeid" ] && [ "$logeid" = "$evid" ]; then
              echo "c1_event_id_matches_publish_log=pass" >> "$RUNNER_TEMP/c1.txt"
            else
              echo "c1_event_id_matches_publish_log=fail" >> "$RUNNER_TEMP/c1.txt"
            fi
            echo "c1_signature_verify_rc=$(cat $E/order38383.verify.rc 2>/dev/null || echo missing)" >> "$RUNNER_TEMP/c1.txt"
            echo "c1_neg_content_rc=$(cat $E/negative_control_content.rc 2>/dev/null || echo missing)" >> "$RUNNER_TEMP/c1.txt"
            echo "c1_neg_sig_rc=$(cat $E/negative_control_sig.rc 2>/dev/null || echo missing)" >> "$RUNNER_TEMP/c1.txt"
          else
            echo "c1_not_evaluated=true" >> "$RUNNER_TEMP/c1.txt"
          fi
          if [ -s "$E/ack14.json" ]; then
            lines=$(grep -c . "$E/ack14.json" || true)
            if [ "$lines" = "1" ] && jq -e --arg d "$daemon_pub" --arg c "$cli_pub" '.kind==14 and .pubkey==$d and ([.tags[]|select(.[0]=="p")]==[["p",$c]])' "$E/ack14.json" > /dev/null; then
              echo "ack_kind_author_p_tag=pass" >> "$RUNNER_TEMP/c1.txt"
            else
              echo "ack_kind_author_p_tag=fail" >> "$RUNNER_TEMP/c1.txt"
            fi
          fi
          cat "$RUNNER_TEMP/c1.txt"
      - name: Manifest (public values only; no key material)
        run: |
          set +x
          E="$RUNNER_TEMP/evidence"
          mkdir -p "$E"
          {
            echo "run_id=${GITHUB_RUN_ID:-unknown}"
            echo "utc=$(date -u +%FT%TZ)"
            echo "daemon_pubkey=$(cat "$RUNNER_TEMP/daemon.pub")"
            echo "client_pubkey=$(cat "$RUNNER_TEMP/cli.pub")"
            echo "order_id=$(cat "$RUNNER_TEMP/order.txt" 2>/dev/null || echo none)"
            echo "pins=satonero:2534f8b0f05ade36007445511e02747f4468109a mostro-regtest:c6adbdaaaf0a2152a0728dbce6adf11945f547bd nak:v0.22.2"
            echo "order_limit=1 retries=0 payments=0 channels=0"
          } > "$E/manifest.txt"
          cat "$E/manifest.txt"
      - name: Secret gate (results only; any failure = no artifact upload)
        id: gate
        run: |
          set +x
          set -uo pipefail
          E="$RUNNER_TEMP/evidence"
          OUT="$RUNNER_TEMP/secret_gate.txt"
          : > "$OUT"
          # 1. Client key exact match (computed in container, result only)
          km=$({ grep -a "^client_key_match=" "$RUNNER_TEMP/exec1.out" || true; } | tail -1 | cut -d= -f2)
          if [ "$km" = "false" ]; then r=pass; else r=fail; fi
          echo "check=client_key_exact_match result=$r count=$([ "$km" = "false" ] && echo 0 || echo 1)" >> "$OUT"
          # 2. Daemon nsec exact match (pattern read from file, never from argv)
          if [ ! -s "$RUNNER_TEMP/daemon.nsec" ]; then n=1; r=fail; elif grep -R -F -q -f "$RUNNER_TEMP/daemon.nsec" "$E"; then n=1; r=fail; else n=0; r=pass; fi
          echo "check=daemon_nsec_exact_match result=$r count=$n" >> "$OUT"
          # 3. Textual secret patterns (file counts only)
          pat='nsec1|ncryptsec|BEGIN [A-Z ]*PRIVATE|macaroon|cli\.hex|daemon\.nsec|AgE[A-Za-z0-9+/]{40,}'
          n=$({ grep -R -E -i -l -- "$pat" "$E" || true; } | wc -l)
          if [ "$n" = "0" ]; then r=pass; else r=fail; fi
          echo "check=secret_pattern_files result=$r count=$n" >> "$OUT"
          # 4. Hex-run allowlist on JSON artifacts and parsed plaintext (python; counts only)
          PY_RC=0
          python3 - "$E" "$OUT" "$RUNNER_TEMP/daemon.pub" "$RUNNER_TEMP/cli.pub" <<'PY' || PY_RC=$?
          import json, os, re, sys
          E, OUT = sys.argv[1], sys.argv[2]
          DAEMON_PUB = open(sys.argv[3]).read().strip().lower()
          CLIENT_PUB = open(sys.argv[4]).read().strip().lower()
          HEX = re.compile(r'[0-9a-fA-F]+')
          def load(name):
              p = os.path.join(E, name)
              if not os.path.exists(p) or os.path.getsize(p) == 0:
                  return None
              return open(p, encoding='utf-8', errors='replace').read()
          ids, sigs = {DAEMON_PUB, CLIENT_PUB}, set()
          texts = []
          for name, strip_content in (('order38383.json', False), ('ack14.json', True)):
              raw = load(name)
              if raw is None:
                  continue
              for line in raw.splitlines():
                  if not line.strip():
                      continue
                  ev = json.loads(line)
                  ids.add(ev['id']); ids.add(ev['pubkey']); sigs.add(ev['sig'])
                  if strip_content:
                      ev = dict(ev); ev.pop('content', None)
                  texts.append((name, json.dumps(ev, sort_keys=True)))
          pt = load('ack_decrypt.stdout')
          if pt:
              try:
                  arr = json.loads(pt)
                  texts.append(('ack_decrypt.stdout', json.dumps(arr[0], sort_keys=True)))
              except Exception:
                  texts.append(('ack_decrypt.stdout', pt))
          violations = 0
          for name, t in texts:
              for m in HEX.finditer(t):
                  run = m.group(0)
                  L = len(run)
                  if L < 32:
                      continue
                  if L == 64 and run.lower() in {x.lower() for x in ids}:
                      continue
                  if L == 128 and run.lower() in {x.lower() for x in sigs}:
                      continue
                  violations += 1
          r = 'pass' if violations == 0 else 'fail'
          with open(OUT, 'a') as fh:
              fh.write('check=hex_run_allowlist result=%s count=%d\n' % (r, violations))
          PY
          # 5. Plaintext shape (decided earlier by the runner)
          if grep -q "^shape=new_order_ok" "$RUNNER_TEMP/shape.txt" || grep -q "^shape=not_applicable" "$RUNNER_TEMP/shape.txt" || grep -q "^shape=decrypt_not_ok" "$RUNNER_TEMP/shape.txt" || grep -q "^shape=cant_do_diagnostic" "$RUNNER_TEMP/shape.txt"; then r=pass; else r=fail; fi
          echo "check=plaintext_shape_gate result=$r count=$([ $r = pass ] && echo 0 || echo 1)" >> "$OUT"
          # 6. Allowed evidence file names only
          bad=$(ls "$E" | { grep -v -E '^(manifest\.txt|order38383\.(json|verify\.(stdout|stderr|rc)|req\.stderr)|ack14\.(json|req\.(stderr|rc)|verify\.(stdout|stderr|rc))|ack_decrypt\.(stdout|stderr|rc)|negative_control_(content|sig)\.(stdout|stderr|rc))$' || true; } | wc -l)
          if [ "$bad" = "0" ]; then r=pass; else r=fail; fi
          echo "check=unexpected_file_names result=$r count=$bad" >> "$OUT"
          cat "$OUT"
          gate_ok=1
          [ "${PY_RC:-1}" = "0" ] || { echo "python hex check exit code: ${PY_RC:-unset}"; gate_ok=0; }
          for name in client_key_exact_match daemon_nsec_exact_match secret_pattern_files hex_run_allowlist plaintext_shape_gate unexpected_file_names; do
            if grep -q "^check=$name result=pass count=[0-9][0-9]*$" "$OUT"; then :; else echo "not passed: $name"; gate_ok=0; fi
          done
          [ "$(grep -c '^check=' "$OUT")" = "6" ] || { echo "unexpected number of check lines"; gate_ok=0; }
          if [ "$gate_ok" = "1" ]; then
            echo "gate=pass" >> "$GITHUB_OUTPUT"
          else
            echo "gate=fail" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload policy (R7; results only)
        id: policy
        env:
          GATE_RESULT: ${{ steps.gate.outputs.gate }}
        run: |
          set +x
          set -uo pipefail
          P="$RUNNER_TEMP"
          f1=$({ grep -a "^FINAL=" "$P/exec1.out" 2>/dev/null || true; } | tail -1 | cut -d= -f2)
          f2=$({ grep -a "^FINAL=" "$P/exec2.out" 2>/dev/null || true; } | tail -1 | cut -d= -f2)
          sh_state=$({ grep -a "^shape=" "$P/shape.txt" 2>/dev/null || true; } | tail -1 | cut -d= -f2)
          upload=no
          reason=none
          if [ "${GATE_RESULT:-}" != "pass" ]; then
            reason=secret_gate_not_passed
          elif [ "$f1" = "SELECTED" ] && [ "$f2" = "FOUND" ] && [ "$sh_state" = "new_order_ok" ]; then
            upload=yes; reason=success_path
          elif [ "$f1" = "QUERY_FAILED" ] || [ "$f2" = "QUERY_FAILED" ] || [ "$f1" = "ACK_FETCH_FAIL" ] || [ "$f1" = "MISSING_ACK" ] || [ "$f1" = "DECRYPT_FAIL" ]; then
            upload=yes; reason=diagnostic_R7
          else
            reason=state_not_in_upload_policy
          fi
          echo "upload=$upload" >> "$GITHUB_OUTPUT"
          echo "policy: upload=$upload reason=$reason exec1=${f1:-none} exec2=${f2:-none} shape=${sh_state:-none} gate=${GATE_RESULT:-none}"
      - name: Upload evidence artifact (only if the upload policy allows it; gate must pass)
        if: steps.policy.outputs.upload == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: phase4f-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 1
          if-no-files-found: error
      - name: Verdict (strict; PASS only if every condition holds)
        if: always()
        env:
          GATE_RESULT: ${{ steps.gate.outputs.gate }}
        run: |
          set +x
          fin=$(grep -a "^FINAL=" "$RUNNER_TEMP/exec1.out" 2>/dev/null | tail -1 | cut -d= -f2)
          sh_state=$(grep -a "^shape=" "$RUNNER_TEMP/shape.txt" 2>/dev/null | tail -1 | cut -d= -f2)
          fin2=$(grep -a "^FINAL=" "$RUNNER_TEMP/exec2.out" 2>/dev/null | tail -1 | cut -d= -f2)
          gate="${GATE_RESULT:-}"
          echo "exec1=${fin:-none} shape=${sh_state:-none} exec2=${fin2:-none} secret_gate=${gate:-none}"
          c1=$(cat "$RUNNER_TEMP/c1.txt" 2>/dev/null)
          echo "$c1" | grep -q "fail" && c1ok=no || c1ok=yes
          echo "$c1" | grep -q "^c1_kind_author_exact_d_tag=pass" && echo "$c1" | grep -q "^c1_event_id_matches_publish_log=pass" && echo "$c1" | grep -q "^c1_signature_verify_rc=0" && echo "$c1" | grep -q "^c1_neg_content_rc=123" && echo "$c1" | grep -q "^c1_neg_sig_rc=123" && c1full=yes || c1full=no
          if [ "$sh_state" = "cant_do_diagnostic" ]; then
            echo "DIAGNOSTIC ONLY: defined CantDo ACK. NOT a successful kind 38383 publication."; exit 1
          fi
          if [ "$fin" = "QUERY_FAILED" ] || [ "$fin" = "ACK_FETCH_FAIL" ]; then
            echo "INCONCLUSIVE: ACK query/fetch failed ($fin); no decrypt attempted"; exit 1
          fi
          if [ "$fin" = "MISSING_ACK" ] || [ "$fin" = "AMBIGUOUS_ACK" ]; then
            echo "INCONCLUSIVE: ACK window result $fin (no decrypt attempted)"; exit 1
          fi
          if [ "$gate" != "pass" ]; then
            echo "FAIL: secret gate did not pass; no artifact uploaded"; exit 1
          fi
          if [ "$fin" = "SELECTED" ] || [ "$fin" = "DECRYPT_FAIL" ]; then
            if [ "$sh_state" = "new_order_ok" ] && [ "$fin2" = "FOUND" ] && [ "$c1ok" = "yes" ] && [ "$c1full" = "yes" ]; then
              echo "SUCCESS: kind 38383 published by daemon, exact d tag = order id, signature verified, negative controls rejected, ACK validated and decrypted."; exit 0
            fi
          fi
          if [ "$fin2" = "QUERY_FAILED" ]; then
            echo "INCONCLUSIVE: 38383 query failed; no artifact-based success"; exit 1
          fi
          echo "INCONCLUSIVE/FAIL: exec1=$fin shape=$sh_state exec2=$fin2 c1=$c1full"; exit 1
      - name: Daemon and relay log capture (filtered; always)
        if: always()
        working-directory: mostro-regtest
        run: |
          set +x
          docker inspect --format 'daemon status={{.State.Status}} exitcode={{.State.ExitCode}} restarts={{.RestartCount}}' satonero-daemon || true
          docker logs satonero-daemon 2>&1 | grep -a -i -E "new order|publishing event|maintenance|reject|invalid|cant|error|warn|order id" | grep -a -v "Sending replaceable event" | tail -120 || true
          docker compose logs --no-color --tail 300 nostr_relay 2>&1 | grep -a -i -E "persisted event|reject|invalid|NOTICE|CLOSED" | tail -60 || true
      - name: Cleanup (always) with removal verification
        if: always()
        working-directory: mostro-regtest
        run: |
          set +x
          cid=$(docker compose ps -q nostr_relay 2>/dev/null || true)
          if [ -n "$cid" ]; then
            docker exec "$cid" sh -c 'rm -rf /tmp/evidence /tmp/exec1.sh /tmp/exec2.sh /tmp/cli.hex /tmp/keypat /tmp/pub.out /tmp/cand.txt /tmp/seen.txt /tmp/ct.txt /tmp/o38seen.txt /tmp/neg1.json /tmp/neg2.json' || true
          fi
          rm -rf "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/cli.hex" "$RUNNER_TEMP/exec1.sh" "$RUNNER_TEMP/exec2.sh" "$RUNNER_TEMP/exec1.out" "$RUNNER_TEMP/exec1.err" "$RUNNER_TEMP/exec2.out" "$RUNNER_TEMP/exec2.err" "$RUNNER_TEMP/order.txt" "$RUNNER_TEMP/shape.txt" "$RUNNER_TEMP/c1.txt" "$RUNNER_TEMP/secret_gate.txt" || true
          docker rm -f satonero-daemon >/dev/null 2>&1 || true
          docker volume rm satonero-config >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/daemon.nsec" "$RUNNER_TEMP/daemon.pub" "$RUNNER_TEMP/settings.toml" "$RUNNER_TEMP/synced_at" || true
          docker compose down -v || true
          docker system prune -af --volumes || true
          df -h /
          echo "== removal verification =="
          echo "satonero-daemon containers left: [$(docker ps -a -q --filter name=satonero-daemon)]"
          echo "satonero-config volumes left: [$(docker volume ls -q --filter name=satonero-config)]"
          echo "regtest containers left: [$(docker ps -a -q --filter name=mostro-regtest-)]"
          echo "regtest volumes left: [$(docker volume ls -q --filter name=mostro-regtest_)]"
          left=""
          for f in daemon.nsec cli.hex exec1.sh exec2.sh evidence; do test -e "$RUNNER_TEMP/$f" && left="$left $f"; done
          echo "runner temp credential/evidence files left:[$left]"
          if [ -z "$(docker ps -a -q --filter name=satonero-daemon)" ] && [ -z "$(docker volume ls -q --filter name=satonero-config)" ] && [ -z "$(docker ps -a -q --filter name=mostro-regtest-)" ] && [ -z "$(docker volume ls -q --filter name=mostro-regtest_)" ] && [ -z "$left" ]; then echo "CLEANUP VERIFIED"; else echo "CLEANUP NOT VERIFIED"; exit 1; fi
