          docker rm -f satonero-daemon >/dev/null 2>&1 || true
          docker volume rm satonero-config >/dev/null 2>&1 || true
          docker compose down -v || true
          docker system prune -af --volumes || true
          cleanup_failed=0
          [ "${resolution_ok:-0}" = 1 ] || cleanup_failed=1
          verify_absent() { label=$1; shift; if output=$("$@" 2>/dev/null); then if [ -z "$output" ]; then echo "absence confirmed: $label"; else echo "resource remains: $label"; cleanup_failed=1; fi; else rc=$?; echo "inspection failed: $label rc=$rc"; cleanup_failed=1; fi; }
          verify_absent 'satonero daemon containers' docker ps -a -q --filter name=satonero-daemon
          verify_absent 'satonero config volumes' docker volume ls -q --filter name=satonero-config
          verify_absent 'regtest containers' docker ps -a -q --filter name=mostro-regtest-
          verify_absent 'regtest volumes' docker volume ls -q --filter name=mostro-regtest_
          if python3 - "$RUNNER_TEMP" <<'PY'
          import pathlib, sys
          root=pathlib.Path(sys.argv[1])
          names=('maker.hex','taker.hex','daemon.nsec','maker.pub','taker.pub','daemon.pub','settings.toml','maker.sh','taker.sh','addinvoice.sh','maker.out','maker.err','taker.out','taker.err','addinvoice.out','addinvoice.err','taker_invoice.txt','order_id.txt','shape.txt','invoice_shape.txt','handshake_result.txt','secret_gate.txt','evidence','safe-artifact','stagea_hold','stagea_payout','stagea_vars','stagea_payment_state','stagea_tstart','stagea_pay_pid','stagea_dm.sh','stagea_dm.out','stagea_dm.err','alice_pay.out','alice_pay.err')
          try:
              root.lstat(); left=[]
              for name in names:
                  try: (root/name).lstat()
                  except FileNotFoundError: continue
                  left.append(name)
          except OSError as exc:
              print('runner-temp inspection failed: '+str(exc)); raise SystemExit(2)
          if left: print('runner-temp resources remain: '+','.join(left)); raise SystemExit(1)
          print('runner-temp absence confirmed')
          PY
          then echo 'runner-temp absence confirmed'; else rc=$?; echo "runner-temp inspection/absence failed rc=$rc"; cleanup_failed=1; fi
          if [ "$cleanup_failed" = 0 ]; then echo 'CLEANUP VERIFIED'; else echo 'CLEANUP NOT VERIFIED'; exit 1; fi
      - name: Verdict
        if: always()
        env:
          GATE_RESULT: ${{ steps.stagea_gate.outputs.gate }}
          UPLOAD_OUTCOME: ${{ steps.stagea_upload.outcome }}
          CLEANUP_OUTCOME: ${{ steps.stagea_cleanup.outcome }}
        run: |
          set +x
          gate=${GATE_RESULT:-missing}
          printf 'PHASE5A_GATE=%s UPLOAD=%s CLEANUP=%s\n' "$gate" "${UPLOAD_OUTCOME:-missing}" "${CLEANUP_OUTCOME:-missing}"
          if [ "$gate" != pass ]; then echo 'FAIL: Phase 5A gate'; exit 1; fi
          if [ "${UPLOAD_OUTCOME:-}" != success ]; then echo 'FAIL: artifact upload'; exit 1; fi
          if [ "${CLEANUP_OUTCOME:-}" != success ]; then echo 'FAIL: cleanup'; exit 1; fi
